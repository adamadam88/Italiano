{id:"4.1", t:"Dia 1 · El passato prossimo amb avere", html:`
<p>És el passat que més es fa servir parlant. Es forma com «he parlat»: el present d'<i>avere</i> i el participi.</p>
<table><tr><th>Infinitiu</th><th>Participi</th><th>Exemple</th></tr>
<tr><td>-are</td><td><b>-ato</b></td><td><i>parlare → ho parlato</i></td></tr>
<tr><td>-ere</td><td><b>-uto</b></td><td><i>vendere → ho venduto</i></td></tr>
<tr><td>-ire</td><td><b>-ito</b></td><td><i>dormire → ho dormito</i></td></tr></table>
<p><i>ho parlato, hai parlato, ha parlato, abbiamo parlato, avete parlato, hanno parlato</i></p>
<p><b>Serveix per a «he menjat» i per a «vaig menjar».</b> L'italià parlat no fa la diferència: <i>Ieri ho mangiato una pizza</i> vol dir «Ahir vaig menjar una pizza».</p>
<p><b>La negació</b> va davant de l'auxiliar: <i>Non ho capito.</i></p>
<p>Amb <i>avere</i> el participi no canvia mai: <i>Maria ha mangiato. I ragazzi hanno mangiato.</i></p>`,
ex:[["Io ___ una pizza. (mangiare)",["ho mangiato"]],["Tu ___ la partita? (guardare)",["hai guardato"]],["Lei ___ a Roma. (lavorare)",["ha lavorato"]],["Noi ___ tutto. (capire)",["abbiamo capito"]],["Voi ___ bene? (dormire)",["avete dormito"]],["Loro ___ la casa. (vendere)",["hanno venduto"]],["Io ___ un messaggio. (ricevere)",["ho ricevuto"]],["Tu ___ il biglietto? (comprare)",["hai comprato"]],["Lui non ___ . (studiare)",["ha studiato"]],["Noi ___ musica. (ascoltare)",["abbiamo ascoltato"]],["Io ___ il lavoro. (finire)",["ho finito"]],["Loro ___ a calcio. (giocare)",["hanno giocato"]]],
prod:"Escriu 5 coses que has fet avui amb el passato prossimo."},

{id:"4.2", t:"Dia 2 · Els participis irregulars", html:`
<p>Molts verbs en <i>-ere</i> tenen el participi irregular. Aquests vint cobreixen gairebé tot el que necessites.</p>
<table><tr><th>Verb</th><th>Participi</th><th>Verb</th><th>Participi</th></tr>
<tr><td>fare</td><td><b>fatto</b></td><td>dire</td><td><b>detto</b></td></tr>
<tr><td>vedere</td><td><b>visto</b></td><td>prendere</td><td><b>preso</b></td></tr>
<tr><td>mettere</td><td><b>messo</b></td><td>scrivere</td><td><b>scritto</b></td></tr>
<tr><td>leggere</td><td><b>letto</b></td><td>aprire</td><td><b>aperto</b></td></tr>
<tr><td>chiudere</td><td><b>chiuso</b></td><td>chiedere</td><td><b>chiesto</b></td></tr>
<tr><td>rispondere</td><td><b>risposto</b></td><td>perdere</td><td><b>perso</b></td></tr>
<tr><td>vincere</td><td><b>vinto</b></td><td>bere</td><td><b>bevuto</b></td></tr>
<tr><td>scegliere</td><td><b>scelto</b></td><td>spendere</td><td><b>speso</b></td></tr>
<tr><td>accendere</td><td><b>acceso</b></td><td>rompere</td><td><b>rotto</b></td></tr>
<tr><td>correre</td><td><b>corso</b></td><td>decidere</td><td><b>deciso</b></td></tr></table>
<p><b>Truc.</b> Molts s'assemblen al català: <i>fatto</i> i «fet», <i>detto</i> i «dit», <i>visto</i> i «vist», <i>preso</i> i «pres», <i>messo</i> i «mès», <i>scritto</i> i «escrit», <i>aperto</i> i «obert».</p>`,
ex:[["Io ___ colazione. (fare)",["ho fatto"]],["Che cosa ___ ? (dire, tu)",["hai detto"]],["Lei ___ un film. (vedere)",["ha visto"]],["Noi ___ il treno. (prendere)",["abbiamo preso"]],["Voi ___ il libro? (leggere)",["avete letto"]],["Loro ___ la partita. (vincere)",["hanno vinto"]],["Io ___ una mail. (scrivere)",["ho scritto"]],["Tu ___ la finestra? (aprire)",["hai aperto"]],["Lui ___ le chiavi. (perdere)",["ha perso"]],["Noi ___ un caffè. (bere)",["abbiamo bevuto"]],["Io ___ il telefono sul tavolo. (mettere)",["ho messo"]],["Loro ___ il conto. (chiedere)",["hanno chiesto"]]],
prod:"Explica què vas fer ahir amb 6 verbs de la taula."},

{id:"4.3", t:"Dia 3 · El passato prossimo amb essere", html:`
<p>Un grup de verbs fa el passat amb <i>essere</i> en lloc d'<i>avere</i>. Són els de <b>moviment</b> i els de <b>canvi d'estat</b>.</p>
<p>Moviment: <i>andare, venire, arrivare, partire, tornare, entrare, uscire, salire, scendere, cadere</i>.</p>
<p>Quedar-se i canviar: <i>restare, rimanere</i> (rimasto), <i>essere</i> i <i>stare</i> (stato), <i>nascere</i> (nato), <i>morire</i> (morto), <i>diventare, succedere</i> (successo).</p>
<p><b>Amb essere el participi concorda</b> amb qui fa l'acció, com un adjectiu:</p>
<table><tr><th></th><th>Home</th><th>Dona</th></tr>
<tr><td>io</td><td>sono andat<b>o</b></td><td>sono andat<b>a</b></td></tr>
<tr><td>tu</td><td>sei andat<b>o</b></td><td>sei andat<b>a</b></td></tr>
<tr><td>lui, lei</td><td>è andat<b>o</b></td><td>è andat<b>a</b></td></tr>
<tr><td>noi</td><td>siamo andat<b>i</b></td><td>siamo andat<b>e</b></td></tr>
<tr><td>voi</td><td>siete andat<b>i</b></td><td>siete andat<b>e</b></td></tr>
<tr><td>loro</td><td>sono andat<b>i</b></td><td>sono andat<b>e</b></td></tr></table>
<p><i>Che cosa è successo?</i> (Què ha passat?) · <i>Sono nato a Barcellona.</i> · <i>Maria è arrivata ieri.</i></p>`,
ex:[["Io ___ a Roma. (andare)",["sono andato","sono andata"]],["Tu ___ tardi. (arrivare)",["sei arrivato","sei arrivata"]],["Lei ___ ieri. (partire)",["è partita"]],["Lui ___ a casa. (tornare)",["è tornato"]],["Noi ___ al cinema. (andare)",["siamo andati","siamo andate"]],["Voi ___ presto? (uscire)",["siete usciti","siete uscite"]],["Loro ___ in Italia. (nascere)",["sono nati","sono nate"]],["Che cosa ___ ? (succedere)",["è successo"]],["Maria ___ a casa. (restare)",["è restata"]],["Io ___ a Barcellona. (nascere)",["sono nato","sono nata"]],["Il treno ___ in ritardo. (arrivare)",["è arrivato"]],["Le ragazze ___ alle otto. (venire)",["sono venute"]]],
prod:"Explica una sortida o un viatge: on vas anar, quan vas arribar i quan vas tornar. 6 frases."},

{id:"4.4", t:"Dia 4 · Essere o avere?", html:`
<p>La pregunta que et faràs cada vegada. Aquesta és la regla pràctica:</p>
<ul><li><b>Avere</b> si el verb pot tenir un «què» darrere: <i>ho mangiato <u>una pizza</u>, ho visto <u>Marco</u>, ho letto <u>un libro</u></i>.</li>
<li><b>Essere</b> si és de moviment d'un lloc a un altre, de canvi d'estat o reflexiu: <i>sono andato, è nato, mi sono alzato</i>.</li></ul>
<p><b>Tres sorpreses.</b></p>
<ul><li><i>Camminare, viaggiare, correre, dormire</i> i <i>lavorare</i> van amb <i>avere</i>, encara que hi hagi moviment: <i>ho camminato, ho viaggiato</i>. Diuen què fas i no cap on vas.</li>
<li><i>Essere</i> i <i>stare</i> fan <i>sono stato</i>, tots dos.</li>
<li><i>Piacere</i> va amb <i>essere</i>: <i>Il film mi è piaciuto. La canzone mi è piaciuta.</i></li></ul>
<p>Recorda que el participi només concorda quan l'auxiliar és <i>essere</i>.</p>`,
ex:[["Io ___ una pizza. (mangiare)",["ho mangiato"]],["Io ___ al mare. (andare)",["sono andato","sono andata"]],["Lei ___ un libro. (leggere)",["ha letto"]],["Lei ___ presto. (arrivare)",["è arrivata"]],["Noi ___ molto. (camminare)",["abbiamo camminato"]],["Noi ___ a casa. (tornare)",["siamo tornati","siamo tornate"]],["Loro ___ la verità. (dire)",["hanno detto"]],["Loro ___ ieri. (partire)",["sono partiti","sono partite"]],["Tu ___ bene? (dormire)",["hai dormito"]],["Il film mi ___ . (piacere)",["è piaciuto"]],["Voi ___ in treno? (viaggiare)",["avete viaggiato"]],["Marco ___ a Milano. (nascere)",["è nato"]]],
prod:"Escriu 4 frases amb essere i 4 amb avere sobre el cap de setmana passat."},

{id:"4.5", t:"Dia 5 · Quan va passar: ieri, fa, scorso, già, mai", html:`
<p><b>Per situar en el temps:</b></p>
<ul><li><i>ieri, ieri sera, l'altro ieri, stamattina</i></li>
<li><i>la settimana scorsa, il mese scorso, l'anno scorso</i></li>
<li><i>due giorni <b>fa</b>, un anno <b>fa</b></i> («fa» va al darrere)</li></ul>
<p><b>Quatre adverbis que van entre l'auxiliar i el participi:</b></p>
<table><tr><th>Italià</th><th>Català</th><th>Exemple</th></tr>
<tr><td><b>già</b></td><td>ja</td><td><i>Ho già mangiato.</i></td></tr>
<tr><td><b>non… ancora</b></td><td>encara no</td><td><i>Non ho ancora finito.</i></td></tr>
<tr><td><b>non… mai</b></td><td>mai</td><td><i>Non sono mai stato a Roma.</i></td></tr>
<tr><td><b>appena</b></td><td>tot just</td><td><i>Ho appena finito.</i> (Acabo d'acabar.)</td></tr></table>
<p><b>«Fa un mes que estudio»</b> no es diu amb el passat. Es diu amb el present i <b>da</b>: <i>Studio italiano da un mese.</i></p>`,
ex:[["«ahir al vespre»",["ieri sera"]],["«fa dos anys»",["due anni fa"]],["«la setmana passada»",["la settimana scorsa"]],["«l'any passat»",["l'anno scorso"]],["Ho ___ mangiato. (ja)",["già"]],["Non ho ___ finito. (encara)",["ancora"]],["Non sono ___ stato a Roma. (mai)",["mai"]],["Ho ___ finito. (tot just)",["appena"]],["«Acabo d'arribar»",["sono appena arrivato","sono appena arrivata"]],["«Fa un mes que estudio italià»",["studio italiano da un mese"]],["«Ja has menjat?»",["hai già mangiato"]],["«Encara no he acabat»",["non ho ancora finito"]]],
prod:"Escriu 3 coses que ja has fet a la vida, 3 que no has fet mai i 2 que acabes de fer."},

{id:"4.6", t:"Dia 6 · Explicar un viatge i sessió llarga", html:`
<p><b>L'esquelet de qualsevol relat de viatge:</b></p>
<ul><li><i>Sono partito alle sette.</i> · <i>Ho preso il treno / l'aereo / la macchina.</i></li>
<li><i>Sono arrivato a… a mezzogiorno.</i></li>
<li><i>Prima ho visitato…, poi ho mangiato…, dopo sono andato…</i></li>
<li><i>Mi è piaciuto molto.</i> · <i>È stato bellissimo.</i> · <i>Faceva caldo.</i></li>
<li><i>Alla fine sono tornato a casa stanco ma contento.</i></li></ul>
<p>Per ordenar: <b>prima</b> (primer), <b>poi</b> (després), <b>dopo</b> (més tard), <b>alla fine</b> (al final).</p>
<p><b>Sessió llarga d'avui.</b> Un vídeo d'Easy Italian sobre viatges o sobre una ciutat italiana. Una cançó de Rino Gaetano amb la lletra. I el text de la setmana.</p>`,
ex:[["Ieri io ___ a Girona. (andare)",["sono andato","sono andata"]],["Noi ___ il treno delle otto. (prendere)",["abbiamo preso"]],["Il viaggio ___ due ore. (durare)",["è durato"]],["Loro ___ la città. (visitare)",["hanno visitato"]],["Io ___ molte foto. (fare)",["ho fatto"]],["«M'ha agradat molt»",["mi è piaciuto molto"]],["Tu ___ a casa tardi? (tornare)",["sei tornato","sei tornata"]],["Noi ___ bene. (mangiare)",["abbiamo mangiato"]],["«fa tres dies»",["tre giorni fa"]],["Lei ___ un regalo. (comprare)",["ha comprato"]]],
prod:"Escriu 100 paraules sobre l'últim viatge o l'última sortida que has fet."},

{id:"4.7", t:"Dia 7 · Prova 1", html:`
<p>La primera prova gran: vint-i-quatre preguntes sobre les quatre primeres setmanes. <b>S'aprova amb 19.</b></p>
<p>Abans o després, fes també aquestes tres coses, que no es poden corregir soles:</p>

<li>Explica el dia d'ahir en sis frases en passat.</li>
<li>Torna a escoltar la gravació de la setmana 1 i grava'n una de nova sobre el mateix tema.</li></ol>
<p>Si no arribes a 19, no tornis enrere. Baixa les paraules noves a 8 o 10 al dia durant dues setmanes i continua amb el calendari.</p>`,

prod:"Escriu 100 paraules: què has après aquest primer mes i què et costa més."}
);

{id:"5.1", t:"Dia 1 · Els pronoms directes: lo, la, li, le", html:`
<p>Substitueixen el «què» o el «qui» de la frase, com «el», «la», «els» i «les» en català. Van <b>davant</b> del verb.</p>
<table><tr><th></th><th>Singular</th><th>Plural</th></tr>
<tr><td>1a</td><td><b>mi</b> (em)</td><td><b>ci</b> (ens)</td></tr>
<tr><td>2a</td><td><b>ti</b> (et)</td><td><b>vi</b> (us)</td></tr>
<tr><td>3a masculí</td><td><b>lo</b> (el)</td><td><b>li</b> (els)</td></tr>
<tr><td>3a femení</td><td><b>la</b> (la)</td><td><b>le</b> (les)</td></tr></table>
<ul><li><i>Conosci Marco? Sì, <b>lo</b> conosco.</i></li>
<li><i>Vedi Maria? Sì, <b>la</b> vedo ogni giorno.</i></li>
<li><i>Compri i biglietti? Sì, <b>li</b> compro io.</i></li>
<li><i>Mangi le mele? No, non <b>le</b> mangio.</i></li></ul>
<p><b>Lo també vol dir «ho».</b> <i>Non lo so.</i> (No ho sé.) <i>Lo dico io.</i> (Ho dic jo.)</p>
<p><b>Amb un infinitiu</b> pot anar enganxat al final: <i>Voglio vederlo</i> o <i>Lo voglio vedere.</i></p>
<p><b>La negació</b> va davant del pronom: <i>Non lo conosco.</i></p>`,
ex:[["Conosci Marco? Sì, ___ conosco.",["lo"]],["Vedi Maria? Sì, ___ vedo.",["la"]],["Compri i biglietti? Sì, ___ compro.",["li"]],["Mangi le mele? Sì, ___ mangio.",["le"]],["Mi senti? Sì, ___ sento.",["ti"]],["Ci aspetti? Sì, ___ aspetto.",["vi"]],["Dov'è il telefono? Non ___ so.",["lo"]],["Guardi la partita? Sì, ___ guardo.",["la"]],["Leggi i giornali? No, non ___ leggo.",["li"]],["Chiami le tue amiche? Sì, ___ chiamo.",["le"]],["«Vull veure'l»",["voglio vederlo","lo voglio vedere"]],["«T'espero»",["ti aspetto"]]],
prod:"Respon 6 preguntes sobre tu fent servir pronoms. Exemple: Guardi la Serie A? Sì, la guardo ogni domenica."},

{id:"5.2", t:"Dia 2 · Els pronoms indirectes: mi, ti, gli, le", html:`
<p>Substitueixen «a qui». Només canvien a la tercera persona.</p>
<table><tr><th></th><th>Singular</th><th>Plural</th></tr>
<tr><td>1a</td><td><b>mi</b> (a mi)</td><td><b>ci</b> (a nosaltres)</td></tr>
<tr><td>2a</td><td><b>ti</b> (a tu)</td><td><b>vi</b> (a vosaltres)</td></tr>
<tr><td>3a</td><td><b>gli</b> (a ell) · <b>le</b> (a ella)</td><td><b>gli</b> (a ells, a elles)</td></tr></table>
<ul><li><i>Scrivo a Marco. → <b>Gli</b> scrivo.</i></li>
<li><i>Telefono a Maria. → <b>Le</b> telefono.</i></li>
<li><i>Parlo ai miei amici. → <b>Gli</b> parlo.</i></li></ul>
<p><b>Verbs que el demanen:</b> <i>dare, dire, scrivere, telefonare, chiedere, rispondere, mandare, regalare, spiegare</i>. I els que funcionen com <i>piacere</i>: <i>mancare</i> (trobar a faltar), <i>servire</i> (caldre), <i>sembrare</i> (semblar), <i>interessare</i>.</p>
<p><b>Directe o indirecte?</b> <i>Lo vedo</i> (el veig), però <i>gli telefono</i> (li truco). En italià es truca <b>a</b> algú.</p>
<p><i>Mi manchi.</i> (Et trobo a faltar: literalment «em faltes».) · <i>Mi serve una penna.</i> (Em cal un bolígraf.)</p>`,
ex:[["Scrivo a Marco. → ___ scrivo.",["gli"]],["Telefono a Maria. → ___ telefono.",["le"]],["Parlo ai miei amici. → ___ parlo.",["gli"]],["___ piace il calcio? (a tu)",["ti"]],["___ dai il tuo numero? (a mi)",["mi"]],["___ serve una penna. (a nosaltres)",["ci"]],["A Luca ___ piace la pasta.",["gli"]],["A Giulia non ___ interessa.",["le"]],["___ mando una foto. (a vosaltres)",["vi"]],["Lo o gli? ___ telefono stasera. (a ell)",["gli"]],["Lo o gli? ___ vedo domani. (a ell)",["lo"]],["«Et trobo a faltar»",["mi manchi"]]],
prod:"Escriu 6 frases sobre què regales, què dius o què escrius a persones de la teva vida."},

{id:"5.3", t:"Dia 3 · Ci, el teu «hi»", html:`
<p>Bona notícia per a qui parla català: <b>ci</b> funciona com «hi».</p>
<ul><li><i>Vai a Roma? Sì, <b>ci</b> vado domani.</i> (Hi vaig demà.)</li>
<li><i>Sei mai stato a Milano? Sì, <b>ci</b> sono stato due volte.</i></li>
<li><i><b>C'</b>è un problema. <b>Ci</b> sono due bar.</i> (Hi ha.)</li></ul>
<p><b>Expressions fixes amb ci</b> que sentiràs cada dia:</p>
<table><tr><th>Italià</th><th>Català</th></tr>
<tr><td><i>Ci penso io.</i></td><td>Ja me n'encarrego jo.</td></tr>
<tr><td><i>Non ci credo.</i></td><td>No m'ho crec.</td></tr>
<tr><td><i>Non ci riesco.</i></td><td>No me'n surto.</td></tr>
<tr><td><i>Ci vuole un'ora. Ci vogliono due ore.</i></td><td>Cal una hora. Calen dues hores.</td></tr>
<tr><td><i>Quanto ci metti?</i></td><td>Quant trigues?</td></tr>
<tr><td><i>Ci vediamo!</i></td><td>Ens veiem!</td></tr></table>
<p>A l'última, <i>ci</i> vol dir «ens». La mateixa paraula fa les dues feines.</p>`,
ex:[["Vai al cinema? Sì, ___ vado.",["ci"]],["Sei mai stato a Roma? Sì, ___ sono stato.",["ci"]],["«Hi vaig demà»",["ci vado domani"]],["«No m'ho crec»",["non ci credo"]],["«No me'n surto»",["non ci riesco"]],["___ vuole un'ora.",["ci"]],["___ vogliono due ore.",["ci"]],["«Ja me n'encarrego jo»",["ci penso io"]],["Vieni alla festa? No, non ___ vengo.",["ci"]],["«Hi ha un problema»",["c'è un problema"]],["«Cal paciència»",["ci vuole pazienza"]],["Quanto ___ metti?",["ci"]]],
prod:"Escriu 5 llocs on vas sovint i quan hi vas. Exemple: In palestra ci vado il lunedì."},

{id:"5.4", t:"Dia 4 · Ne, el teu «en»", html:`
<p>I <b>ne</b> funciona com «en». Substitueix una quantitat o «d'això».</p>
<ul><li><i>Quanti fratelli hai? <b>Ne</b> ho due.</i> (En tinc dos.)</li>
<li><i>Vuoi del caffè? Sì, <b>ne</b> voglio un po'.</i></li>
<li><i>Non <b>ne</b> ho.</i> (No en tinc.)</li></ul>
<p><b>Amb «de»:</b> <i>Ne parliamo domani.</i> (En parlem demà.) · <i>Che ne pensi?</i> (Què en penses?) · <i>Ne sono sicuro.</i> (N'estic segur.)</p>
<p><b>Andarsene</b> és «anar-se'n»: <i>Me ne vado.</i> (Me'n vaig.) <i>Se ne va.</i> (Se'n va.)</p>
<p><b>Ci o ne?</b> Si pots dir «hi» en català, és <i>ci</i>. Si pots dir «en», és <i>ne</i>. No falla gairebé mai.</p>`,
ex:[["Quanti fratelli hai? ___ ho due.",["ne"]],["Vuoi del caffè? Sì, ___ voglio un po'.",["ne"]],["«No en tinc»",["non ne ho"]],["«En parlem demà»",["ne parliamo domani"]],["«Què en penses?»",["che ne pensi","cosa ne pensi","che cosa ne pensi"]],["«Me'n vaig»",["me ne vado"]],["Quante mele compri? ___ compro tre.",["ne"]],["Ci o ne? Vai a Milano? Sì, ___ vado.",["ci"]],["Ci o ne? Hai amici italiani? Sì, ___ ho molti.",["ne"]],["«En vull dos»",["ne voglio due"]],["«N'estic segur»",["ne sono sicuro","ne sono sicura"]],["Bevi caffè? Sì, ___ bevo troppo.",["ne"]]],
prod:"Respon amb ne: quants germans tens, quants llibres llegeixes l'any, quants cafès prens al dia, quantes llengües parles."},

{id:"5.5", t:"Dia 5 · El passat dels reflexius i dels pronoms", html:`
<p><b>Tots els reflexius fan el passat amb essere</b>, i el participi concorda.</p>
<table><tr><th></th><th>alzarsi</th></tr>
<tr><td>io</td><td>mi sono alzat<b>o</b> / alzat<b>a</b></td></tr>
<tr><td>tu</td><td>ti sei alzato / alzata</td></tr>
<tr><td>lui, lei</td><td>si è alzato / alzata</td></tr>
<tr><td>noi</td><td>ci siamo alzat<b>i</b> / alzat<b>e</b></td></tr>
<tr><td>voi</td><td>vi siete alzati / alzate</td></tr>
<tr><td>loro</td><td>si sono alzati / alzate</td></tr></table>
<p><b>Amb lo, la, li, le davant d'avere, el participi també concorda.</b> És l'única vegada que ho fa amb <i>avere</i>.</p>
<ul><li><i>Hai visto Marco? Sì, <b>l'</b>ho vist<b>o</b>.</i></li>
<li><i>Hai visto Maria? Sì, <b>l'</b>ho vist<b>a</b>.</i></li>
<li><i>Hai comprato i biglietti? Sì, <b>li</b> ho comprat<b>i</b>.</i></li>
<li><i>Hai mangiato le mele? Sì, <b>le</b> ho mangiat<b>e</b>.</i></li></ul>
<p><i>Lo</i> i <i>la</i> s'apostrofen davant d'<i>ho, hai, ha</i>. <i>Li</i> i <i>le</i> no.</p>`,
ex:[["Io ___ alle sette. (alzarsi)",["mi sono alzato","mi sono alzata"]],["Tu ___ ? (divertirsi)",["ti sei divertito","ti sei divertita"]],["Lei ___ tardi. (svegliarsi)",["si è svegliata"]],["Noi ___ molto. (divertirsi)",["ci siamo divertiti","ci siamo divertite"]],["Loro ___ a Roma. (conoscersi)",["si sono conosciuti","si sono conosciute"]],["Lui ___ . (arrabbiarsi)",["si è arrabbiato"]],["Hai visto Marco? Sì, ___ visto.",["l'ho"]],["Hai visto Maria? Sì, l'ho ___ . (vedere)",["vista"]],["Hai comprato i biglietti? Sì, li ho ___ . (comprare)",["comprati"]],["Hai mangiato le mele? Sì, le ho ___ . (mangiare)",["mangiate"]],["Io ___ le mani. (lavarsi)",["mi sono lavato","mi sono lavata"]],["Voi ___ presto? (addormentarsi)",["vi siete addormentati","vi siete addormentate"]]],
prod:"Explica el matí d'avui en passat amb 6 verbs reflexius."},

{id:"5.6", t:"Dia 6 · Comprar roba i sessió llarga", html:`
<p><b>Frases per a una botiga de roba:</b></p>
<ul><li><i>Posso provare questa giacca?</i> · <i>Dov'è il camerino?</i> (l'emprovador)</li>
<li><i>Che taglia porta? Porto la M.</i> · <i>Che numero porta?</i> (de sabata)</li>
<li><i>Avete una taglia più grande / più piccola?</i></li>
<li><i>Mi sta bene.</i> · <i>Mi sta stretto.</i> (estret) · <i>Mi sta largo.</i> (ample)</li>
<li><i>Quanto costa? È in saldo?</i> (de rebaixes)</li>
<li><i>La prendo.</i> · <i>Ci penso.</i> (M'ho rumio.)</li></ul>
<p>Fixa't en els pronoms d'aquesta setmana: <i><b>la</b> prendo</i>, <i><b>mi</b> sta bene</i>, <i><b>ci</b> penso</i>.</p>
<p><b>Sessió llarga d'avui.</b> Un vídeo d'Easy Italian sobre compres o sobre moda. Una cançó de Mina o d'Adriano Celentano amb la lletra. I el diàleg de la setmana.</p>`,
ex:[["Bella questa giacca: ___ prendo.",["la"]],["Belle queste scarpe: ___ compro.",["le"]],["Questa maglia ___ sta bene. (a tu)",["ti"]],["Non ___ piace il colore. (a mi)",["mi"]],["«Quant costa?»",["quanto costa"]],["Ho visto i pantaloni e ___ ho comprati.",["li"]],["Di maglie, ___ ho comprate due.",["ne"]],["In quel negozio ___ vado spesso.",["ci"]],["A mia madre ___ regalo una sciarpa.",["le"]],["«M'ho rumio»",["ci penso"]]],
prod:"Escriu un diàleg de 8 línies en una botiga de roba."},

{id:"5.7", t:"Dia 7 · Prova de la setmana 5", html:`
<p>Vint preguntes sobre el bloc 5 i els pronoms. <b>Amb 16 encerts o més, passes a la setmana 6.</b></p>`,
ex:[["«sou, salari» en italià",["stipendio"]],["«vaga» en italià",["sciopero"]],["«periodista» en italià",["giornalista"]],["«descompte» en italià",["sconto"]],["«butxaca» en italià",["tasca"]],["«sabata» en italià",["scarpa"]],["«estalviar» en italià",["risparmiare"]],["«equivocar-se» en italià",["sbagliare"]],["«mandrós» en italià",["pigro"]],["«lloguer» en italià",["affitto"]],["«bolígraf» en italià",["penna"]],["«empresa» en italià",["azienda","impresa"]],["Conosci Giulia? Sì, ___ conosco.",["la"]],["A Marco ___ scrivo ogni settimana.",["gli"]],["Vai in Italia? Sì, ___ vado.",["ci"]],["Quanti libri hai? ___ ho dieci.",["ne"]],["Io ___ alle otto. (alzarsi, passat)",["mi sono alzato","mi sono alzata"]],["Hai visto le foto? Sì, le ho ___ . (vedere)",["viste"]],["«No ho sé»",["non lo so"]],["«No en tinc»",["non ne ho"]]],
prod:"Escriu 6 frases sobre els teus estudis o la teva feina."},

{id:"6.1", t:"Dia 1 · L'imperfetto: les formes", html:`
<p>És el temps de «parlava». Es forma igual als tres grups: es treu <i>-re</i> i s'hi afegeix <i>-vo, -vi, -va, -vamo, -vate, -vano</i>.</p>
<table><tr><th></th><th>parlare</th><th>prendere</th><th>dormire</th></tr>
<tr><td>io</td><td>parla<b>vo</b></td><td>prende<b>vo</b></td><td>dormi<b>vo</b></td></tr>
<tr><td>tu</td><td>parla<b>vi</b></td><td>prende<b>vi</b></td><td>dormi<b>vi</b></td></tr>
<tr><td>lui, lei</td><td>parla<b>va</b></td><td>prende<b>va</b></td><td>dormi<b>va</b></td></tr>
<tr><td>noi</td><td>parla<b>vamo</b></td><td>prende<b>vamo</b></td><td>dormi<b>vamo</b></td></tr>
<tr><td>voi</td><td>parla<b>vate</b></td><td>prende<b>vate</b></td><td>dormi<b>vate</b></td></tr>
<tr><td>loro</td><td>parla<b>vano</b></td><td>prende<b>vano</b></td><td>dormi<b>vano</b></td></tr></table>
<p><b>Només quatre irregulars.</b></p>
<ul><li><i>essere:</i> ero, eri, era, eravamo, eravate, erano</li>
<li><i>fare:</i> facevo · <i>dire:</i> dicevo · <i>bere:</i> bevevo</li></ul>
<p><b>L'accent.</b> <i>parLAvo, parlaVAmo</i>, però <i>parLAvano</i>, amb la força a la mateixa síl·laba que <i>parlavo</i>.</p>`,
ex:[["Io ___ a Roma. (abitare)",["abitavo"]],["Tu ___ molto. (studiare)",["studiavi"]],["Lei ___ felice. (essere)",["era"]],["Noi ___ un cane. (avere)",["avevamo"]],["Voi ___ a calcio? (giocare)",["giocavate"]],["Loro ___ sempre insieme. (essere)",["erano"]],["Io ___ piccolo. (essere)",["ero"]],["Lui ___ molto sport. (fare)",["faceva"]],["Noi ___ in campagna. (vivere)",["vivevamo"]],["Loro ___ tardi. (dormire)",["dormivano"]],["Tu che cosa ___ ? (dire)",["dicevi"]],["Io ___ molto latte. (bere)",["bevevo"]]],
prod:"Escriu 6 frases que comencin amb «Da piccolo…» sobre com eres i què feies."},

{id:"6.2", t:"Dia 2 · Quan es fa servir l'imperfetto", html:`
<p>Es fa servir quan en català diries «feia», «era», «anava». Té tres usos.</p>
<ol><li><b>Costums del passat.</b> <i>Da piccolo giocavo a calcio ogni giorno.</i></li>
<li><b>Descripcions.</b> <i>La casa era grande. Faceva freddo. Avevo dieci anni. C'era molta gente.</i></li>
<li><b>Una acció que estava passant.</b> <i>Mentre mangiavo, guardavo la televisione.</i></li></ol>
<p><b>Paraules que l'anuncien:</b> <i>sempre, spesso, di solito, ogni giorno, ogni estate, da piccolo, da bambino, mentre</i>.</p>
<p><b>C'era i c'erano</b> són el passat de <i>c'è</i> i <i>ci sono</i>: <i>C'era una volta…</i> (Hi havia una vegada…)</p>`,
ex:[["Da piccolo ___ sempre a calcio. (giocare, io)",["giocavo"]],["Ieri ___ freddo. (fare)",["faceva"]],["___ molta gente allo stadio. (hi havia)",["c'era"]],["Quando ___ dieci anni, vivevo a Girona. (avere, io)",["avevo"]],["La casa ___ grande e bella. (essere)",["era"]],["Ogni estate ___ al mare. (andare, noi)",["andavamo"]],["Mio nonno ___ sempre storie. (raccontare)",["raccontava"]],["Di solito ___ alle sette. (alzarsi, io)",["mi alzavo"]],["___ due gatti. (hi havia)",["c'erano"]],["Da bambini ___ molto. (ridere, noi)",["ridevamo"]],["Mia madre ___ molto bene. (cucinare)",["cucinava"]],["Non ___ niente. (sapere, io)",["sapevo"]]],
prod:"Descriu la casa o l'escola de quan eres petit en 6 frases."},

{id:"6.3", t:"Dia 3 · Imperfetto o passato prossimo?", html:`
<p>La diferència és la mateixa que en català entre «mirava» i «vaig mirar».</p>
<table><tr><th>Passato prossimo</th><th>Imperfetto</th></tr>
<tr><td>Un fet acabat, una vegada</td><td>El fons, el costum, el que durava</td></tr>
<tr><td><i>Ieri ho mangiato una pizza.</i></td><td><i>Da piccolo mangiavo la pizza ogni sabato.</i></td></tr>
<tr><td><i>È arrivato Marco.</i></td><td><i>Pioveva.</i></td></tr></table>
<p><b>Junts expliquen una història:</b> l'imperfetto pinta l'escena i el passato prossimo diu què va passar.</p>
<ul><li><i>Mentre <b>guardavo</b> la partita, <b>è arrivato</b> Luca.</i></li>
<li><i>Quando <b>sono uscito</b>, <b>pioveva</b>.</i></li>
<li><i><b>Ero</b> stanco e <b>sono andato</b> a letto.</i></li></ul>
<p><b>Pistes.</b> <i>Ieri, una volta, all'improvviso, alle otto</i> demanen passato prossimo. <i>Sempre, di solito, mentre, ogni giorno</i> demanen imperfetto.</p>`,
ex:[["Ieri ___ una pizza. (mangiare, io)",["ho mangiato"]],["Da piccolo ___ la pizza ogni sabato. (mangiare, io)",["mangiavo"]],["Mentre ___ , è arrivato Marco. (studiare, io)",["studiavo"]],["Mentre studiavo, ___ Marco. (arrivare)",["è arrivato"]],["Quando sono uscito, ___ . (piovere)",["pioveva"]],["All'improvviso ___ la luce. (spegnersi)",["si è spenta"]],["Ieri sera ___ stanco e sono andato a letto. (essere, io)",["ero"]],["L'anno scorso ___ in Italia due volte. (andare, noi)",["siamo andati","siamo andate"]],["Di solito ___ in treno. (viaggiare, noi)",["viaggiavamo"]],["Ieri ___ un film bellissimo. (vedere, io)",["ho visto"]],["___ le otto quando ho finito. (essere)",["erano"]],["Mentre ___ , ho sentito un rumore. (dormire, io)",["dormivo"]]],
prod:"Explica una anècdota: què feies quan va passar una cosa inesperada. 6 frases."},

{id:"6.4", t:"Dia 4 · Connectors: perché, quindi, però, mentre", html:`
<p>Amb aquests mots deixes de fer frases soltes i comences a explicar coses.</p>
<table><tr><th>Per a què</th><th>Connectors</th><th>Exemple</th></tr>
<tr><td>Causa</td><td><b>perché</b>, <b>siccome</b></td><td><i>Resto a casa perché piove.</i><br><i>Siccome piove, resto a casa.</i></td></tr>
<tr><td>Conseqüència</td><td><b>quindi</b>, <b>perciò</b>, <b>così</b></td><td><i>Ero stanco, quindi sono andato a letto.</i></td></tr>
<tr><td>Contrast</td><td><b>ma</b>, <b>però</b>, <b>invece</b></td><td><i>Mi piace il mare, ma non so nuotare.</i><br><i>Io prendo la pasta; lui, invece, la pizza.</i></td></tr>
<tr><td>Temps</td><td><b>quando</b>, <b>mentre</b>, <b>poi</b>, <b>dopo</b></td><td><i>Mentre cucinavo, ascoltavo musica.</i></td></tr>
<tr><td>Afegir</td><td><b>anche</b>, <b>inoltre</b></td><td><i>È caro e, inoltre, è lontano.</i></td></tr></table>
<p><b>Siccome</b> va sempre al principi de la frase. <b>Perché</b> va al mig, o al principi d'una resposta.</p>
<p><b>Anche</b> va davant de la paraula que afegeix: <i>Anche io. Parlo anche francese.</i></p>`,
ex:[["Resto a casa ___ piove. (causa)",["perché"]],["___ piove, resto a casa. (causa, al principi)",["siccome"]],["Ero stanco, ___ sono andato a letto. (conseqüència)",["quindi","perciò","così","allora"]],["Mi piace il mare, ___ non so nuotare. (contrast)",["ma","però"]],["Io prendo la pasta; lui, ___ , la pizza. (en canvi)",["invece"]],["___ cucinavo, ascoltavo musica. (mentre)",["mentre"]],["___ sono arrivato, non c'era nessuno. (quan)",["quando"]],["Prima studio, ___ esco. (després)",["poi","dopo"]],["Parlo catalano e ___ spagnolo. (també)",["anche"]],["È caro e, ___ , è lontano. (a més)",["inoltre"]]],
prod:"Explica per què estudies italià en 6 frases unides amb connectors."},

{id:"6.5", t:"Dia 5 · Explicar una notícia", html:`
<p>Una notícia s'explica en cinc frases: què, on, quan, qui i què passarà.</p>
<ul><li><i><b>È successo</b> ieri a Milano.</i></li>
<li><i><b>C'è stato</b> un incidente in autostrada.</i> (Hi ha hagut…)</li>
<li><i><b>Ci sono stati</b> due feriti.</i> (plural)</li>
<li><i><b>Secondo</b> la polizia, la causa è la nebbia.</i></li>
<li><i>Il governo <b>ha annunciato</b> una riforma.</i></li>
<li><i>Le cause non sono ancora chiare.</i></li></ul>
<p><b>C'è stato o c'era?</b> <i>C'è stato un incidente</i> és un fet. <i>C'era molta gente</i> és la descripció.</p>
<p><b>Verbs de notícia:</b> <i>annunciare, dichiarare, confermare, approvare, vincere, perdere, morire, nascere, aumentare, diminuire</i>.</p>
<p>Fes-ho cada dia: llegeix un titular i explica'l en veu alta amb aquestes cinc frases.</p>`,
ex:[["Ieri ___ un incidente in autostrada. (hi ha hagut)",["c'è stato"]],["___ due feriti. (hi ha hagut, plural)",["ci sono stati"]],["___ la polizia, è stato un furto. (segons)",["secondo"]],["«Què ha passat?»",["che cosa è successo","cosa è successo","che è successo","cos'è successo"]],["Allo stadio ___ molta gente. (hi havia)",["c'era"]],["Il governo ___ una riforma. (annunciare, passat)",["ha annunciato"]],["La partita ___ due a zero. (finire, passat)",["è finita"]],["I tifosi ___ contenti. (essere, imperfet)",["erano"]],["Il ministro ___ che ci saranno novità. (dire, passat)",["ha detto"]],["I prezzi ___ . (aumentare, passat)",["sono aumentati"]]],
prod:"Tria una notícia d'avui i explica-la en 5 frases."},

{id:"6.6", t:"Dia 6 · El primer vídeo fet per a italians i sessió llarga", html:`
<p>Avui passes al contingut que miren els italians. Costarà, i és normal.</p>
<p><b>1. Un vídeo de Geopop de 5 a 10 minuts</b> sobre un tema que ja coneguis. Activa els subtítols en italià i posa'l a 0,75. Mira'l tres vegades:</p>
<ol><li>Sencer, sense aturar-lo. Queda't amb la idea general.</li>
<li>Aturant-lo. Apunta 10 paraules noves i busca-les a Paraules.</li>
<li>Sencer un altre cop. Notaràs la diferència.</li></ol>
<p><b>2. Una cançó de rap amb molta lletra.</b> Marracash, Fabri Fibra o Caparezza. Amb la lletra davant, caça 8 paraules. No intentis entendre-ho tot: el rap fa servir molt argot.</p>
<p><b>3. El text de la setmana:</b> un resum del vídeo.</p>
<p>Si entens menys de la meitat del vídeo, canvia'l per un de més curt o torna una setmana més a Easy Italian. No és cap fracàs.</p>`,
ex:[["Da piccolo ___ in un paese. (vivere, io)",["vivevo"]],["Ieri ___ un video di Geopop. (guardare, io)",["ho guardato"]],["Mentre ___ , prendevo appunti. (ascoltare, io)",["ascoltavo"]],["Non ___ tutto, ma quasi. (capire, io, passat)",["ho capito"]],["___ studio ogni giorno, miglioro. (com que)",["siccome"]],["Era difficile, ___ interessante. (però)",["ma","però"]],["«Hi havia molta gent»",["c'era molta gente"]],["«Hi ha hagut un problema»",["c'è stato un problema"]],["La canzone mi ___ molto. (piacere, passat)",["è piaciuta"]],["Il video ___ dieci minuti. (durare, imperfet)",["durava"]]],
prod:"Resumeix en 80 paraules el vídeo que has vist."},

{id:"6.7", t:"Dia 7 · Prova de la setmana 6", html:`
<p>Vint preguntes sobre el bloc 6 i els passats. <b>Amb 16 encerts o més, passes a la setmana 7.</b></p>`,
ex:[["«diari» en italià",["giornale"]],["«alcalde» en italià",["sindaco"]],["«desenvolupament» en italià",["sviluppo"]],["«tria, elecció» en italià",["scelta"]],["«prohibir» en italià",["vietare"]],["«malgrat» en italià",["nonostante"]],["«tanmateix» en italià",["tuttavia"]],["«xarxa» en italià",["rete"]],["«pantalla» en italià",["schermo"]],["«creixement» en italià",["crescita"]],["«judici» en italià",["processo"]],["«petició, sol·licitud» en italià",["richiesta"]],["Io ___ piccolo. (essere, imperfet)",["ero"]],["Noi ___ sport. (fare, imperfet)",["facevamo"]],["Mentre ___ , è arrivato Luca. (mangiare, io)",["mangiavo"]],["Ieri ___ al cinema. (andare, io)",["sono andato","sono andata"]],["___ piove, resto a casa. (com que)",["siccome"]],["«Hi havia molta gent»",["c'era molta gente"]],["Loro ___ un cane. (avere, imperfet)",["avevano"]],["«Segons jo»",["secondo me"]]],
prod:"Escriu 6 frases sobre com era la teva vida fa cinc anys."},

{id:"7.1", t:"Dia 1 · El futur", html:`
<p>El futur es fa a partir de l'infinitiu sencer, sense la <i>-e</i> final, i amb aquestes terminacions: <i>-ò, -ai, -à, -emo, -ete, -anno</i>.</p>
<table><tr><th></th><th>parlare</th><th>prendere</th><th>dormire</th></tr>
<tr><td>io</td><td>parl<b>erò</b></td><td>prender<b>ò</b></td><td>dormir<b>ò</b></td></tr>
<tr><td>tu</td><td>parl<b>erai</b></td><td>prender<b>ai</b></td><td>dormir<b>ai</b></td></tr>
<tr><td>lui, lei</td><td>parl<b>erà</b></td><td>prender<b>à</b></td><td>dormir<b>à</b></td></tr>
<tr><td>noi</td><td>parl<b>eremo</b></td><td>prender<b>emo</b></td><td>dormir<b>emo</b></td></tr>
<tr><td>voi</td><td>parl<b>erete</b></td><td>prender<b>ete</b></td><td>dormir<b>ete</b></td></tr>
<tr><td>loro</td><td>parl<b>eranno</b></td><td>prender<b>anno</b></td><td>dormir<b>anno</b></td></tr></table>
<p><b>Compte amb -are:</b> la <i>a</i> es torna <i>e</i>. Es diu <i>parl<b>e</b>rò</i>, no <i>parlarò</i>. És l'error més típic venint del català.</p>
<p><b>Ortografia.</b> <i>giocare → giocherò</i>, <i>pagare → pagherò</i> (s'hi afegeix h). <i>cominciare → comincerò</i>, <i>mangiare → mangerò</i> (cau la i).</p>
<p><b>Per a plans propers</b> l'italià sovint fa servir el present: <i>Domani vado a Roma.</i></p>`,
ex:[["Domani ___ con lui. (parlare, io)",["parlerò"]],["Tu ___ a casa? (tornare)",["tornerai"]],["Lei ___ un libro. (scrivere)",["scriverà"]],["Noi ___ alle otto. (partire)",["partiremo"]],["Voi ___ la partita? (guardare)",["guarderete"]],["Loro ___ a Roma. (arrivare)",["arriveranno"]],["Io ___ a calcio. (giocare)",["giocherò"]],["___ tu? (pagare)",["pagherai"]],["Noi ___ insieme. (mangiare)",["mangeremo"]],["Il film ___ alle nove. (cominciare)",["comincerà"]],["Io ___ fino a tardi. (dormire)",["dormirò"]],["Loro ___ il treno. (prendere)",["prenderanno"]]],
prod:"Escriu els teus plans per al cap de setmana en 6 frases en futur."},

{id:"7.2", t:"Dia 2 · El futur irregular", html:`
<p>Els verbs més usats escurcen l'arrel. Les terminacions no canvien.</p>
<table><tr><th>Verb</th><th>Futur</th><th>Verb</th><th>Futur</th></tr>
<tr><td>essere</td><td><b>sarò</b></td><td>avere</td><td><b>avrò</b></td></tr>
<tr><td>andare</td><td><b>andrò</b></td><td>fare</td><td><b>farò</b></td></tr>
<tr><td>potere</td><td><b>potrò</b></td><td>dovere</td><td><b>dovrò</b></td></tr>
<tr><td>sapere</td><td><b>saprò</b></td><td>vedere</td><td><b>vedrò</b></td></tr>
<tr><td>vivere</td><td><b>vivrò</b></td><td>dare</td><td><b>darò</b></td></tr>
<tr><td>stare</td><td><b>starò</b></td><td>dire</td><td><b>dirò</b></td></tr>
<tr><td>venire</td><td><b>verrò</b></td><td>volere</td><td><b>vorrò</b></td></tr>
<tr><td>bere</td><td><b>berrò</b></td><td>rimanere</td><td><b>rimarrò</b></td></tr></table>
<p><b>Hi ha dos grups.</b> Uns perden una vocal (<i>andrò, avrò, potrò, saprò</i>). Els altres dupliquen la r (<i>verrò, vorrò, berrò, rimarrò</i>).</p>
<p><b>El futur també serveix per suposar:</b> <i>Dov'è Marco? Sarà a casa.</i> (Deu ser a casa.)</p>`,
ex:[["Io ___ a Roma. (andare)",["andrò"]],["Tu ___ tempo? (avere)",["avrai"]],["Lei ___ felice. (essere)",["sarà"]],["Noi ___ una festa. (fare)",["faremo"]],["Voi ___ venire? (potere)",["potrete"]],["Loro ___ domani. (venire)",["verranno"]],["Io ___ studiare. (dovere)",["dovrò"]],["Tu ___ la partita? (vedere)",["vedrai"]],["Noi ___ a casa. (rimanere)",["rimarremo"]],["Lui ___ la verità. (sapere)",["saprà"]],["Io ___ un caffè. (bere)",["berrò"]],["Loro ___ in Italia. (vivere)",["vivranno"]]],
prod:"Com serà la teva vida d'aquí a cinc anys? 6 frases."},

{id:"7.3", t:"Dia 3 · Stare + gerundi: què està passant ara", html:`
<p>Com «estic menjant». Es fa amb <i>stare</i> i el gerundi.</p>
<table><tr><th>Infinitiu</th><th>Gerundi</th><th>Exemple</th></tr>
<tr><td>-are</td><td><b>-ando</b></td><td><i>parlare → parlando</i></td></tr>
<tr><td>-ere, -ire</td><td><b>-endo</b></td><td><i>leggere → leggendo · dormire → dormendo</i></td></tr></table>
<p><i>sto parlando, stai parlando, sta parlando, stiamo parlando, state parlando, stanno parlando</i></p>
<p><b>Irregulars:</b> <i>fare → facendo</i>, <i>dire → dicendo</i>, <i>bere → bevendo</i>.</p>
<p><b>En passat</b> es fa amb l'imperfetto de stare: <i>Stavo mangiando quando hai chiamato.</i></p>
<p><b>Amb reflexius</b> el pronom va davant: <i>Mi sto alzando.</i></p>
<p>Només serveix per al que passa en aquest moment. Per a un costum es fa servir el present: <i>Leggo molto.</i></p>`,
ex:[["Io ___ . (mangiare)",["sto mangiando"]],["Tu che cosa ___ ? (fare)",["stai facendo"]],["Lei ___ un libro. (leggere)",["sta leggendo"]],["Noi ___ la partita. (guardare)",["stiamo guardando"]],["Voi ___ ? (dormire)",["state dormendo"]],["Loro ___ . (arrivare)",["stanno arrivando"]],["Gerundi de «parlare»",["parlando"]],["Gerundi de «scrivere»",["scrivendo"]],["Gerundi de «fare»",["facendo"]],["Che cosa ___ ? (dire, tu)",["stai dicendo"]],["Ieri alle otto io ___ . (cenare, en passat)",["stavo cenando"]],["Guarda: ___ . (piovere)",["sta piovendo"]]],
prod:"Descriu què estan fent ara mateix 5 persones que coneixes."},

{id:"7.4", t:"Dia 4 · Comparar: più, meno, come", html:`
<table><tr><th>Idea</th><th>Fórmula</th><th>Exemple</th></tr>
<tr><td>més… que</td><td><b>più</b> … <b>di</b></td><td><i>Luca è più alto di me.</i></td></tr>
<tr><td>menys… que</td><td><b>meno</b> … <b>di</b></td><td><i>Il treno è meno caro dell'aereo.</i></td></tr>
<tr><td>tan… com</td><td>… <b>come</b></td><td><i>Sono alto come te.</i></td></tr></table>
<p><b>«Que» es diu di</b> davant d'una persona o d'una cosa, i es fon amb l'article: <i>più grande <b>della</b> Svizzera</i>.</p>
<p><b>Es diu che</b> quan compares dues qualitats, dos verbs o dues coses amb preposició: <i>È più simpatico <b>che</b> bello. È più facile parlare <b>che</b> scrivere. Meglio tardi <b>che</b> mai.</i></p>
<p><b>Quatre irregulars:</b></p>
<table><tr><th></th><th>Adjectiu</th><th>Adverbi</th></tr>
<tr><td>més bo, millor</td><td><b>migliore</b></td><td><b>meglio</b></td></tr>
<tr><td>més dolent, pitjor</td><td><b>peggiore</b></td><td><b>peggio</b></td></tr></table>
<p><i>Questo film è migliore.</i> (és millor) · <i>Oggi sto meglio.</i> (estic millor)</p>`,
ex:[["Luca è più alto ___ me.",["di"]],["Roma è più grande ___ Milano.",["di"]],["L'Italia è più grande ___ Svizzera. (di + la)",["della"]],["Sono alto ___ te. (com)",["come","quanto"]],["È più facile parlare ___ scrivere.",["che"]],["Questo film è ___ dell'altro. (millor)",["migliore"]],["Oggi sto ___ . (millor)",["meglio"]],["Il tempo è ___ di ieri. (pitjor)",["peggiore"]],["Canta ___ di me. (pitjor)",["peggio"]],["Il treno è ___ veloce dell'autobus. (més)",["più"]],["L'autobus è ___ caro del taxi. (menys)",["meno"]],["«Val més tard que mai»",["meglio tardi che mai"]]],
prod:"Compara dos jugadors, dos artistes o dues ciutats en 6 frases."},

{id:"7.5", t:"Dia 5 · El millor: il più i -issimo", html:`
<p><b>El més… de tots</b> es fa amb l'article, <i>più</i> i <i>di</i>:</p>
<ul><li><i>È <b>il</b> giocatore <b>più</b> forte <b>del</b> mondo.</i></li>
<li><i>È <b>la</b> città <b>più</b> bella <b>d'</b>Italia.</i></li>
<li><i>È <b>il migliore</b>.</i> · <i>È <b>la peggiore</b> partita dell'anno.</i></li></ul>
<p><b>Moltíssim</b> es fa amb <i>-issimo</i>, que concorda com qualsevol adjectiu:</p>
<table><tr><th>Adjectiu</th><th>Superlatiu</th></tr>
<tr><td>bello</td><td>bell<b>issimo</b></td></tr>
<tr><td>brava</td><td>brav<b>issima</b></td></tr>
<tr><td>grande</td><td>grand<b>issimo</b></td></tr>
<tr><td>stanco</td><td>stanc<b>h</b>issimo</td></tr>
<tr><td>bene, male</td><td>ben<b>issimo</b>, mal<b>issimo</b></td></tr></table>
<p><i>Bellissimo</i> i <i>molto bello</i> volen dir el mateix. Els italians fan servir molt el primer.</p>`,
ex:[["È il giocatore ___ forte del mondo.",["più"]],["È ___ città più bella d'Italia.",["la"]],["È il ___ amico che ho. (millor)",["migliore"]],["bello → molt bonic, en una paraula",["bellissimo"]],["brava → molt bona, en una paraula",["bravissima"]],["stanco → molt cansat, en una paraula",["stanchissimo"]],["grande → molt gran, en una paraula",["grandissimo"]],["«molt bé», en una paraula",["benissimo"]],["È la canzone più famosa ___ anno. (di + l')",["dell'"]],["È il ___ giorno della mia vita. (pitjor)",["peggiore"]],["facile → molt fàcil, en una paraula",["facilissimo"]],["«el més alt de la classe»",["il più alto della classe"]]],
prod:"Els teus rècords: el millor concert, el pitjor partit, la ciutat més bonica, la cançó més escoltada. 6 frases."},

{id:"7.6", t:"Dia 6 · Comentar un partit i sessió llarga", html:`
<p><b>Frases per parlar d'un partit:</b></p>
<ul><li><i>La partita è finita due a uno.</i> · <i>Hanno pareggiato.</i> (Han empatat.)</li>
<li><i>Ha segnato il capitano al novantesimo.</i> (al minut noranta)</li>
<li><i>Nel primo tempo…</i> · <i>Nel secondo tempo…</i> (a la primera part, a la segona)</li>
<li><i>L'arbitro ha dato un rigore.</i> · <i>È stato espulso.</i></li>
<li><i>Che gol!</i> · <i>Ha giocato benissimo.</i> · <i>Ha sbagliato tutto.</i></li>
<li><i>Secondo me, meritava di vincere.</i></li>
<li><i>Domenica giocherà contro il Milan.</i></li></ul>
<p><b>Sessió llarga d'avui.</b> El resum d'un partit de la Serie A i deu minuts d'una tertúlia de Cronache di Spogliatoio. A la tertúlia parlen de pressa i alhora: amb entendre de què discuteixen ja n'hi ha prou. Després, una cançó de rap o de trap amb la lletra davant, i la crònica de la setmana.</p>`,
ex:[["La partita ___ due a uno. (finire, passat)",["è finita"]],["L'attaccante ___ due gol. (segnare, passat)",["ha segnato"]],["Domenica la squadra ___ contro il Milan. (giocare, futur)",["giocherà"]],["È il ___ giocatore della squadra. (millor)",["migliore"]],["L'Inter è più forte ___ Lazio. (di + la)",["della"]],["In questo momento ___ . (vincere, loro, stare + gerundi)",["stanno vincendo"]],["Ha giocato ___ . (molt malament, una paraula)",["malissimo"]],["Chi ___ lo scudetto? (vincere, futur)",["vincerà"]],["Lo stadio ___ pieno. (essere, imperfet)",["era"]],["«Han empatat»",["hanno pareggiato"]]],
prod:"Escriu la crònica d'un partit que hagis vist: 100 paraules."},

);

{id:"8.1", t:"Dia 1 · El condicional", html:`
<p>És el temps de «parlaria». Fa servir la mateixa arrel que el futur, amb aquestes terminacions: <i>-ei, -esti, -ebbe, -emmo, -este, -ebbero</i>.</p>
<table><tr><th></th><th>parlare</th><th>prendere</th><th>dormire</th></tr>
<tr><td>io</td><td>parler<b>ei</b></td><td>prender<b>ei</b></td><td>dormir<b>ei</b></td></tr>
<tr><td>tu</td><td>parler<b>esti</b></td><td>prender<b>esti</b></td><td>dormir<b>esti</b></td></tr>
<tr><td>lui, lei</td><td>parler<b>ebbe</b></td><td>prender<b>ebbe</b></td><td>dormir<b>ebbe</b></td></tr>
<tr><td>noi</td><td>parler<b>emmo</b></td><td>prender<b>emmo</b></td><td>dormir<b>emmo</b></td></tr>
<tr><td>voi</td><td>parler<b>este</b></td><td>prender<b>este</b></td><td>dormir<b>este</b></td></tr>
<tr><td>loro</td><td>parler<b>ebbero</b></td><td>prender<b>ebbero</b></td><td>dormir<b>ebbero</b></td></tr></table>
<p><b>Els irregulars són els del futur:</b> <i>sarei, avrei, andrei, farei, potrei, dovrei, saprei, vedrei, vivrei, verrei, vorrei, berrei, rimarrei</i>.</p>
<p><b>No confonguis</b> <i>parleremo</i> (parlarem, futur) amb <i>parleremmo</i> (parlaríem, condicional). La doble m es pronuncia.</p>
<p><i>Mi piacerebbe</i> vol dir «m'agradaria».</p>`,
ex:[["Io ___ volentieri. (venire)",["verrei"]],["Tu ___ aiutarmi? (potere)",["potresti"]],["Lei ___ felice. (essere)",["sarebbe"]],["Noi ___ un caffè. (prendere)",["prenderemmo"]],["Voi ___ in Italia? (vivere)",["vivreste"]],["Loro ___ di più. (studiare)",["studierebbero"]],["Io ___ una pizza. (volere)",["vorrei"]],["Tu ___ riposare. (dovere)",["dovresti"]],["Mi ___ viaggiare. (piacere)",["piacerebbe"]],["Noi ___ a piedi. (andare)",["andremmo"]],["Io ___ un mese al mare. (passare)",["passerei"]],["Lui ___ tempo. (avere)",["avrebbe"]]],
prod:"Què faries amb un any lliure i diners? 6 frases en condicional."},

{id:"8.2", t:"Dia 2 · Demanar i aconsellar amb educació", html:`
<p>El condicional és el temps de la bona educació. Aquestes cinc fórmules et resolen qualsevol situació.</p>
<table><tr><th>Per a què</th><th>Fórmula</th><th>Exemple</th></tr>
<tr><td>Demanar una cosa</td><td><b>Vorrei</b>…</td><td><i>Vorrei un caffè.</i></td></tr>
<tr><td>Demanar un favor</td><td><b>Potresti</b>…? · <b>Potrebbe</b>…?</td><td><i>Potresti aiutarmi?</i><br><i>Potrebbe ripetere?</i> (a vostè)</td></tr>
<tr><td>Donar un consell</td><td><b>Dovresti</b>…</td><td><i>Dovresti dormire di più.</i></td></tr>
<tr><td>Dir què faries tu</td><td><b>Al posto tuo</b>…</td><td><i>Al posto tuo, resterei.</i></td></tr>
<tr><td>Expressar un desig</td><td><b>Mi piacerebbe</b>…</td><td><i>Mi piacerebbe andare a Roma.</i></td></tr></table>
<p><b>El vostè italià és Lei</b>, amb el verb en tercera persona: <i>Lei è molto gentile. Come sta?</i> Per cridar l'atenció, <i>scusi</i> (vostè) o <i>scusa</i> (tu).</p>
<p><i>Sarebbe meglio partire presto.</i> (Valdria més sortir aviat.)</p>`,
ex:[["«Voldria un cafè»",["vorrei un caffè"]],["«Podries ajudar-me?»",["potresti aiutarmi","mi potresti aiutare"]],["«Hauries de dormir més»",["dovresti dormire di più"]],["«M'agradaria anar a Roma»",["mi piacerebbe andare a roma"]],["«Podria repetir?» (a vostè)",["potrebbe ripetere"]],["Al posto tuo, io ___ . (restare)",["resterei"]],["___ meglio partire presto. (essere)",["sarebbe"]],["«Perdoni» (a vostè)",["scusi"]],["Tu ___ studiare ogni giorno. (dovere)",["dovresti"]],["Noi ___ venire sabato. (potere)",["potremmo"]],["Io ___ il treno. (prendere)",["prenderei"]],["«Com està?» (a vostè)",["come sta"]]],
prod:"Un amic vol aprendre català. Dona-li 6 consells amb dovresti, potresti i al posto tuo."},

{id:"8.3", t:"Dia 3 · L'imperatiu", html:`
<p>Per donar ordres, instruccions i consells directes a algú de confiança.</p>
<table><tr><th></th><th>-are</th><th>-ere</th><th>-ire</th></tr>
<tr><td>tu</td><td>parl<b>a</b>!</td><td>prend<b>i</b>!</td><td>dorm<b>i</b>! · fin<b>isci</b>!</td></tr>
<tr><td>noi</td><td>parl<b>iamo</b>!</td><td>prend<b>iamo</b>!</td><td>dorm<b>iamo</b>!</td></tr>
<tr><td>voi</td><td>parl<b>ate</b>!</td><td>prend<b>ete</b>!</td><td>dorm<b>ite</b>!</td></tr></table>
<p><b>L'única forma nova és tu en -are</b>, que acaba en <i>-a</i>: <i>Guarda! Ascolta! Aspetta!</i> La resta són iguals que el present.</p>
<p><b>Irregulars de tu:</b></p>
<ul><li><i>essere → <b>sii</b></i> · <i>avere → <b>abbi</b></i></li>
<li><i>andare → <b>vai</b></i> o <i>va'</i> · <i>fare → <b>fai</b></i> o <i>fa'</i> · <i>stare → <b>stai</b></i> o <i>sta'</i> · <i>dare → <b>dai</b></i> o <i>da'</i></li>
<li><i>dire → <b>di'</b></i> · <i>venire → <b>vieni</b></i></li></ul>
<p><i>Andiamo!</i> (Anem!) · <i>Dai!</i> (Vinga!) · <i>Stai tranquillo.</i> (Estigues tranquil.)</p>`,
ex:[["___ ! (guardare, tu)",["guarda"]],["___ la porta! (chiudere, tu)",["chiudi"]],["___ ! (ascoltare, voi)",["ascoltate"]],["___ ! (andare, noi)",["andiamo"]],["___ qui! (venire, tu)",["vieni"]],["___ piano! (parlare, tu)",["parla"]],["___ il treno delle otto! (prendere, tu)",["prendi"]],["___ ! (dormire, tu)",["dormi"]],["___ attento! (stare, tu)",["stai","sta'"]],["___ la verità! (dire, tu)",["di'"]],["___ presto! (fare, tu)",["fai","fa'"]],["___ ! (aspettare, tu)",["aspetta"]]],
prod:"Escriu les instruccions per arribar a casa teva des de l'estació amb 6 imperatius."},

{id:"8.4", t:"Dia 4 · No ho facis! L'imperatiu negatiu i amb pronoms", html:`
<p><b>En negatiu, tu es fa amb l'infinitiu.</b> És la sorpresa de l'imperatiu italià.</p>
<ul><li><i>Parla!</i> → <i><b>Non parlare</b>!</i></li>
<li><i>Vai!</i> → <i><b>Non andare</b>!</i></li>
<li>Amb <i>noi</i> i <i>voi</i> només s'hi posa <i>non</i>: <i>Non parlate! Non andiamo!</i></li></ul>
<p><b>Els pronoms van enganxats al darrere.</b></p>
<ul><li><i>Guarda<b>lo</b>!</i> (Mira'l!) · <i>Ascolta<b>mi</b>!</i> (Escolta'm!) · <i>Alza<b>ti</b>!</i> (Lleva't!)</li>
<li><i>Scrivi<b>mi</b>!</i> · <i>Prendi<b>lo</b>!</i> · <i>Siedi<b>ti</b>!</i></li></ul>
<p><b>Amb les formes curtes es dobla la consonant:</b></p>
<table><tr><th>Forma</th><th>Amb pronom</th><th>Català</th></tr>
<tr><td>di'</td><td><b>dimmi</b></td><td>digue'm</td></tr>
<tr><td>da'</td><td><b>dammi</b></td><td>dona'm</td></tr>
<tr><td>fa'</td><td><b>fallo</b></td><td>fes-ho</td></tr>
<tr><td>va'</td><td><b>vacci</b></td><td>ves-hi</td></tr></table>
<p><b>En negatiu amb pronom:</b> <i>Non farlo!</i> o <i>Non lo fare!</i> · <i>Non preoccuparti!</i></p>`,
ex:[["«No parlis!»",["non parlare"]],["«No vagis!»",["non andare"]],["«Mira'l!»",["guardalo"]],["«Escolta'm!»",["ascoltami"]],["«Lleva't!»",["alzati"]],["«Digue'm!»",["dimmi"]],["«Dona'm!»",["dammi"]],["«Fes-ho!»",["fallo"]],["«No ho facis!»",["non farlo","non lo fare"]],["«Escriu-me!»",["scrivimi"]],["«No us preocupeu!»",["non preoccupatevi","non vi preoccupate"]],["«No et preocupis!»",["non preoccuparti","non ti preoccupare"]]],
prod:"Escriu 6 normes per a algú que comença a estudiar italià: 3 coses que ha de fer i 3 que no."},

{id:"8.5", t:"Dia 5 · Che i cui", html:`
<p>Per unir dues frases en una.</p>
<table><tr><th>Pronom</th><th>Quan</th><th>Exemple</th></tr>
<tr><td><b>che</b></td><td>«que», sense preposició</td><td><i>Il film che ho visto.</i><br><i>La ragazza che parla.</i></td></tr>
<tr><td><b>cui</b></td><td>després d'una preposició</td><td><i>L'amico <u>con</u> cui esco.</i><br><i>La città <u>in</u> cui vivo.</i><br><i>Il libro <u>di</u> cui ti ho parlato.</i></td></tr>
<tr><td><b>chi</b></td><td>«qui», en general</td><td><i>Chi cerca, trova.</i><br><i>Non so chi ha telefonato.</i></td></tr>
<tr><td><b>dove</b></td><td>«on»</td><td><i>La casa dove vivo.</i></td></tr>
<tr><td><b>quello che</b></td><td>«el que», «allò que»</td><td><i>Non capisco quello che dici.</i></td></tr></table>
<p><b>La regla és curta:</b> si hi ha preposició, <i>cui</i>. Si no n'hi ha, <i>che</i>.</p>
<p><i>Il motivo per cui studio italiano è semplice: mi piace.</i></p>`,
ex:[["Il film ___ ho visto era bello.",["che"]],["La ragazza ___ parla è mia sorella.",["che"]],["L'amico con ___ esco è italiano.",["cui"]],["La città in ___ vivo è piccola.",["cui"]],["Il libro di ___ ti ho parlato.",["cui"]],["Non so ___ ha telefonato.",["chi"]],["Non capisco quello ___ dici.",["che"]],["Il motivo per ___ studio è semplice.",["cui"]],["La casa ___ vivo è vecchia. (on)",["dove"]],["___ cerca, trova.",["chi"]],["La canzone ___ ascolto è di Marracash.",["che"]],["La squadra per ___ tifo ha vinto.",["cui"]]],
prod:"Descriu 5 persones o coses amb frases de relatiu. Exemple: Luca è l'amico con cui gioco a calcio."},

{id:"8.6", t:"Dia 6 · Resumir un cas de misteri i sessió llarga", html:`
<p><b>Frases per explicar un cas:</b></p>
<ul><li><i>Il caso è successo a… nel…</i></li>
<li><i>La vittima era una donna di trent'anni.</i></li>
<li><i>È scomparsa una sera di novembre.</i> · <i>Hanno trovato il corpo in un bosco.</i></li>
<li><i>La polizia ha indagato per mesi.</i> · <i>Non c'erano prove.</i></li>
<li><i>Il principale sospettato era il marito, che ha sempre negato tutto.</i></li>
<li><i>Il colpevole non è mai stato trovato.</i> · <i>Resta un mistero.</i></li>
<li><i>Secondo me…</i></li></ul>
<p>Fixa't que el fons va en imperfetto (<i>era, c'erano</i>) i els fets en passato prossimo (<i>è scomparsa, hanno trovato</i>).</p>
<p><b>Sessió llarga d'avui.</b> El primer episodi d'Indagini. Dura uns vint minuts per part i el narrador parla a poc a poc. Escolta'l dues vegades: la primera sencera, la segona aturant i apuntant 10 paraules. Si se't fa massa difícil, canvia a un vídeo d'Elisa True Crime amb subtítols en italià.</p>`,
ex:[["La ragazza ___ nel 1993. (scomparire, passat)",["è scomparsa"]],["La polizia ___ per mesi. (indagare, passat)",["ha indagato"]],["Il sospettato, ___ era il vicino, ha negato tutto.",["che"]],["Non c'___ prove. (essere, imperfet)",["erano"]],["Il caso di ___ parlo è famoso.",["cui"]],["___ me, è innocente.",["secondo"]],["Il colpevole non ___ mai trovato. (essere, passat)",["è stato"]],["Al posto della polizia, io ___ ancora. (indagare, condicional)",["indagherei"]],["«No ho diguis a ningú!»",["non dirlo a nessuno","non lo dire a nessuno"]],["___ un mistero. (restare, present)",["resta"]]],
prod:"Resumeix en 100 paraules el cas que has escoltat."},

{id:"8.7", t:"Dia 7 · Prova 2", html:`
<p>La segona prova gran: vint-i-quatre preguntes sobre les setmanes 5 a 8. <b>S'aprova amb 19.</b></p>
<p>Fes també aquestes tres coses:</p>

<li>Escolta un episodi d'un pòdcast per a estudiants sense transcripció i apunta la idea general.</li>
<li>Grava't dos minuts sobre el tema <i>Chi sono e cosa mi piace</i> i compara-ho amb la gravació de la setmana 1.</li></ol>`,
ex:[["«investigació policial» en italià",["indagine"]],["«mentida» en italià",["bugia"]],["«matar» en italià",["uccidere","ammazzare"]],["«amagar» en italià",["nascondere"]],["«repte» en italià",["sfida"]],["«llamp» en italià",["fulmine"]],["«guineu» en italià",["volpe"]],["«desconegut» en italià",["sconosciuto","ignoto"]],["«entrenador» en italià",["allenatore"]],["«avorriment» en italià",["noia"]],["«tanmateix» en italià",["tuttavia"]],["«sou, salari» en italià",["stipendio"]],["Conosci Luca? Sì, ___ conosco.",["lo"]],["A Maria ___ telefono stasera.",["le"]],["Vai a Roma? Sì, ___ vado.",["ci"]],["Quanti fratelli hai? ___ ho due.",["ne"]],["Io ___ piccolo. (essere, imperfet)",["ero"]],["Mentre ___ , ha telefonato Luca. (dormire, io)",["dormivo"]],["Domani io ___ a Milano. (andare, futur)",["andrò"]],["Tu ___ riposare. (dovere, condicional)",["dovresti"]],["«Digue'm!»",["dimmi"]],["«No parlis!»",["non parlare"]],["L'amico con ___ esco è italiano.",["cui"]],["Luca è più bravo ___ me.",["di"]]],
prod:"Escriu 120 paraules: què saps fer ara en italià que fa dos mesos no sabies."},

{id:"9.1", t:"Dia 1 · Donar la teva opinió", html:`
<p>Aquestes frases et permeten opinar sense fer servir cap temps nou.</p>
<table><tr><th>Per a què</th><th>Frases</th></tr>
<tr><td>Opinar</td><td><i><b>Secondo me</b>, è giusto.</i> · <i><b>Per me</b>, no.</i> · <i><b>Mi sembra</b> giusto.</i></td></tr>
<tr><td>Estar d'acord</td><td><i><b>Sono d'accordo</b> con te.</i> · <i><b>Hai ragione</b>.</i> · <i>Certo.</i></td></tr>
<tr><td>No estar-hi</td><td><i><b>Non sono d'accordo</b>.</i> · <i>Non credo.</i> · <i>Hai torto.</i></td></tr>
<tr><td>Dubtar</td><td><i><b>Dipende</b>.</i> · <i>Forse.</i> · <i>Può darsi.</i> · <i>Non lo so.</i></td></tr>
<tr><td>Matisar</td><td><i><b>Da una parte</b>… <b>dall'altra</b>…</i></td></tr>
<tr><td>Preguntar</td><td><i><b>Che ne pensi?</b></i> · <i>Sei d'accordo?</i></td></tr></table>
<p><b>Secondo me va amb el verb normal:</b> <i>Secondo me è caro.</i> En canvi, <i>penso che</i> i <i>credo che</i> demanen subjuntiu, que veuràs demà. Mentre no el dominis, fes servir <i>secondo me</i> i no t'equivocaràs.</p>`,
ex:[["«Segons jo»",["secondo me"]],["«Estic d'acord amb tu»",["sono d'accordo con te"]],["«Tens raó»",["hai ragione"]],["«Depèn»",["dipende"]],["«No hi estic d'acord»",["non sono d'accordo"]],["«Potser»",["forse","può darsi","magari"]],["___ me, è un errore.",["secondo"]],["Sono d'accordo ___ lui.",["con"]],["«Què en penses?»",["che ne pensi","cosa ne pensi","che cosa ne pensi"]],["«Per una banda»",["da una parte"]],["Mi ___ giusto. (sembrare)",["sembra"]],["«No ho crec»",["non credo","non lo credo","non ci credo"]]],
prod:"Dona la teva opinió sobre les xarxes socials en 6 frases amb secondo me, per me i mi sembra."},

{id:"9.2", t:"Dia 2 · El subjuntiu: aprèn a reconèixer-lo", html:`
<p>L'italià fa servir el subjuntiu després de <i>penso che</i>, <i>credo che</i> i <i>spero che</i>. L'objectiu d'aquesta setmana és reconèixer-lo quan el sentis i fer-lo servir amb els verbs més comuns.</p>
<table><tr><th></th><th>parlare</th><th>prendere</th><th>essere</th><th>avere</th></tr>
<tr><td>io, tu, lui</td><td>parl<b>i</b></td><td>prend<b>a</b></td><td><b>sia</b></td><td><b>abbia</b></td></tr>
<tr><td>noi</td><td>parliamo</td><td>prendiamo</td><td>siamo</td><td>abbiamo</td></tr>
<tr><td>voi</td><td>parliate</td><td>prendiate</td><td>siate</td><td>abbiate</td></tr>
<tr><td>loro</td><td>parl<b>ino</b></td><td>prend<b>ano</b></td><td><b>siano</b></td><td><b>abbiano</b></td></tr></table>
<p><b>Truc: les vocals s'encreuen.</b> Els verbs en <i>-are</i> agafen <i>-i</i>, i els verbs en <i>-ere</i> i <i>-ire</i> agafen <i>-a</i>.</p>
<p><b>Irregulars que sentiràs sempre:</b> <i>fare → faccia</i>, <i>andare → vada</i>, <i>venire → venga</i>, <i>dire → dica</i>, <i>potere → possa</i>, <i>dovere → debba</i>, <i>sapere → sappia</i>, <i>stare → stia</i>, <i>capire → capisca</i>.</p>
<p><i>Penso che <b>sia</b> tardi.</i> · <i>Credo che <b>abbia</b> ragione.</i> · <i>Spero che tu <b>stia</b> bene.</i></p>`,
ex:[["Penso che lui ___ ragione. (avere)",["abbia"]],["Credo che ___ tardi. (essere)",["sia"]],["Penso che loro ___ italiano. (parlare)",["parlino"]],["Spero che tu ___ bene. (stare)",["stia"]],["Credo che lei ___ a Roma. (vivere)",["viva"]],["Penso che ___ freddo. (fare)",["faccia"]],["Spero che voi ___ venire. (potere)",["possiate"]],["Mi sembra che lui non ___ . (capire)",["capisca"]],["Penso che tu ___ studiare di più. (dovere)",["debba"]],["Credo che Marco ___ domani. (venire)",["venga"]],["Spero che ___ tutto bene. (andare)",["vada"]],["Penso che loro ___ la verità. (sapere)",["sappiano"]]],
prod:"Escriu 5 frases amb Penso che, Credo che i Spero che."},

{id:"9.3", t:"Dia 3 · Quan apareix el subjuntiu", html:`
<p>Apareix quan la frase principal expressa una cosa que no és un fet segur.</p>
<table><tr><th>Subjuntiu</th><th>Indicatiu</th></tr>
<tr><td><i>Penso che, credo che, mi sembra che</i></td><td><i>So che, sono sicuro che, è vero che</i></td></tr>
<tr><td><i>Voglio che, spero che, preferisco che</i></td><td><i>Secondo me</i></td></tr>
<tr><td><i>Ho paura che, sono contento che, mi dispiace che</i></td><td><i>Perché, quando, mentre</i></td></tr>
<tr><td><i>Bisogna che, è importante che, è meglio che</i></td><td><i>Dico che, vedo che</i></td></tr>
<tr><td><i>Benché, sebbene, affinché, prima che</i></td><td><i>Anche se</i></td></tr></table>
<ul><li><i>So che <b>ha</b> ragione.</i> (ho sé) · <i>Penso che <b>abbia</b> ragione.</i> (ho penso)</li>
<li><i>Anche se <b>è</b> tardi, esco.</i> · <i>Benché <b>sia</b> tardi, esco.</i></li></ul>
<p><b>Si el subjecte és el mateix, es fa amb infinitiu.</b> <i>Spero <b>di venire</b>.</i> (Espero venir.) <i>Spero che tu <b>venga</b>.</i> (Espero que vinguis.)</p>
<p>Si un dia dius <i>penso che è</i>, t'entendran igual. Molts italians ho diuen parlant.</p>`,
ex:[["So che lui ___ ragione. (avere)",["ha"]],["Penso che lui ___ ragione. (avere)",["abbia"]],["Secondo me ___ tardi. (essere)",["è"]],["Credo che ___ tardi. (essere)",["sia"]],["Voglio che tu ___ . (venire)",["venga"]],["Sono sicuro che lui ___ . (venire)",["viene","verrà"]],["È importante che voi ___ . (studiare)",["studiate"]],["Benché ___ tardi, esco. (essere)",["sia"]],["Spero ___ venire. (di / che)",["di"]],["Ho paura che ___ . (piovere)",["piova"]],["È vero che lei ___ italiano. (parlare)",["parla"]],["Bisogna che tu ___ presto. (partire)",["parta"]]],
prod:"Escriu 6 frases: 3 amb so che o secondo me, i 3 amb penso che o spero che."},

{id:"9.4", t:"Dia 4 · El si impersonal", html:`
<p>Funciona com el «es» català: <i>si mangia bene</i> és «es menja bé».</p>
<ul><li><i>In Italia <b>si mangia</b> bene.</i></li>
<li><i>Come <b>si dice</b> «gràcies» in italiano?</i> · <i>Come <b>si scrive</b>?</i></li>
<li><i>Qui non <b>si può</b> fumare.</i></li>
<li><i><b>Si dice</b> che sia un bravo allenatore.</i> (Diuen que…)</li></ul>
<p><b>Si el que ve darrere és plural, el verb també:</b></p>
<ul><li><i>A Natale <b>si mangiano</b> molti dolci.</i></li>
<li><i>In questo negozio <b>si vendono</b> scarpe.</i></li></ul>
<p><b>Dues frases que et salvaran sempre:</b> <i>Come si dice…?</i> i <i>Come si scrive?</i></p>`,
ex:[["In Italia ___ bene. (mangiare)",["si mangia"]],["Come ___ «gràcies» in italiano? (dire)",["si dice"]],["Qui non ___ fumare. (potere)",["si può"]],["A Natale ___ molti dolci. (mangiare)",["si mangiano"]],["Come ___ il tuo nome? (scrivere)",["si scrive"]],["In questo negozio ___ scarpe. (vendere)",["si vendono"]],["___ che sia un bravo allenatore. (dire)",["si dice"]],["In Spagna ___ tardi. (cenare)",["si cena"]],["Da qui ___ il mare. (vedere)",["si vede"]],["In Svizzera ___ quattro lingue. (parlare)",["si parlano"]],["«Es pot entrar?»",["si può entrare"]],["D'estate ___ al mare. (andare)",["si va"]]],
prod:"Explica 6 costums de casa teva o de Catalunya amb si. Exemple: A Sant Jordi si regalano libri e rose."},

{id:"9.5", t:"Dia 5 · Connectors per argumentar", html:`
<p>Un text d'opinió es construeix amb aquests mots.</p>
<table><tr><th>Per a què</th><th>Connector</th><th>Català</th></tr>
<tr><td>Començar</td><td><b>innanzitutto</b>, <b>prima di tutto</b></td><td>abans de res</td></tr>
<tr><td>Afegir</td><td><b>inoltre</b>, <b>anche</b></td><td>a més, també</td></tr>
<tr><td>Confirmar</td><td><b>infatti</b></td><td>de fet</td></tr>
<tr><td>Contrastar</td><td><b>tuttavia</b>, <b>però</b>, <b>invece</b></td><td>tanmateix, però, en canvi</td></tr>
<tr><td>Concedir</td><td><b>anche se</b>, <b>nonostante</b></td><td>encara que, malgrat</td></tr>
<tr><td>Posar un exemple</td><td><b>per esempio</b></td><td>per exemple</td></tr>
<tr><td>Deduir</td><td><b>quindi</b>, <b>perciò</b></td><td>per tant, per això</td></tr>
<tr><td>Acabar</td><td><b>in conclusione</b>, <b>insomma</b></td><td>en conclusió, en resum</td></tr></table>
<p><b>Infatti</b> enganya: no vol dir «en efecte» com a sorpresa. Confirma el que acabes de dir: <i>È bravo; infatti, ha vinto.</i></p>`,
ex:[["___ , grazie a tutti. (abans de res)",["innanzitutto","prima di tutto"]],["È caro; ___ , è lontano. (a més)",["inoltre"]],["È bravo; ___ , ha vinto. (de fet)",["infatti"]],["Mi piace; ___ , costa troppo. (tanmateix)",["tuttavia","però"]],["Esco ___ se piove. (encara que: «___ se»)",["anche"]],["___ esempio (per exemple)",["per"]],["Ero stanco, ___ sono rimasto a casa. (per això)",["perciò","quindi"]],["___ la pioggia, siamo usciti. (malgrat)",["nonostante"]],["In ___ , sono d'accordo. (en conclusió)",["conclusione"]],["Io studio; lui, ___ , gioca. (en canvi)",["invece"]]],
prod:"Escriu 80 paraules amb almenys 5 connectors: és millor viure a ciutat o al camp?"},

{id:"9.6", t:"Dia 6 · El teu text d'opinió i sessió llarga", html:`
<p><b>Un text d'opinió té quatre parts.</b> Fes servir aquesta plantilla:</p>
<ol><li><b>La teva opinió.</b> <i>Secondo me, …</i></li>
<li><b>Dos arguments.</b> <i>Innanzitutto, … Inoltre, …</i></li>
<li><b>Una objecció.</b> <i>Da una parte, … Tuttavia, …</i></li>
<li><b>La conclusió.</b> <i>In conclusione, …</i></li></ol>
<p><b>Sessió llarga d'avui.</b> Deu minuts de Breaking Italy o un episodi de Giorno per giorno, a 0,75 si cal. Apunta el tema de cada notícia i una opinió del presentador. Després, una cançó de Fabrizio De André amb la lletra: és poesia, i cada estrofa explica una història. I per acabar, el text de la setmana.</p>`,
ex:[["___ me, il calcio è troppo caro.",["secondo"]],["Penso che ___ vero. (essere)",["sia"]],["So che ___ vero. (essere)",["è"]],["In Italia ___ molto caffè. (bere, si impersonal)",["si beve"]],["È caro; ___ , è bello. (tanmateix)",["tuttavia","però"]],["Spero che tu ___ . (venire)",["venga"]],["«Estic d'acord»",["sono d'accordo"]],["Come ___ in italiano? (dire, si impersonal)",["si dice"]],["___ sia tardi, continuo. (encara que, amb subjuntiu)",["benché","sebbene"]],["In ___ , ho ragione io.",["conclusione"]]],
prod:"Escriu un text d'opinió de 100 paraules sobre un tema d'actualitat, amb la plantilla de quatre parts."},

{id:"9.7", t:"Dia 7 · Prova de la setmana 9", html:`
<p>Vint preguntes sobre el bloc 9, les opinions i el subjuntiu. <b>Amb 16 encerts o més, passes a la setmana 10.</b></p>`,
ex:[["«malaltia» en italià",["malattia"]],["«refredat» en italià",["raffreddore"]],["«grip» en italià",["influenza"]],["«fusta» en italià",["legno"]],["«parella» en italià",["coppia"]],["«casament» en italià",["matrimonio"]],["«costum, hàbit» en italià",["abitudine"]],["«penedir-se» en italià",["pentirsi"]],["«enfadar-se» en italià",["arrabbiarsi"]],["«refiar-se» en italià",["fidarsi"]],["«son, ganes de dormir» en italià",["sonno"]],["«excel·lent» en italià",["ottimo"]],["Penso che ___ tardi. (essere)",["sia"]],["So che ___ tardi. (essere)",["è"]],["Come ___ in italiano? (dire, si impersonal)",["si dice"]],["___ me, hai ragione.",["secondo"]],["Voglio che tu ___ . (venire)",["venga"]],["«Estic d'acord amb tu»",["sono d'accordo con te"]],["«Tens raó»",["hai ragione"]],["Benché ___ , usciamo. (piovere)",["piova"]]],
prod:"Escriu 6 frases sobre la teva salut i els teus costums."},

{id:"10.1", t:"Dia 1 · Repàs del present", html:`
<p>Aquesta setmana no hi ha temps nous. Toca ajuntar tot el que saps.</p>
<table><tr><th></th><th>-are</th><th>-ere</th><th>-ire</th><th>-ire amb -isc-</th></tr>
<tr><td>io</td><td>parlo</td><td>prendo</td><td>dormo</td><td>capisco</td></tr>
<tr><td>tu</td><td>parli</td><td>prendi</td><td>dormi</td><td>capisci</td></tr>
<tr><td>lui, lei</td><td>parla</td><td>prende</td><td>dorme</td><td>capisce</td></tr>
<tr><td>noi</td><td>parliamo</td><td>prendiamo</td><td>dormiamo</td><td>capiamo</td></tr>
<tr><td>voi</td><td>parlate</td><td>prendete</td><td>dormite</td><td>capite</td></tr>
<tr><td>loro</td><td>parlano</td><td>prendono</td><td>dormono</td><td>capiscono</td></tr></table>
<p><b>Els quatre errors que encara es fan a aquestes altures:</b></p>
<ol><li>L'accent de <i>loro</i>: <i>PARlano, PRENdono, caPIscono</i>.</li>
<li>La h de <i>giochi, paghi, cerchi</i>.</li>
<li><i>Sono stanco</i>, no <i>sto stanco</i>.</li>
<li>El pronom dels reflexius: <i>mi alzo</i>, no <i>alzo</i>.</li></ol>
<p>Per repassar els irregulars, obre Practica, Verbs, i tria Present i Irregulars.</p>`,
ex:[["Loro ___ a Roma. (abitare)",["abitano"]],["Tu ___ a calcio? (giocare)",["giochi"]],["Noi ___ tutto. (capire)",["capiamo"]],["Loro ___ alle sei. (finire)",["finiscono"]],["Io ___ da Barcellona. (venire)",["vengo"]],["Voi che cosa ___ ? (fare)",["fate"]],["Lei ___ la verità. (dire)",["dice"]],["Loro non ___ venire. (potere)",["possono"]],["Tu ___ un caffè? (volere)",["vuoi"]],["Io ___ con gli amici. (uscire)",["esco"]],["Noi ___ alle sette. (alzarsi)",["ci alziamo"]],["Loro ___ al mare. (andare)",["vanno"]]],
prod:"Descriu un dia normal teu amb 8 verbs diferents."},

{id:"10.2", t:"Dia 2 · Repàs del passat", html:`
<p><b>Tres preguntes per triar bé:</b></p>
<ol><li><b>És un fet acabat o és el fons?</b> Fet acabat: passato prossimo (<i>ho mangiato</i>). Fons, costum o descripció: imperfetto (<i>mangiavo</i>).</li>
<li><b>Essere o avere?</b> <i>Essere</i> amb moviment, canvi d'estat i reflexius. <i>Avere</i> amb la resta.</li>
<li><b>Concorda el participi?</b> Sí amb <i>essere</i> (<i>è andata</i>) i amb <i>lo, la, li, le</i> al davant (<i>l'ho vista</i>).</li></ol>
<p><b>Els participis que més es fallen:</b> <i>fatto, detto, visto, preso, messo, scritto, letto, aperto, chiuso, chiesto, perso, vinto, stato, nato, successo, rimasto</i>.</p>
<p><b>Una història sencera:</b> <i>Ieri <b>faceva</b> freddo e <b>pioveva</b>. <b>Sono uscito</b> alle otto e <b>ho preso</b> l'autobus. Mentre <b>aspettavo</b>, <b>è arrivata</b> Giulia.</i></p>`,
ex:[["Ieri io ___ al cinema. (andare)",["sono andato","sono andata"]],["Da piccolo ___ in campagna. (vivere, io)",["vivevo"]],["Noi ___ un film. (vedere, passat)",["abbiamo visto"]],["Mentre ___ , è arrivato Luca. (mangiare, io)",["mangiavo"]],["Lei ___ alle sette. (alzarsi, passat)",["si è alzata"]],["Loro ___ tutto. (dire, passat)",["hanno detto"]],["___ freddo e pioveva. (fare)",["faceva"]],["Che cosa ___ ? (succedere, passat)",["è successo"]],["«No he estat mai a Roma»",["non sono mai stato a roma","non sono mai stata a roma"]],["Tu ___ la porta? (chiudere, passat)",["hai chiuso"]],["I ragazzi ___ tardi. (tornare, passat)",["sono tornati"]],["Quando ero piccolo, ___ un cane. (avere, io)",["avevo"]]],
prod:"Explica la millor setmana de la teva vida en 100 paraules, en passat."},

{id:"10.3", t:"Dia 3 · Repàs del futur i del condicional", html:`
<p>Tots dos surten de la mateixa arrel. Només canvia el final.</p>
<table><tr><th></th><th>Futur</th><th>Condicional</th></tr>
<tr><td>io</td><td>parler<b>ò</b></td><td>parler<b>ei</b></td></tr>
<tr><td>tu</td><td>parler<b>ai</b></td><td>parler<b>esti</b></td></tr>
<tr><td>lui, lei</td><td>parler<b>à</b></td><td>parler<b>ebbe</b></td></tr>
<tr><td>noi</td><td>parler<b>emo</b></td><td>parler<b>emmo</b></td></tr>
<tr><td>voi</td><td>parler<b>ete</b></td><td>parler<b>este</b></td></tr>
<tr><td>loro</td><td>parler<b>anno</b></td><td>parler<b>ebbero</b></td></tr></table>
<p><b>Arrels irregulars:</b> <i>sar-, avr-, andr-, far-, potr-, dovr-, sapr-, vedr-, vivr-, verr-, vorr-, berr-, rimarr-</i>.</p>
<p><b>Quan fer servir cadascun.</b> El futur per a plans i previsions: <i>Domani pioverà.</i> El condicional per demanar, aconsellar i somiar: <i>Vorrei, dovresti, mi piacerebbe.</i></p>`,
ex:[["Domani ___ a Milano. (andare, io, futur)",["andrò"]],["___ un caffè, per favore. (volere, io, condicional)",["vorrei"]],["Loro ___ alle nove. (arrivare, futur)",["arriveranno"]],["Tu ___ studiare di più. (dovere, condicional)",["dovresti"]],["Noi ___ una festa. (fare, futur)",["faremo"]],["Mi ___ vivere in Italia. (piacere, condicional)",["piacerebbe"]],["Lei ___ medico. (essere, futur)",["sarà"]],["Voi ___ aiutarci? (potere, condicional)",["potreste"]],["Io ___ la partita. (vedere, futur)",["vedrò"]],["Al posto tuo, ___ . (partire, io, condicional)",["partirei"]],["Chi ___ ? (vincere, futur)",["vincerà"]],["Noi ___ volentieri. (venire, condicional)",["verremmo"]]],
prod:"Què faràs l'any que ve, i què faries si tinguessis més temps? 8 frases."},

{id:"10.4", t:"Dia 4 · Pronoms combinats: me lo, te lo, glielo", html:`
<p>Quan en una frase hi ha «a qui» i «què» alhora, els dos pronoms van junts. En català dius «me'l dones»; en italià, <i>me lo dai</i>.</p>
<table><tr><th></th><th>+ lo</th><th>+ la</th><th>+ li</th><th>+ le</th><th>+ ne</th></tr>
<tr><td>mi</td><td>me lo</td><td>me la</td><td>me li</td><td>me le</td><td>me ne</td></tr>
<tr><td>ti</td><td>te lo</td><td>te la</td><td>te li</td><td>te le</td><td>te ne</td></tr>
<tr><td>gli, le</td><td><b>glielo</b></td><td><b>gliela</b></td><td><b>glieli</b></td><td><b>gliele</b></td><td><b>gliene</b></td></tr>
<tr><td>ci</td><td>ce lo</td><td>ce la</td><td>ce li</td><td>ce le</td><td>ce ne</td></tr>
<tr><td>vi</td><td>ve lo</td><td>ve la</td><td>ve li</td><td>ve le</td><td>ve ne</td></tr></table>
<p><b>Dues coses a recordar.</b> La <i>i</i> es torna <i>e</i> (<i>mi → me</i>). I a la tercera persona s'escriu tot junt, i <i>glielo</i> serveix per a ell, per a ella i per a ells.</p>
<ul><li><i>Mi dai il libro? → <b>Me lo</b> dai?</i></li>
<li><i>Do il libro a Marco. → <b>Glielo</b> do.</i></li>
<li><i>Dimmelo!</i> (Digue-m'ho!) · <i>Dammelo!</i> (Dona-me'l!)</li></ul>
<p>Aquesta setmana n'hi ha prou amb reconèixer-los quan els sentis.</p>`,
ex:[["Mi dai il libro? → ___ dai?",["me lo"]],["Ti dico la verità. → ___ dico.",["te la"]],["Do il libro a Marco. → ___ do.",["glielo"]],["Mando la foto a Maria. → ___ mando.",["gliela"]],["Ci porti i biglietti? → ___ porti?",["ce li"]],["Vi spiego la regola. → ___ spiego.",["ve la"]],["«Dona-me'l!»",["dammelo"]],["«Digue-m'ho!»",["dimmelo"]],["«T'ho dic demà»",["te lo dico domani"]],["«L'hi dic jo» (a ell)",["glielo dico io"]],["Parlo del problema a Luca. → ___ parlo.",["gliene"]],["«Me'n dones dos?»",["me ne dai due"]]],
prod:"Escriu 5 mini diàlegs de pregunta i resposta amb pronoms combinats. Exemple: Mi presti la penna? Sì, te la presto."},

{id:"10.5", t:"Dia 5 · Explicar una història", html:`
<p>Una bona història té marcadors que guien qui escolta.</p>
<table><tr><th>Moment</th><th>Marcadors</th></tr>
<tr><td>Obrir</td><td><i><b>Una volta</b>…</i> · <i><b>Un giorno</b>…</i> · <i>Due anni fa…</i></td></tr>
<tr><td>Situar</td><td><i><b>All'inizio</b>…</i> · <i>Era… Faceva… C'era…</i></td></tr>
<tr><td>Ordenar</td><td><i><b>prima</b>, <b>poi</b>, <b>dopo</b></i></td></tr>
<tr><td>El gir</td><td><i><b>A un certo punto</b>…</i> · <i><b>All'improvviso</b>…</i></td></tr>
<tr><td>Valorar</td><td><i><b>Per fortuna</b>…</i> · <i><b>Purtroppo</b>…</i></td></tr>
<tr><td>Tancar</td><td><i><b>Alla fine</b>…</i></td></tr></table>
<p><b>Els temps fan la meitat de la feina:</b> imperfetto per al decorat i passato prossimo per al que passa.</p>
<p><i>Una volta sono andato in montagna da solo. Faceva bel tempo e non c'era nessuno. A un certo punto ha cominciato a piovere. Per fortuna avevo una giacca. Alla fine sono tornato a casa bagnato ma contento.</i></p>`,
ex:[["___ volta sono andato in montagna da solo.",["una"]],["All'___ tutto andava bene.",["inizio"]],["___ camminavo, ha cominciato a piovere.",["mentre"]],["All'___ ho sentito un rumore.",["improvviso"]],["Per ___ avevo il telefono.",["fortuna"]],["___ non c'era campo. (malauradament)",["purtroppo"]],["Alla ___ sono tornato a casa.",["fine"]],["___ freddo e non c'era nessuno. (fare, imperfet)",["faceva"]],["A un certo ___ ho visto una luce.",["punto"]],["Ho camminato due ore e ___ ho trovato il sentiero. (després)",["poi","dopo"]]],
prod:"Explica una aventura o un ensurt en 80 paraules, amb almenys 5 marcadors."},

{id:"10.6", t:"Dia 6 · La teva aventura i deu minuts de conversa", html:`
<p>Avui hi ha dues feines, i cap de les dues és escoltar.</p>
<p><b>1. Escriu la teva aventura</b> en 150 paraules, real o inventada, amb els marcadors d'ahir.</p>
<p><b>2. Parla deu minuts.</b> Si tens una persona italiana amb qui parlar, avui és el dia. Si no, grava't responent aquestes preguntes, un minut cadascuna:</p>
<ul><li><i>Di dove sei? Com'è la tua città?</i></li>
<li><i>Che cosa fai nella vita?</i></li>
<li><i>Perché studi italiano?</i></li>
<li><i>Che musica ascolti? Chi è il tuo artista preferito?</i></li>
<li><i>Per quale squadra tifi?</i></li>
<li><i>Sei mai stato in Italia? Dove vorresti andare?</i></li>
<li><i>Che cosa hai fatto lo scorso fine settimana?</i></li>
<li><i>Che cosa farai a Natale?</i></li></ul>
<p>Per guanyar temps quan no et surt una paraula: <i>Allora…</i> · <i>Cioè…</i> · <i>Come si dice…?</i> · <i>Puoi ripetere?</i></p>`,
ex:[["«D'on ets?»",["di dove sei"]],["«Per què estudies italià?»",["perché studi italiano"]],["«Has estat mai a Itàlia?» (a un home)",["sei mai stato in italia"]],["«Què faràs per Nadal?»",["che cosa farai a natale","cosa farai a natale","che farai a natale"]],["«De quin equip ets?»",["per quale squadra tifi"]],["«Quina música escoltes?»",["che musica ascolti"]],["«Fa tres mesos que estudio italià»",["studio italiano da tre mesi"]],["«M'agradaria viure a Itàlia»",["mi piacerebbe vivere in italia"]],["«Pots parlar més a poc a poc?»",["puoi parlare più piano","puoi parlare più lentamente"]],["«Com es diu en italià?»",["come si dice in italiano"]]],
prod:"Escriu una aventura de 150 paraules, real o inventada."},

{id:"11.1", t:"Dia 1 · Repàs: articles i preposicions", html:`
<p>Última setmana. Cada dia repasses un tema i fas els exercicis sense mirar res.</p>
<p><b>Articles.</b> <i>il, i</i> davant de consonant · <i>lo, gli</i> davant de s + consonant, z, gn · <i>l', gli</i> davant de vocal masculina · <i>la, le</i> · <i>l', le</i> davant de vocal femenina. Indeterminats: <i>un, uno, una, un'</i>.</p>
<p><b>Preposicions de lloc:</b></p>
<ul><li><i><b>a</b> Roma</i> (ciutats) · <i><b>in</b> Italia</i> (països i regions) · <i><b>in</b> centro, <b>in</b> ufficio, <b>in</b> banca</i></li>
<li><i><b>da</b> Marco, <b>dal</b> medico</i> (a cal) · <i>vengo <b>da</b> Barcellona</i> (origen)</li>
<li><i><b>al</b> cinema, <b>alla</b> stazione, <b>al</b> mare</i></li></ul>
<p><b>Preposicions de temps:</b> <i><b>alle</b> otto</i> · <i><b>a</b> gennaio</i> · <i><b>nel</b> 2026</i> · <i><b>da</b> tre mesi</i> (des de fa) · <i><b>tra</b> un'ora</i> (d'aquí a) · <i>due anni <b>fa</b></i>.</p>`,
ex:[["___ studente (article determinat)",["lo"]],["___ amiche (article determinat)",["le"]],["___ zaino (article indeterminat)",["uno"]],["___ amica (article indeterminat)",["un'"]],["Vado ___ Roma.",["a"]],["Vado ___ Italia.",["in"]],["Vengo ___ Barcellona.",["da"]],["Vado ___ medico. (da + il)",["dal"]],["Il libro è ___ tavolo. (su + il)",["sul"]],["Studio italiano ___ tre mesi.",["da"]],["La casa ___ miei nonni. (di + i)",["dei"]],["Arrivo ___ dieci minuti. (d'aquí a)",["tra","fra"]]],
prod:"Descriu la teva ciutat i on és cada cosa en 80 paraules."},

{id:"11.3", t:"Dia 3 · Repàs: parlar del passat", html:`
<p><b>Passato prossimo</b> per als fets: <i>ho mangiato, sono andato, mi sono alzato</i>.</p>
<p><b>Imperfetto</b> per al fons i els costums: <i>era, faceva, c'era, andavo</i>.</p>
<p><b>Adverbis entre l'auxiliar i el participi:</b> <i>ho <b>già</b> mangiato</i> · <i>non ho <b>ancora</b> finito</i> · <i>non sono <b>mai</b> stato</i> · <i>sono <b>appena</b> arrivato</i>.</p>
<p><b>Per situar:</b> <i>ieri, ieri sera, la settimana scorsa, due giorni fa, nel 2024</i>.</p>
<p><b>Concordança:</b> amb <i>essere</i> sempre (<i>siamo andati</i>), i amb <i>avere</i> només si hi ha <i>lo, la, li, le</i> al davant (<i>l'ho vista</i>).</p>`,
ex:[["Ieri ___ tardi. (alzarsi, io)",["mi sono alzato","mi sono alzata"]],["Noi ___ a Roma nel 2024. (andare)",["siamo andati","siamo andate"]],["Lei ___ una lettera. (scrivere, passat)",["ha scritto"]],["Da bambino ___ sempre. (giocare, io)",["giocavo"]],["___ le dieci quando è arrivato. (essere)",["erano"]],["Loro ___ il treno. (perdere, passat)",["hanno perso"]],["«Encara no he menjat»",["non ho ancora mangiato"]],["«Acabo d'arribar»",["sono appena arrivato","sono appena arrivata"]],["Mentre ___ la doccia, ha telefonato Luca. (fare, io)",["facevo"]],["Il film mi ___ molto. (piacere, passat)",["è piaciuto"]],["Hai visto Maria? Sì, l'ho ___ ieri. (vedere)",["vista"]],["«fa dos dies»",["due giorni fa"]]],
prod:"Què has fet aquestes onze setmanes? 100 paraules en passat."},

{id:"11.4", t:"Dia 4 · Repàs: els pronoms", html:`

{id:"11.5", t:"Dia 5 · Repàs: futur, condicional, imperatiu i la resta", html:`

{id:"11.6", t:"Dia 6 · Simulacre de la prova final", html:`

{id:"11.7", t:"Dia 7 · Prova final", html:`
