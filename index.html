const AV = "ho hai ha abbiamo avete hanno".split(" "), ES = "sono sei è siamo siete sono".split(" ");
function vPart(v){
  const [inf, , o] = v;
  if (o.pp) return o.pp;
  return inf.slice(0, -3) + (inf.endsWith("are") ? "ato" : inf.endsWith("ere") ? "uto" : "ito");
}
function vFutStem(v){
  const [inf, , o] = v;
  if (o.fs) return o.fs;
  if (!inf.endsWith("are")) return inf.slice(0, -1);
  let s = inf.slice(0, -3);
  if (/[cg]$/.test(s)) s += "h";
  else if (/[cg]i$/.test(s)) s = s.slice(0, -1);
  return s + "er";
}
/* Retorna 6 formes. Al passato prossimo amb essere, cada forma és "masculí|femení". */
function conj(v, tense){
  const [inf, , o] = v, stem = inf.slice(0, -3);
  if (tense === "pres"){
    if (o.pres) return o.pres.split(" ");
    if (inf.endsWith("are")){
      const hard = /[cg]$/.test(stem), soft = /i$/.test(stem);
      return [stem + "o", hard ? stem + "hi" : soft ? stem : stem + "i", stem + "a", hard ? stem + "hiamo" : soft ? stem + "amo" : stem + "iamo", stem + "ate", stem + "ano"];
    }
    if (inf.endsWith("ere")) return ["o","i","e","iamo","ete","ono"].map(e => stem + e);
    if (o.isc) return ["isco","isci","isce","iamo","ite","iscono"].map(e => stem + e);
    return ["o","i","e","iamo","ite","ono"].map(e => stem + e);
  }
  if (tense === "pp"){
    const p = vPart(v);
    if (o.aux !== "e") return AV.map(a => a + " " + p);
    const b = p.slice(0, -1);
    return ES.map((a, i) => i < 3 ? a + " " + b + "o|" + a + " " + b + "a" : a + " " + b + "i|" + a + " " + b + "e");
  }
  if (tense === "imp"){
    if (o.imp) return o.imp.split(" ");
    const b = o.ib || inf.slice(0, -2);
    return ["vo","vi","va","vamo","vate","vano"].map(e => b + e);
  }
  const fs = vFutStem(v);
  if (tense === "fut") return ["ò","ai","à","emo","ete","anno"].map(e => fs + e);
  return ["ei","esti","ebbe","emmo","este","ebbero"].map(e => fs + e);
}

function moka(state, size, extra){
  state = state || "idle";
  const s = size || 96, EY = 62;
  const eyeOpen = (cx, dx, dy) => '<circle cx="' + cx + '" cy="' + EY + '" r="8.2" fill="#fff" stroke="var(--m-ink)" stroke-width="1.6"/><circle cx="' + (cx + (dx || 0.8)) + '" cy="' + (EY + 0.8 + (dy || 0)) + '" r="4.4" fill="var(--m-ink)"/><circle cx="' + (cx + (dx || 0.8) + 1.3) + '" cy="' + (EY - 0.8 + (dy || 0)) + '" r="1.3" fill="#fff"/>';
  const arc = (up, w) => '<path d="M41.5 ' + (EY + 2) + ' q6.5 ' + (up ? -8 : 5) + ' 13 0 M65.5 ' + (EY + 2) + ' q6.5 ' + (up ? -8 : 5) + ' 13 0" fill="none" stroke="var(--m-ink)" stroke-width="' + (w || 3.4) + '" stroke-linecap="round"/>';
  let eyes, mouth, xtra = "";
  if (state === "happy" || state === "wave"){
    eyes = arc(true);
    mouth = '<path d="M52 74 q8 9 16 0 z" fill="var(--m-ink)" stroke="var(--m-ink)" stroke-width="2" stroke-linejoin="round"/><path d="M56 78 q4 3 8 0" fill="#FF8FA3"/>';
  } else if (state === "cele"){
    eyes = arc(true, 3.6);
    mouth = '<path d="M49 72 q11 15 22 0 z" fill="var(--m-ink)" stroke="var(--m-ink)" stroke-width="2" stroke-linejoin="round"/><path d="M54 78 q6 5 12 0" fill="#FF8FA3"/>';
    xtra = '<g class="spark"><path d="M10 40 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2z" fill="var(--sun)"/><path d="M106 70 l1.6 -5 l1.6 5 l5 1.6 l-5 1.6 l-1.6 5 l-1.6 -5 l-5 -1.6z" fill="var(--sun)"/><path d="M102 4 l1.3 -4 l1.3 4 l4 1.3 l-4 1.3 l-1.3 4 l-1.3 -4 l-4 -1.3z" fill="var(--sun)"/></g>';

    eyes = eyeOpen(48, 0, 1.4) + eyeOpen(72, 0, 1.4) + '<path d="M40 52 l11 -4 M80 52 l-11 -4" stroke="var(--m-ink)" stroke-width="3" stroke-linecap="round"/>';

    eyes = arc(false, 3.2);
    mouth = '<ellipse cx="60" cy="77" rx="3" ry="3.6" fill="var(--m-ink)"/>';

    mouth = '<path d="M55 77 h10" stroke="var(--m-ink)" stroke-width="3" stroke-linecap="round"/>';
  } else {
    eyes = '<g class="blink">' + eyeOpen(48) + eyeOpen(72) + '</g>';
    mouth = '<path d="M53.5 74 q6.5 6 13 0" fill="none" stroke="var(--m-ink)" stroke-width="3" stroke-linecap="round"/>';
  }
  const steam = (state === "sleep" || state === "sad") ? "" : '<g class="steam" fill="none" stroke="var(--m-steam)" stroke-width="4" stroke-linecap="round"><path d="M44 6 q-6 -7 0 -14 q6 -7 0 -14"/><path d="M60 2 q-6 -7 0 -14 q6 -7 0 -14"/><path d="M76 6 q-6 -7 0 -14 q6 -7 0 -14"/></g>';
  const arm = state === "wave" ? '<g class="arm"><path d="M27 70 Q14 66 11 53" fill="none" stroke="var(--m-crust-d)" stroke-width="6.5" stroke-linecap="round"/><circle cx="10.5" cy="49.5" r="6" fill="var(--m-crust)" stroke="var(--m-crust-d)" stroke-width="2.5"/></g>' : "";
  const leaf = (x, y, r, k) => '<g transform="translate(' + x + ' ' + y + ') rotate(' + r + ') scale(' + (k || 1) + ')"><path d="M-8 0 Q0 -7 8 0 Q0 7 -8 0z" fill="var(--m-basil)"/><path d="M-6 0 H6" stroke="var(--m-basil-d)" stroke-width="1.2" stroke-linecap="round"/></g>';

      eyes + mouth + arm +
      '<ellipse cx="60" cy="133" rx="24" ry="3" fill="var(--m-ink)" opacity=".12"/>' +

function blank(){ return {v:1, start:"2026-10-12", npd:14, inclT:false, cards:{}, known:{}, log:{}, texts:{}, ex:{}, name:"", theme:"auto", sound:true, tests:{}, vb:{}, lastBackup:0, onboard:false, xp:0, ach:{}, st:{}, frz:0, frzDay:0, frozen:{}, rd:{}, lx:{}}; }
function valid(o){ return o && typeof o === "object" && o.v === 1 && o.cards && typeof o.cards === "object"; }
function load(){
  try { const o = JSON.parse(localStorage.getItem(KEY)); if (valid(o)) { const s = Object.assign(blank(), o); if (Object.keys(s.cards).length || Object.keys(s.log).length) s.onboard = true; return s; } } catch(e){}
  return blank();
}
let S = load(), saveOk = true;

/* ================= dates i pla ================= */
function now(){ const m = /[?&]d=(\d{4})-(\d{2})-(\d{2})/.exec(location.search); if (!m) return new Date(); const n = new Date(); return new Date(+m[1], +m[2] - 1, +m[3], n.getHours(), n.getMinutes()); }
const dn = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
const fromDn = n => { const u = new Date(n * 864e5); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate()); };
function parseDay(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(2026, 9, 12); }
const isoDay = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const T = () => dn(now());
function L(day){ const k = String(day === undefined ? T() : day); const l = S.log[k] || (S.log[k] = {r:0, n:0, d:[0,0,0,0], c:0, t:0}); if (l.c === undefined) { l.c = 0; l.t = 0; } return l; }
const peek = day => S.log[String(day)] || null;
const active = day => { const l = peek(day); return !!l && (l.r > 0 || (l.t || 0) > 0 || l.d.some(Boolean)); };
function plan(){
  const di = T() - dn(parseDay(S.start));
  if (di < 0) return {pre:true, di, week:1, dow:0, lesson:LESSONS[0], prod:LESSONS[0].prod};
  const week = Math.floor(di / 7) + 1, dow = di % 7 + 1;
  if (week > 11) return {over:true, di, week:11, dow, lesson:null, prod:"Escriu en italià sobre el teu dia: què has fet, què has escoltat o llegit i què faràs demà."};
  const lesson = LESSONS.find(l => l.id === week + "." + dow) || null;
  return {di, week, dow, lesson, prod: lesson ? lesson.prod : WEEKS[week].p};
}
const longDate = d => DAYS[(d.getDay() + 6) % 7] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
function streak(){ let d = T(), n = 0; if (!active(d)) d--; while (onDay(d)) { n++; d--; } return n; }

/* ================= dades derivades ================= */
const SEARCH = D.map(r => strip(r[0] + " " + r[3]));
const gloss = id => D[id - 1][3].split(/[;(]/)[0].trim();
const catOf = pos => pos === "nm" || pos === "nf" ? "n" : pos === "v" ? "v" : pos === "adj" ? "adj" : pos === "adv" ? "adv" : "g";
const SYN = new Map();
D.forEach((r, i) => { const g = strip(gloss(i + 1)); if (!SYN.has(g)) SYN.set(g, new Set()); SYN.get(g).add(r[0].toLowerCase()); });
const cleanTok = t => t.replace(/^[«"“(¿¡—]+|[.,!?;:»"”)]+$/g, "");
const toks = id => D[id - 1][4].split(/\s+/).map(cleanTok).filter(Boolean);
const LOW = new Set();
D.forEach((r, i) => { LOW.add(r[0].toLowerCase()); toks(i + 1).slice(1).forEach(t => { if (t === t.toLowerCase()) LOW.add(t); }); });
const normAns = s => String(s).toLowerCase().trim().replace(/[’`´‘]/g, "'").replace(/[.!?¿¡,]+$/g, "").replace(/\s+/g, " ").trim();
function clozeOf(id){
  const r = D[id - 1], s = r[4], hw = r[0], ns = strip(s), h = strip(hw);
  if (ns.length !== s.length) return null;
  if (/\s/.test(hw) || hw.includes("'")){
    const i = ns.indexOf(h); if (i < 0) return null;
    const end = i + hw.length;
    if ((i > 0 && /[a-z']/.test(ns[i - 1])) || (end < s.length && /[a-z']/.test(ns[end]))) return null;
    return {a:s.slice(0, i), b:s.slice(end), ans:s.slice(i, end)};
  }
  const re = /[A-Za-zÀ-ÿ']+/g, stem = h.length >= 5 ? h.slice(0, h.length - 2) : h.length === 4 ? h.slice(0, 3) : null;
  let m, exact = null, pref = null;
  while ((m = re.exec(s))){ const t = m[0]; if (t.includes("'")) continue; const n = strip(t); if (n === h) { exact = m; break; } if (!pref && stem && n.startsWith(stem) && Math.abs(n.length - h.length) <= 3) pref = m; }
  const k = exact || pref; if (!k) return null;
  return {a:s.slice(0, k.index), b:s.slice(k.index + k[0].length), ans:k[0]};
}
function buildOf(id){
  const s = D[id - 1][4]; if (/[—:0-9]/.test(s)) return null;
  const t = toks(id); if (t.length < 3 || t.length > 8) return null;
  if (LOW.has(t[0].toLowerCase())) t[0] = t[0].toLowerCase();
  return t;
}

/* ================= repàs espaiat ================= */
function dueIds(){ const t = T(), out = []; for (const id in S.cards) if (S.cards[id][0] <= t) out.push(+id); return out.sort((a, b) => S.cards[a][0] - S.cards[b][0] || a - b); }
function newIds(limit){ const out = []; for (let i = 0; i < D.length && out.length < limit; i++){ const id = i + 1; if (S.cards[id] || S.known[id]) continue; if (D[i][2] === "t" && !S.inclT) continue; out.push(id); } return out; }
const newLeft = () => Math.max(0, (L().s ? Math.min(S.npd, 6) : S.npd) - L().n);
function nextCard(c, g){
  let [, ivl, ease, reps, laps] = c || [0, 0, 2.5, 0, 0];
  if (g === 0){ reps = 0; ivl = 0; ease = Math.max(1.3, ease - 0.2); laps++; }
  else if (g === 1){ ivl = reps === 0 ? 1 : Math.max(1, Math.round(ivl * 1.2)); ease = Math.max(1.3, ease - 0.15); reps++; }
  else if (g === 2){ ivl = reps === 0 ? 1 : reps === 1 ? 3 : Math.max(ivl + 1, Math.round(ivl * ease)); reps++; }
  else { ivl = reps === 0 ? 4 : Math.max(ivl + 2, Math.round(ivl * ease * 1.3)); ease = ease + 0.15; reps++; }
  return [T() + ivl, ivl, Math.round(ease * 100) / 100, reps, laps];
}
const hardIds = () => Object.keys(S.cards).map(Number).filter(id => S.cards[id][4] >= 2).sort((a, b) => S.cards[b][4] - S.cards[a][4]);

/* ================= veu i so ================= */
let voice = null;
function pickVoice(){ try { const vs = speechSynthesis.getVoices().filter(v => /^it([-_]|$)/i.test(v.lang)); if (vs.length){ voice = vs.find(v => v.lang === "it-IT") || vs[0]; document.body.classList.add("has-voice"); } } catch(e){} }
if ("speechSynthesis" in window){ pickVoice(); try { speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch(e){} }
function speak(text, rate){ if (!voice) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = voice; u.lang = voice.lang; u.rate = rate || 0.9; speechSynthesis.speak(u); } catch(e){} }
let actx = null;
function beep(ok){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, notes = ok ? [660, 880] : [220, 180];
    notes.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = ok ? "sine" : "triangle"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + i * 0.09); g.gain.exponentialRampToValueAtTime(0.12, t + i * 0.09 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.16); o.connect(g).connect(actx.destination); o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.18); });
  } catch(e){}
}

/* ================= sessions ================= */
let SES = null;
function distract(id, n){
  const cat = catOf(D[id - 1][1]), g0 = strip(gloss(id)), seenG = new Set([g0]), seenW = new Set([D[id - 1][0].toLowerCase()]), out = [];
  const tryAdd = j => { const g = strip(gloss(j)), w = D[j - 1][0].toLowerCase(); if (seenG.has(g) || seenW.has(w)) return; seenG.add(g); seenW.add(w); out.push(j); };
  for (let k = 0; k < 400 && out.length < n; k++){ const j = Math.min(D.length, Math.max(1, id + rnd(501) - 250)); if (catOf(D[j - 1][1]) === cat) tryAdd(j); }
  for (let k = 0; k < 400 && out.length < n; k++) tryAdd(1 + rnd(D.length));
  return out;
}
const recallType = id => clozeOf(id) ? "cloze" : "type";
function reviewType(id){
  const ivl = S.cards[id] ? S.cards[id][1] : 0, x = Math.random();
  if (ivl < 3) return x < 0.5 ? "mcci" : "mcic";
  if (voice && x < 0.2) return "listen";
  if (ivl >= 7 && x < 0.55 && buildOf(id)) return "build";
  return recallType(id);
}
function buildVocab(){
  const q = dueIds().map(id => ({t:reviewType(id), id, rev:true})), nw = newIds(newLeft());
  for (let i = 0; i < nw.length; i += 4){
    const g = nw.slice(i, i + 4);
    g.forEach(id => q.push({t:"intro", id, nw:true}));
    shuffle(g).forEach(id => q.push({t:"mcic", id, nw:true}));
    shuffle(g).forEach(id => q.push({t:"mcci", id, nw:true}));
    shuffle(g).forEach(id => q.push({t:recallType(id), id, nw:true, last:true}));
  }
  if (nw.length >= 4) q.push({t:"match", ids:shuffle(nw).slice(0, 5)});
  return q;
}
function pool(min){
  let ids = Object.keys(S.cards).map(Number).concat(Object.keys(S.known).map(Number));
  if (ids.length < min) { const p = plan(), b = Math.min(9, p.week - 1); ids = []; for (let i = b * 200; i < b * 200 + 200; i++) ids.push(i + 1); }
  return ids;
}
function startSession(kind, o){
  o = o || {};
  let q = [], title = "";
  if (kind === "vocab") { q = buildVocab(); title = "Vocabulari"; }
  else if (kind === "more") { const nw = newIds(5); kind = "vocab"; title = "Vocabulari"; nw.forEach(id => q.push({t:"intro", id, nw:true})); shuffle(nw).forEach(id => q.push({t:"mcic", id, nw:true})); shuffle(nw).forEach(id => q.push({t:"mcci", id, nw:true})); shuffle(nw).forEach(id => q.push({t:recallType(id), id, nw:true, last:true})); }
  else if (kind === "frases") { title = "Frases"; q = shuffle(pool(12).filter(buildOf)).slice(0, 10).map(id => ({t:"build", id})); }
  else if (kind === "dictat") { title = "Dictat"; q = shuffle(pool(12)).slice(0, 12).map(id => ({t:"listen", id})); }
  else if (kind === "dificils") { title = "Paraules difícils"; hardIds().slice(0, 12).forEach(id => { q.push({t:"mcci", id}); q.push({t:recallType(id), id}); }); q = shuffle(q); }
  else if (kind === "test") { title = "Prova del bloc " + o.w; const ids = []; for (let i = (o.w - 1) * 200; i < o.w * 200; i++) if (D[i][2] !== "t") ids.push(i + 1); const pick = shuffle(ids).slice(0, 20); q = pick.map((id, i) => ({t: i < 10 ? "mcci" : recallType(id), id})); }
  else if (kind === "gramrev") { title = "Repàs de gramàtica"; q = gramQueue(); if (!q.length) return toast("Primer fes alguna lliçó del curs."); }
  else if (kind === "verbs") { title = "Verbs"; const vs = VERBS.map((v, i) => i).filter(i => o.group === "tots" || (o.group === "irr") === !!VERBS[i][2].pres); for (let i = 0; i < 12; i++) q.push({t:"verb", v:vs[rnd(vs.length)], tense:o.tenses[rnd(o.tenses.length)], p:rnd(6)}); }
  if (!q.length) return toast("Ara mateix no hi ha res per practicar aquí.");
  SES = {kind, o, q, title, done:0, ok:0, ko:0, xp:0, combo:0, best:0, learned:0, err:{}, t0:Date.now(), cur:null, fb:null, back:route().name === "sessio" ? "inici" : location.hash.replace(/^#\//, "") || "inici"};
  nextItem();
  if (route().name === "sessio") render(); else location.hash = "#/sessio";
}
function nextItem(){
  SES.fb = null;
  if (!SES.q.length) { SES.cur = null; return finishSession(); }
  const it = SES.cur = SES.q.shift();
  if (it.t === "mcic" || it.t === "mcci") { it.opts = shuffle([it.id].concat(distract(it.id, 3))); it.pick = null; }
  if (it.t === "cloze") it.c = clozeOf(it.id);
  if (it.t === "build") { const t = buildOf(it.id); if (!t) { it.t = recallType(it.id); if (it.t === "cloze") it.c = clozeOf(it.id); } else { it.toks = t; const extra = []; for (let k = 0; k < 60 && extra.length < 3; k++){ const o = toks(1 + rnd(D.length)); const w = o[rnd(o.length)]; if (w && !t.some(x => x.toLowerCase() === w.toLowerCase()) && !extra.includes(w.toLowerCase())) extra.push(w.toLowerCase()); } it.bank = shuffle(t.concat(extra)); it.sel = []; } }
  if (it.t === "match") { it.left = shuffle(it.ids); it.right = shuffle(it.ids); it.sel = null; it.gone = {}; }
  if (it.t === "listen" && !voice) { it.t = recallType(it.id); if (it.t === "cloze") it.c = clozeOf(it.id); }
}
function setFb(ok, title, detail){
  SES.fb = {ok, title, detail: detail || ""};
  const it = SES.cur;
  if (it.t !== "intro" && it.t !== "match") { beep(ok); const l = L(); l.t++; if (ok) { l.c++; SES.ok++; SES.combo = (SES.combo || 0) + 1; SES.best = Math.max(SES.best || 0, SES.combo); addXP(2); } else { SES.ko++; SES.combo = 0; } }
  if (it.t === "match") addXP(5);
  save(); render();
}
function requeue(it, extra){ const c = Object.assign({}, it, extra || {}); delete c.opts; delete c.pick; delete c.sel; delete c.bank; SES.q.splice(Math.min(3, SES.q.length), 0, c); }
function advance(easy){
  const it = SES.cur, ok = SES.fb.ok, id = it.id;
  if (SES.kind === "vocab" && it.nw && it.t !== "intro"){
    if (!ok) { SES.err[id] = 1; requeue(it); }
    else if (it.last) { S.cards[id] = nextCard(undefined, SES.err[id] ? 1 : 2); const l = L(); l.n++; l.r++; SES.learned++; }
  } else if (SES.kind === "vocab" && it.rev){
    if (!it.retry) { S.cards[id] = nextCard(S.cards[id], ok ? (easy ? 3 : 2) : 0); L().r++; }
    if (!ok) requeue({t:"mcci", id, rev:true, retry:true});
  } else if (it.t === "verb"){
    const k = it.tense, a = S.vb[k] || (S.vb[k] = [0, 0]); a[1]++; if (ok) a[0]++;
    if (!ok && !it.again) requeue(it, {again:true});
  } else if (SES.kind !== "test" && SES.kind !== "vocab" && !ok && !it.again) requeue(it, {again:true});
  SES.done++; save(); nextItem(); render();
  const f = document.querySelector("[data-autofocus]"); if (f) f.focus();
}
function finishSession(){
  const total = SES.ok + SES.ko;
  SES.end = {total, pct: total ? Math.round(SES.ok / total * 100) : 100, mins: Math.max(1, Math.round((Date.now() - SES.t0) / 60000))};
  if (SES.kind === "vocab" && dueIds().length + newIds(newLeft()).length === 0) L().d[0] = 1;
  if (SES.kind === "test") S.tests[SES.o.w] = {ok:SES.ok, total, day:T()};
  const hr = now().getHours(), st = S.st;
  if (total) { st.ses = (st.ses || 0) + 1; addXP(5); if (hr < 8 && hr >= 4) st.early = 1; if (hr >= 23 || hr < 4) st.owl = 1; }
  if (total >= 20 && !SES.ko) st.perf = 1;
  st.combo = Math.max(st.combo || 0, SES.best || 0);
  SES.end.xp = SES.xp || 0;
  save();
}
function checkTyped(){
  const it = SES.cur, inp = $("ans"); if (!inp) return;
  const raw = inp.value, a = normAns(raw); if (!a) return inp.focus();
  it.given = raw;
  if (it.t === "gx") return checkGx(it, raw);
  if (it.t === "verb"){
    const v = VERBS[it.v], forms = conj(v, it.tense), exp = forms[it.p].split("|").map(normAns), ok = exp.includes(a) || exp.some(e => strip(e) === strip(a));
    const exact = exp.includes(a);
    return setFb(ok, ok ? (exact ? "Correcte" : "Correcte, però vigila l'accent") : "No és correcte", '<div class="scroll"><table>' + forms.map((f, i) => '<tr><td class="muted">' + PERS[i] + '</td><td' + (i === it.p ? ' style="font-weight:700"' : "") + '>' + esc(f.split("|")[0]) + '</td></tr>').join("") + '</table></div>');
  }
  const r = D[it.id - 1], hw = normAns(r[0]);
  let exp = hw, alt = false;
  if (it.t === "cloze") exp = normAns(it.c.ans);
  let ok = a === exp, accent = false;
  if (!ok && strip(a) === strip(exp)) { ok = true; accent = true; }
  if (!ok && it.t === "cloze" && (a === hw || strip(a) === strip(hw))) { ok = true; alt = true; }
  if (!ok && it.t === "type") { const set = SYN.get(strip(gloss(it.id))); if (set && set.has(a)) { ok = true; alt = true; } }
  const shown = it.t === "cloze" ? it.c.ans : r[0];
  const title = ok ? (accent ? "Correcte, però vigila l'accent" : alt ? "Correcte" : "Correcte") : "No és correcte";
  const detail = '<p><b style="display:inline;color:inherit">' + esc(shown) + '</b>' + (alt && it.t === "cloze" ? " és la forma que demanava la frase." : alt ? " és la que buscàvem aquí; la teva també val." : "") + '</p><p class="small muted">' + esc(r[4]) + '</p>';
  if (it.t === "listen") speak(r[0]);
  setFb(ok, title, detail);
}

/* ================= vistes de la sessió ================= */
const sayBtn = (text, label) => '<button class="say" type="button" data-say="' + esc(text) + '">' + IC.sound + (label || "Escolta") + '</button>';
const accentRow = () => '<div class="accents">' + ["à","è","é","ì","ò","ù"].map(c => '<button type="button" data-acc="' + c + '" aria-label="Escriu ' + c + '">' + c + '</button>').join("") + '</div>';
const answerBox = (ph) => '<input class="input answer" id="ans" data-autofocus lang="it" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="' + esc(ph || "Escriu en italià") + '"' + (SES.fb ? " disabled" : "") + ' value="' + esc(SES.cur.given || "") + '">' + (SES.fb ? "" : accentRow());
function itemHtml(it){

  if (SES && route().name === "sessio") SES.xp = (SES.xp || 0) + n;

}

}
function vPath(){
  const p = plan(), cur = p.pre ? "l0" : p.over || !p.lesson ? "" : "l" + p.lesson.id, curW = p.pre ? 0 : p.over ? 12 : p.week;
  const per = new Array(10).fill(0); for (let i = 0; i < D.length; i++) if (S.known[i + 1] || S.cards[i + 1]) per[Math.floor(i / 200)]++;
  let k = 0;
  const node = (n, w) => {
    const off = ZIG[k++ % ZIG.length], isCur = n.key === cur, fut = !n.done && !isCur && w > curW;
    const cls = "pnode" + (n.done ? " done" : "") + (isCur ? " cur" : "") + (fut ? " fut" : "") + (n.part && !n.done ? " part" : "");
    const sel = CV.sel === n.key;
    const act = n.test ? 'data-test="' + n.test + '"' : 'data-go="' + n.go + '"';
    return '<div class="prow" style="--off:' + off + '">' +
      (isCur ? '<div class="pmk" style="--side:' + (off > 0 ? -1 : 1) + '">' + moka("idle", 58) + '</div><span class="ptag">Avui</span>' : "") +
      '<button type="button" class="' + cls + '" data-pn="' + n.key + '" aria-label="' + esc(n.t) + '" aria-expanded="' + sel + '">' + IC[n.done ? "check" : n.ic] + '</button>' +
      (sel ? '<div class="pbub"><b' + (n.it ? ' lang="it"' : "") + '>' + esc(n.t) + '</b><span>' + esc(n.sub) + (n.part ? " · " + n.part + (n.done ? " ✓" : "") : "") + '</span><button class="btn sm' + (n.done ? " quiet" : "") + '" type="button" ' + act + '>' + (n.done ? "Repassa" : n.part ? "Continua" : "Comença") + '</button></div>' : "") +
      '</div>';
  };
  let h = '<div class="row between wrap"><h1>Curs</h1>' + cvSeg() + '</div>' +
    '<div class="path">' +
    '<section class="unit u0 intro"><div><span class="uk">Abans de començar</span><h2>Lliçó 0</h2><p>Com funciona el curs i com sona l\'italià.</p></div></section>' +
    '<div class="pgroup u0">' + node({key:"l0", ic:"book", t:LESSONS[0].t.replace(/^Dia \d · /, ""), sub:"Introducció", done: (() => { const s = lessonScore(LESSONS[0]); return !!(s && s.ok / s.total >= 0.8); })(), part: (() => { const s = lessonScore(LESSONS[0]); return s ? s.ok + " de " + s.total : ""; })(), go:"llico/0"}, 0) + '</div>';
  for (let w = 1; w <= 11; w++){
    k = 0;
    const ns = pathNodes(w), dn2 = ns.filter(n => n.done).length;
    h += '<section class="unit u' + ((w - 1) % 4) + (w === curW ? " now" : "") + '"><div class="grow"><span class="uk">Setmana ' + w + (w === curW ? " · ara" : "") + '</span><h2>' + esc(WEEKS[w].w) + '</h2><p>' + esc(WEEKS[w].g.split(".")[0]) + '.</p>' +
      (w <= 10 ? '<div class="ubar" title="Paraules del bloc ' + w + '"><i style="width:' + (per[w - 1] / 2) + '%"></i></div><span class="uw">' + per[w - 1] + ' de 200 paraules del bloc ' + w + '</span>' : '<span class="uw">Repàs final de tot el curs</span>') +
      '</div><span class="ucount num">' + dn2 + "/" + ns.length + '</span></section>' +
      '<div class="pgroup u' + ((w - 1) % 4) + '">' + ns.map(n => node(n, w)).join("") + '</div>';
  }
  h += '<div class="pend">' + moka(p.over ? "cele" : "think", 80) + '<b>' + (p.over ? "Has arribat al final!" : "Al final del camí: l'A2") + '</b></div></div>';
  return h;
}
const cvSeg = () => '<div class="seg" role="group" aria-label="Vista del curs">' + [["cami","Camí"],["llista","Llista"]].map(x => '<button type="button" data-cv="' + x[0] + '" aria-pressed="' + (CV.mode === x[0]) + '">' + x[1] + '</button>').join("") + '</div>';
document.addEventListener("click", e => {
  const t = e.target, pn = t.closest && t.closest("[data-pn]"), cv = t.closest && t.closest("[data-cv]");
  if (cv) { CV.mode = cv.dataset.cv; CV.sel = null; try { localStorage.setItem("italia.cv", CV.mode); } catch(e){} render(); return; }
  if (pn) { CV.sel = CV.sel === pn.dataset.pn ? null : pn.dataset.pn; render(); return; }
  if (CV.sel && route().name === "curs" && !(t.closest && t.closest(".pbub"))) { CV.sel = null; render(); }
});

applyFreeze();
render();

</script>
</body>
