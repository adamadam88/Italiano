<style>
/* Italiano. Layout: rail a l'esquerra en pantalla ampla, barra inferior en tauleta i mòbil; una sola columna alineada a l'esquerra.
   Color: blau «azzurro» per a tota acció, groc sol només per a ratxa i objectiu, verd i vermell només per a encert i error. */
:root{
  --bg:#FBF7F0; --surface:#FFFFFF; --surface-2:#F4EEE4; --ink:#22201C; --ink-2:#6A6157; --ink-3:#9B9184; --line:#EAE2D6;
  --brand:#1E9E4A; --brand-press:#167A38; --on-brand:#FFFFFF; --brand-soft:#E2F4E6;
  --sun:#F5A300; --sun-soft:#FFF0C7; --ok:#1E9E4A; --ok-soft:#DDF3E2; --bad:#E0412F; --bad-soft:#FCE5E1;
  --h0:#EEE7DB; --h1:#BFE5C8; --h2:#7FCB93; --h3:#35A95A; --h4:#167A38;
  --round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Nunito","Segoe UI",system-ui,sans-serif;
  --text:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14110E; --surface:#1E1A16; --surface-2:#2A251F; --ink:#F5F0E8; --ink-2:#B8AEA1; --ink-3:#857B6F; --line:#363029;
    --brand:#3CC76A; --brand-press:#6BDA8F; --on-brand:#06200F; --brand-soft:#173322;
    --sun:#FFC23D; --sun-soft:#3A2E10; --ok:#3CC76A; --ok-soft:#123020; --bad:#FF6A57; --bad-soft:#3E1A15;
    --h0:#2A251F; --h1:#1E4A2C; --h2:#2B7A44; --h3:#3CC76A; --h4:#9BE8B2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14110E; --surface:#1E1A16; --surface-2:#2A251F; --ink:#F5F0E8; --ink-2:#B8AEA1; --ink-3:#857B6F; --line:#363029;
  --brand:#3CC76A; --brand-press:#6BDA8F; --on-brand:#06200F; --brand-soft:#173322;
  --sun:#FFC23D; --sun-soft:#3A2E10; --ok:#3CC76A; --ok-soft:#123020; --bad:#FF6A57; --bad-soft:#3E1A15;
  --h0:#2A251F; --h1:#1E4A2C; --h2:#2B7A44; --h3:#3CC76A; --h4:#9BE8B2; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand)}
p,h1,h2,h3,ul,ol{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.sm{width:18px;height:18px}
svg.ic.fill{fill:currentColor;stroke:none}

/* ---- estructura ---- */
.shell{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:232px minmax(0,1fr)}
.rail{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:var(--surface);padding:28px 16px 20px;display:flex;flex-direction:column;gap:28px}
.logo{font-family:var(--round);font-weight:800;font-size:1.55rem;letter-spacing:-.02em;padding-inline:12px;display:flex;align-items:center;gap:10px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--brand);display:block}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:var(--r-md);font-family:var(--round);font-weight:700;color:var(--ink-2);text-align:left}
@media (hover:hover){.nav button:hover{background:var(--surface-2)}}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.rail-foot{margin-top:auto;padding-inline:12px;font-size:.85rem;color:var(--ink-3)}
.main{min-width:0}
.page{max-width:780px;margin-inline:auto;padding:40px 32px 64px;display:grid;gap:26px}
@media (max-width:959px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:20;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));flex-direction:row}
  .logo,.rail-foot{display:none}
  .nav{grid-auto-flow:column;grid-auto-columns:1fr;width:100%;gap:2px}
  .nav button{flex-direction:column;gap:2px;padding:6px 2px;font-size:.7rem;align-items:center;justify-content:center;text-align:center}
  .nav button:hover{background:none}
  .nav button[aria-current="page"]{background:none}
  .page{padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px));margin-inline:auto;gap:22px}
}

/* ---- tipografia ---- */
h1{font-family:var(--round);font-weight:800;font-size:1.9rem;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--round);font-weight:800;font-size:1.2rem;line-height:1.25;letter-spacing:-.01em}
h3{font-family:var(--round);font-weight:700;font-size:1rem}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
.stack{display:grid;gap:10px}
.stack-lg{display:grid;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* ---- botons ---- */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:var(--r-md);font-family:var(--round);font-weight:700;font-size:1.02rem;background:var(--brand);color:var(--on-brand);transition:transform .08s ease,background .15s ease}
@media (hover:hover){.btn:hover{background:var(--brand-press)}}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.quiet{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
@media (hover:hover){.btn.quiet:hover{background:var(--surface-2)}}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
@media (hover:hover){.btn.soft:hover{background:var(--brand-soft)}}
.btn.sm{min-height:38px;padding:0 14px;font-size:.92rem;border-radius:var(--r-sm)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad);color:var(--surface)}
.btn.onhero{background:var(--on-brand);color:var(--brand)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.link{color:var(--brand);font-weight:600;font-size:.92rem}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
@media (hover:hover){.iconbtn:hover{background:var(--surface-2)}}

/* ---- inici ---- */
.streak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--sun-soft);font-family:var(--round);font-weight:800;color:var(--ink)}
.streak svg{color:var(--sun)}
.streak.off{background:var(--surface-2);color:var(--ink-2)}
.streak.off svg{color:var(--ink-3)}
.week{display:flex;gap:6px}
.week span{width:30px;display:grid;justify-items:center;gap:4px;font-size:.72rem;color:var(--ink-3);font-weight:600}
.week i{width:10px;height:10px;border-radius:50%;background:var(--h0);display:block}
.week .on i{background:var(--sun)}
.week .now{color:var(--ink)}
.hero{background:var(--brand);color:var(--on-brand);border-radius:var(--r-lg);padding:22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.hero h2{font-size:1.4rem}
.hero p{opacity:.85}
.hero .btn{margin-top:12px}
.ring{width:92px;height:92px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:currentColor;opacity:.22}
.ring .pr{stroke:currentColor;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--round);font-weight:800;font-size:1.35rem}
.hero.complete{background:var(--ok-soft);color:var(--ink)}
.hero.complete .ring{color:var(--ok)}
@media (max-width:420px){.hero{grid-template-columns:1fr}.ring{width:72px;height:72px}}

.list{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;border-top:1px solid var(--line);min-height:64px}
.item:first-child{border-top:0}
@media (hover:hover){button.item:hover{background:var(--surface-2)}}
.item .t{font-family:var(--round);font-weight:700}
.item .s{font-size:.9rem;color:var(--ink-2)}
.item .chev{color:var(--ink-3)}
.dot{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;color:transparent}
.dot.done{background:var(--ok);box-shadow:none;color:var(--surface)}
.dot svg{width:16px;height:16px;stroke-width:3}
.badge{font-family:var(--round);font-weight:700;font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.badge.warn{background:var(--sun-soft);color:var(--ink)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.banner{background:var(--sun-soft);border-radius:var(--r-md);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mode{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line);padding:18px;display:grid;gap:6px;text-align:left;align-content:start;min-height:132px;transition:transform .08s ease}
@media (hover:hover){.mode:hover{box-shadow:0 0 0 2px var(--brand)}}
.mode:active{transform:scale(.99)}
.mode .glyph{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:6px}
.mode.main{background:var(--brand);color:var(--on-brand);box-shadow:none}
.mode.main .glyph{background:rgba(255,255,255,.18);color:inherit}
.mode.main .s{color:inherit;opacity:.85}
.mode .t{font-family:var(--round);font-weight:800;font-size:1.08rem}
.mode .s{font-size:.9rem;color:var(--ink-2)}
.mode:disabled{opacity:.5;cursor:default;box-shadow:0 0 0 1px var(--line)}

/* ---- formularis ---- */
.input,textarea,select,input[type="date"],input[type="number"]{background:var(--surface);border-radius:var(--r-md);box-shadow:inset 0 0 0 1.5px var(--line);border:0;padding:12px 14px;max-width:100%;min-height:48px}
.input:focus,textarea:focus,select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--brand)}
textarea{width:100%;min-height:10rem;resize:vertical;line-height:1.5}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-md);box-shadow:inset 0 0 0 1.5px var(--line);padding:0 14px;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;min-height:48px;outline:none;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--round);font-weight:700;font-size:.9rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);min-height:60px}
.switch:first-child{border-top:0}
.switch input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s;cursor:pointer}
.switch input[type="checkbox"]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input[type="checkbox"]:checked{background:var(--brand)}
.switch input[type="checkbox"]:checked::after{transform:translateX(20px)}
.switch input[type="number"]{width:5rem;text-align:center}
.seg{display:inline-flex;width:fit-content;justify-self:start;background:var(--surface-2);border-radius:var(--r-sm);padding:3px}
.seg button{padding:7px 12px;border-radius:8px;font-family:var(--round);font-weight:700;font-size:.88rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,50,.12)}

/* ---- paraules ---- */
.wrow{display:flex;align-items:baseline;gap:12px;width:100%;padding:13px 16px;border-top:1px solid var(--line);text-align:left}
.wrow:first-child{border-top:0}
@media (hover:hover){.wrow:hover{background:var(--surface-2)}}
.wrow .w{font-family:var(--round);font-weight:800;font-size:1.08rem;flex:none;max-width:45%;overflow-wrap:anywhere}
.wrow .g{color:var(--ink-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .st{width:9px;height:9px;border-radius:50%;flex:none;align-self:center;background:var(--h0)}
.wrow .st.rev{background:var(--brand)}
.wrow .st.known{background:var(--ok)}
.wrow .st.fa{background:var(--sun)}

/* ---- full inferior ---- */
.scrim{position:fixed;inset:0;background:rgba(20,14,8,.45);z-index:40;display:grid;align-items:end;justify-items:center}
.sheet{background:var(--surface);width:min(560px,100%);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:88vh;overflow:auto;animation:up .22s ease}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:var(--r-lg)}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.bigword{font-family:var(--round);font-weight:800;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.sent{font-size:1.1rem}
.sent i{font-style:normal;font-weight:600}

/* ---- sessió ---- */
.session{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.s-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;max-width:760px;width:100%;margin-inline:auto}
.track{flex:1;height:10px;border-radius:99px;background:var(--h0);overflow:hidden}
.track i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s ease;min-width:10px}
.s-body{overflow:auto;padding:12px 20px 24px}
.s-in{max-width:620px;margin-inline:auto;display:grid;gap:22px;align-content:start;min-height:100%}
.s-in.center{align-content:center}
.prompt{font-family:var(--round);font-weight:700;color:var(--ink-2);font-size:1rem}
.q{font-family:var(--round);font-weight:800;font-size:clamp(1.9rem,6.5vw,2.7rem);line-height:1.12;letter-spacing:-.02em;overflow-wrap:anywhere}
.q.md{font-size:clamp(1.3rem,4.5vw,1.7rem);line-height:1.25}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 16px;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;font-weight:600;font-size:1.05rem;transition:transform .06s ease}
@media (hover:hover){.opt:hover{box-shadow:inset 0 0 0 2px var(--brand)}}
.opt:active{transform:scale(.99)}
.opt kbd{font-family:var(--round);font-weight:700;font-size:.8rem;width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:var(--ink-3);flex:none}
.opt.right{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.opt.wrong{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.opt.dim{opacity:.5}
@media (max-width:959px){.opt kbd{display:none}}
.answer{font-size:1.25rem;font-weight:600;min-height:58px;width:100%}
.accents{display:flex;gap:6px;flex-wrap:wrap}
.accents button{width:42px;height:42px;border-radius:var(--r-sm);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:1.05rem}
.cloze{font-size:1.3rem;line-height:1.5;font-weight:600}
.cloze u{text-decoration:none;display:inline-block;min-width:4.5ch;border-bottom:3px solid var(--brand);color:var(--brand);padding-inline:4px}
.say{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-family:var(--round);font-weight:700;font-size:.92rem}
body:not(.has-voice) .say{display:none}
.say.big{width:96px;height:96px;border-radius:50%;justify-content:center;padding:0}
.say.big svg{width:40px;height:40px}
.built{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:10px 14px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line);font-weight:600;font-size:1.05rem}
.tile.used{opacity:.25;pointer-events:none}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{min-height:54px;padding:8px 12px;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;text-align:center}
.pair.sel{box-shadow:inset 0 0 0 2px var(--brand);background:var(--brand-soft)}
.pair.gone{opacity:.25;pointer-events:none;background:var(--ok-soft)}
.pair.miss{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.s-foot{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.s-foot .in{max-width:620px;margin-inline:auto;display:grid;gap:12px}
.s-foot.ok{background:var(--ok-soft);border-color:transparent;animation:up .2s ease}
.s-foot.bad{background:var(--bad-soft);border-color:transparent;animation:up .2s ease}
.verdict{display:flex;gap:12px;align-items:flex-start}
.verdict .mark{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--surface)}
.ok .verdict .mark{background:var(--ok)}
.bad .verdict .mark{background:var(--bad)}
.verdict b{font-family:var(--round);font-weight:800;font-size:1.1rem;display:block}
.ok .verdict b{color:var(--ok)}
.bad .verdict b{color:var(--bad)}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line);padding:22px;display:grid;gap:14px}
.finish{text-align:center;justify-items:center}
.finish .burst{width:120px;height:120px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.finish .burst svg{width:60px;height:60px;stroke-width:3}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;width:100%}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line);padding:14px;display:grid;gap:2px;text-align:left}
.stat b{font-family:var(--round);font-weight:800;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--ink-2)}

/* ---- curs ---- */
details.wk{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line);overflow:hidden}
details.wk summary{list-style:none;cursor:pointer;padding:16px;display:flex;gap:14px;align-items:center}
details.wk summary::-webkit-details-marker{display:none}
details.wk summary .n{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--round);font-weight:800;flex:none}
details.wk.now summary .n{background:var(--brand);color:var(--on-brand)}
details.wk[open] summary .chev{transform:rotate(90deg)}
details.wk .in{border-top:1px solid var(--line)}
.prose{display:grid;gap:14px;max-width:66ch}
.prose ul,.prose ol{padding-left:1.3rem;display:grid;gap:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.96rem}
th,td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.82rem;color:var(--ink-2);font-weight:600}
.ex{list-style:none;padding:0;display:grid;gap:12px;counter-reset:ex}
.ex li{display:grid;gap:6px;counter-increment:ex}
.ex label{font-weight:600}
.ex label::before{content:counter(ex) ". ";color:var(--ink-3);font-family:var(--round)}
.ex .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex input{width:13rem}
.ex input.right{box-shadow:inset 0 0 0 2px var(--ok)}
.ex input.wrong{box-shadow:inset 0 0 0 2px var(--bad)}
.fb{font-size:.92rem;font-weight:700}
.fb.right{color:var(--ok)}
.fb.wrong{color:var(--bad)}

/* ---- gràfics ---- */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;width:max-content}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--h0);display:block}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--h0)}
.legend{display:flex;align-items:center;gap:4px;font-size:.78rem;color:var(--ink-2)}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px;border-bottom:1px solid var(--line)}
.bars .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars .bar{width:100%;max-width:38px;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.bars .v{font-size:.78rem;color:var(--ink-2);font-family:var(--round);font-weight:700;min-height:1.1em}
.axis{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:.78rem;color:var(--ink-2);text-align:center;margin-top:6px}
.prog{display:grid;grid-template-columns:4.4rem minmax(0,1fr) 3.6rem;gap:12px;align-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
.prog .tr{height:8px;border-radius:99px;background:var(--h0);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--brand);border-radius:99px}
.prog span:last-child{text-align:right;color:var(--ink-2)}
#tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:600;padding:5px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-130%)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.92rem;animation:up .2s ease;max-width:calc(100% - 32px);text-align:center}
.welcome{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.welcome .in{width:min(440px,100%);display:grid;gap:22px}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice button{padding:14px 8px;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;gap:2px;justify-items:center}
.choice button b{font-family:var(--round);font-weight:800;font-size:1.3rem}
.choice button span{font-size:.82rem;color:var(--ink-2)}
.choice button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--brand);background:var(--brand-soft)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.lg{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--h0)}.lg.rev{background:var(--brand)}.lg.known{background:var(--ok)}.lg.fa{background:var(--sun)}

:root{--m-crust:#F0B25A;--m-crust-d:#B9772A;--m-sauce:#E2452F;--m-cheese:#FFCF5C;--m-mozz:#FFF8E6;--m-basil:#2E9B4A;--m-basil-d:#1B6E31;--m-ink:#2A1A10;--m-steam:#E3D5C0}
.moka{display:block;overflow:visible}
.moka .body{transform-box:fill-box;transform-origin:50% 100%}
.moka .blink{transform-box:fill-box;transform-origin:center;animation:m-blink 5s infinite}
@keyframes m-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.moka.idle .body,.moka.think .body{animation:m-bob 3.2s ease-in-out infinite}
@keyframes m-bob{50%{transform:translateY(-3px)}}
.moka.happy .body{animation:m-hop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes m-hop{35%{transform:translateY(-10px) scaleY(1.04)}70%{transform:translateY(0) scaleY(.95)}}
.moka.cele .body{animation:m-jump 1.1s cubic-bezier(.3,1.4,.5,1) infinite}
@keyframes m-jump{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(2px) scale(1.06,.92)}50%{transform:translateY(-14px) scale(.97,1.05)}80%{transform:translateY(0) scale(1.03,.97)}}
.moka.sad .body{animation:m-droop .9s ease}
@keyframes m-droop{30%{transform:rotate(-5deg)}60%{transform:rotate(3deg)}}
.moka.sleep .body{animation:m-breathe 3.6s ease-in-out infinite}
@keyframes m-breathe{50%{transform:scaleY(.97)}}
.moka.wave .arm{transform-box:fill-box;transform-origin:90% 90%;animation:m-wave 1.2s ease-in-out infinite}
@keyframes m-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
.moka .steam path{opacity:0;animation:m-steam 2.6s ease-out infinite}
.moka .steam path:nth-child(2){animation-delay:.8s}.moka .steam path:nth-child(3){animation-delay:1.6s}
@keyframes m-steam{0%{opacity:0;transform:translateY(10px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-12px)}}
.moka .zz text{animation:m-z 2.4s ease-in-out infinite;opacity:0}
.moka .zz text:nth-child(2){animation-delay:.6s}.moka .zz text:nth-child(3){animation-delay:1.2s}
@keyframes m-z{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.moka .spark path{transform-box:fill-box;transform-origin:center;animation:m-spark 1.1s ease-in-out infinite}
.moka .spark path:nth-child(2){animation-delay:.35s}.moka .spark path:nth-child(3){animation-delay:.7s}
@keyframes m-spark{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.15);opacity:1}}
.moka .drop{animation:m-drop 1.6s ease-in infinite}
@keyframes m-drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(10px);opacity:0}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m-steam:#4A4036}}
:root[data-theme="dark"]{--m-steam:#4A4036}
:root{--ice:#7CC6FF;--ice-soft:#E3F3FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ice:#6BB8F5;--ice-soft:#12304A}}
:root[data-theme="dark"]{--ice:#6BB8F5;--ice-soft:#12304A}
.moka.mini .body,.moka.mini .steam{animation:none}.moka.mini .steam{display:none}
.logo .moka{margin:-6px 0 -4px}

/* ---- la Moka a l'inici ---- */
.coach{display:flex;align-items:flex-end;gap:12px}
.mk-btn{flex:none;border-radius:20px;padding:2px}
.mk-btn:active .moka{transform:scale(.94)}
.bubble{position:relative;background:var(--surface);box-shadow:0 0 0 1.5px var(--line);border-radius:18px;padding:12px 16px;font-weight:600;line-height:1.4;margin-bottom:22px;max-width:46ch;animation:bub .35s cubic-bezier(.2,1.4,.4,1)}
.bubble::before{content:"";position:absolute;left:-8px;bottom:16px;width:14px;height:14px;background:var(--surface);box-shadow:-1.5px 1.5px 0 0 var(--line);transform:rotate(45deg)}
.bubble.pop{animation:bub .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes bub{from{transform:scale(.85);opacity:0;transform-origin:0 100%}to{transform:none;opacity:1}}
.welcome .coach{align-items:center}.welcome .bubble{margin-bottom:0}

.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-family:var(--round);font-weight:800}
.pill.xp{background:var(--brand-soft);color:var(--brand)}
.pill svg{width:20px;height:20px}
.streak svg{transform-origin:50% 90%;animation:flick 2.4s ease-in-out infinite}
.streak.off svg{animation:none}

.week .ice i{background:var(--ice)}

.wotd:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(180,120,0,.18)}
.item.later{opacity:.72}

/* ---- botons tàctils ---- */
.btn{box-shadow:0 4px 0 var(--brand-press);transition:transform .08s ease,box-shadow .08s ease,background .15s ease;margin-bottom:4px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-press)}
.btn.quiet{box-shadow:inset 0 0 0 1.5px var(--line),0 4px 0 var(--line)}
.btn.quiet:active{box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--line)}
.btn.soft{box-shadow:0 4px 0 var(--h1)}
.btn.soft:active{box-shadow:0 1px 0 var(--h1)}
.btn.ok{box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.btn.bad{box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.btn.onhero{box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.sm{box-shadow:0 3px 0 var(--brand-press);margin-bottom:3px}

.btn svg{width:20px;height:20px}
.opt{box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--line);transition:transform .06s ease,box-shadow .06s ease}
.opt:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--line)}
.opt.right{box-shadow:inset 0 0 0 2px var(--ok),0 3px 0 var(--ok);animation:pop2 .35s cubic-bezier(.2,1.6,.4,1)}
.opt.wrong{box-shadow:inset 0 0 0 2px var(--bad),0 3px 0 var(--bad);animation:shake .35s}

.mode{box-shadow:0 0 0 1px var(--line),0 3px 0 var(--line)}

.mode:active{transform:translateY(2px)}
.tile:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line)}

.stat.xp{background:var(--sun-soft);box-shadow:none}
.notes{display:grid;gap:8px;width:100%}
.note{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--brand-soft);font-weight:700;text-align:left;animation:up .3s ease both}
.note:nth-child(2){animation-delay:.15s}.note:nth-child(3){animation-delay:.3s}.note:nth-child(4){animation-delay:.45s}
.note svg{color:var(--brand)}
.note.ice{background:var(--ice-soft)}.note.ice svg{color:var(--ice)}
.note.lvl{background:var(--sun-soft)}.note.lvl svg{color:var(--sun)}

/* ---- avisos i confeti ---- */
.award{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:75;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);padding:10px 18px 10px 10px;border-radius:99px;font-family:var(--round);font-weight:800;box-shadow:0 8px 30px rgba(10,20,50,.18),0 0 0 1.5px var(--line);animation:drop .4s cubic-bezier(.2,1.4,.4,1);max-width:calc(100% - 32px)}
.award .a-ic{width:34px;height:34px;border-radius:50%;background:var(--sun);color:#3A2A00;display:grid;place-items:center;flex:none}

.award .a-ic svg{width:20px;height:20px}
.award.out{transition:opacity .25s,transform .25s;opacity:0;transform:translate(-50%,-12px)}
@keyframes drop{from{transform:translate(-50%,-24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

/* ---- buit ---- */
.empty{display:grid;justify-items:center;gap:6px;padding:22px 16px;text-align:center}
.empty .s{color:var(--ink-2);font-size:.92rem}

/* ---- nivell i assoliments ---- */
.lvbadge{width:52px;height:52px;border-radius:16px;background:var(--sun);color:#3A2A00;display:grid;place-items:center;font-weight:800;font-size:1.5rem;box-shadow:0 4px 0 #C78A00;flex:none}
.frz{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--ice-soft);font-family:var(--round);font-weight:700;color:var(--ink-2)}
.frz svg{color:var(--ice);width:20px;height:20px}.frz b{color:var(--ink)}
.prog.lv{grid-template-columns:4.6rem minmax(0,1fr) auto}
.prog.lv .tr{height:12px}.prog.lv .tr i{background:var(--sun);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{background:var(--surface);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line);padding:14px;display:grid;gap:4px;justify-items:start;align-content:start}
.ach .md{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);margin-bottom:4px}
.ach b{font-family:var(--round);font-weight:800;font-size:.95rem;line-height:1.2}
.ach span:last-child{font-size:.8rem;color:var(--ink-2);line-height:1.3}
.ach:not(.on){opacity:.6}
.ach:not(.on) .md{filter:grayscale(1)}
.ach.on .md{background:var(--sun);color:#3A2A00;box-shadow:0 3px 0 #C78A00}

/* ---- lectures ---- */
.reading{font-size:1.15rem;line-height:1.75}
.tw{border-radius:5px;cursor:pointer;padding:1px 0;transition:background .12s}

.wpop{position:fixed;z-index:65;max-width:min(340px,calc(100% - 16px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;font-size:.95rem;line-height:1.4;box-shadow:0 8px 24px rgba(10,20,50,.25);animation:bub .2s ease;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---- entrada de pàgina ---- */
.page.enter>*{animation:pagein .32s cubic-bezier(.2,.8,.2,1) both}
.page.enter>*:nth-child(2){animation-delay:.03s}.page.enter>*:nth-child(3){animation-delay:.06s}.page.enter>*:nth-child(4){animation-delay:.09s}.page.enter>*:nth-child(5){animation-delay:.12s}.page.enter>*:nth-child(n+6){animation-delay:.15s}

.pnode{width:72px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--u, var(--brand));box-shadow:inset 0 0 0 3px var(--u, var(--brand)),0 6px 0 var(--u-d, var(--brand-press));transition:transform .08s ease,box-shadow .08s ease}

{id:"0", t:"Lliçó 0 · Pronúncia i primeres frases", html:`
<p>L'italià es llegeix gairebé com s'escriu. Amb aquestes regles pots llegir qualsevol paraula en veu alta.</p>
<table><tr><th>S'escriu</th><th>Sona</th><th>Exemples</th></tr>
<tr><td>c + e, i</td><td>«tx»</td><td><i>cena, ciao, dieci</i></td></tr>
<tr><td>c + a, o, u · ch</td><td>«k»</td><td><i>casa, che, chiave</i></td></tr>
<tr><td>g + e, i</td><td>«dj», com <b>metge</b></td><td><i>gelato, oggi</i></td></tr>
<tr><td>gh</td><td>«g» de <b>gat</b></td><td><i>spaghetti</i></td></tr>
<tr><td>gli</td><td>«ll»</td><td><i>famiglia, figlio</i></td></tr>
<tr><td>gn</td><td>«ny»</td><td><i>bagno, signore</i></td></tr>
<tr><td>sc + e, i</td><td>«x» de <b>xocolata</b></td><td><i>pesce, uscire</i></td></tr>
<tr><td>sch</td><td>«sk»</td><td><i>schermo</i></td></tr>
<tr><td>z</td><td>«ts» o «dz»</td><td><i>pizza, zero</i></td></tr>
<tr><td>qu</td><td>«ku», la u sempre sona</td><td><i>quando, cinque</i></td></tr>
<tr><td>h</td><td>muda</td><td><i>ho, hanno</i></td></tr></table>
<p><b>Tres avisos per a qui parla català.</b> Les vocals no es redueixen mai: no hi ha vocal neutra i la <i>o</i> àtona no es torna <i>u</i>. Les consonants dobles s'allarguen i canvien el significat: <i>nono</i> (novè) i <i>nonno</i> (avi). I l'accent només s'escriu a l'última síl·laba (<i>città, perché</i>); les esdrúixoles com <i>tavolo</i> o <i>telefono</i> s'aprenen d'oïda.</p>
<p><b>Primeres frases.</b> Llegeix-les dues vegades en veu alta:</p>
<ul><li><i>Ciao! Mi chiamo Adam.</i> Hola! Em dic Adam.</li>
<li><i>Sono di…</i> Soc de…</li>
<li><i>Ho … anni.</i> Tinc … anys.</li>
<li><i>Studio italiano da oggi.</i> Estudio italià des d'avui.</li>
<li><i>Mi piace il calcio e mi piace la musica.</i> M'agrada el futbol i m'agrada la música.</li></ul>`,
ex:[["«che» sona «ke» o «txe»?",["ke"]],["«cena» comença amb el so «k» o «tx»?",["tx"]],["«famiglia»: «gli» sona com quina lletra catalana?",["ll"]],["«bagno»: «gn» sona com quin dígraf català?",["ny"]],["«pesce»: «sc» sona «sk» o «x»?",["x"]],["Com es diu «Em dic Adam»?",["mi chiamo adam"]],["Com es diu «Tinc vint anys»? (vint = venti)",["ho venti anni","ho vent'anni"]],["Com es diu «M'agrada la música»?",["mi piace la musica"]]],
prod:"Presenta't en quatre frases: com et dius, d'on ets, quants anys tens i dues coses que t'agraden."},

{id:"1.1", t:"Dia 1 · Els articles: il, lo, la, l', i, gli, le", html:`
<p>L'italià té més articles que el català perquè el masculí en té dos. Quin toca depèn de com comença la paraula següent.</p>
<table><tr><th></th><th>Singular</th><th>Plural</th><th>Quan</th></tr>
<tr><td>Masculí</td><td><b>il</b> libro</td><td><b>i</b> libri</td><td>davant de consonant</td></tr>
<tr><td>Masculí</td><td><b>lo</b> studente, <b>lo</b> zaino</td><td><b>gli</b> studenti</td><td>davant de s + consonant, z, gn, ps</td></tr>
<tr><td>Masculí</td><td><b>l'</b>amico</td><td><b>gli</b> amici</td><td>davant de vocal</td></tr>
<tr><td>Femení</td><td><b>la</b> casa</td><td><b>le</b> case</td><td>davant de consonant</td></tr>
<tr><td>Femení</td><td><b>l'</b>amica</td><td><b>le</b> amiche</td><td>davant de vocal</td></tr></table>
<p><b>Com saber el gènere.</b> Les paraules en <i>-o</i> solen ser masculines i les en <i>-a</i>, femenines. Les en <i>-e</i> poden ser qualsevol cosa i s'han d'aprendre amb l'article: <i>il padre, la madre, il mare, la notte</i>.</p>
<p><b>Dues diferències amb el català.</b> Els països porten article (<i>l'Italia, la Spagna</i>) i els possessius també (<i>il mio libro</i>), com en català «el meu llibre».</p>
<p><b>Truc.</b> Si dubtes entre <i>il</i> i <i>lo</i>, digues la paraula en veu alta: <i>il studente</i> costa de pronunciar, <i>lo studente</i> surt sol.</p>`,
ex:[["___ libro",["il"]],["___ casa",["la"]],["___ studente",["lo"]],["___ amico",["l'"]],["___ amica",["l'"]],["___ zaino",["lo"]],["___ ragazzi",["i"]],["___ amici",["gli"]],["___ case",["le"]],["___ stadio",["lo"]],["___ squadra",["la"]],["___ giocatori",["i"]]],
prod:"Tria 5 noms dels blocs 1 i 2 i escriu-los amb l'article, en singular i en plural. Exemple: il libro, i libri."},

{id:"1.2", t:"Dia 2 · Essere i avere", html:`
<p>Són els dos verbs més usats de l'italià, i tots dos són irregulars. S'han de saber de memòria.</p>
<table><tr><th></th><th>essere (ser, estar)</th><th>avere (tenir, haver)</th></tr>
<tr><td>io</td><td><b>sono</b></td><td><b>ho</b></td></tr>
<tr><td>tu</td><td><b>sei</b></td><td><b>hai</b></td></tr>
<tr><td>lui, lei</td><td><b>è</b></td><td><b>ha</b></td></tr>
<tr><td>noi</td><td><b>siamo</b></td><td><b>abbiamo</b></td></tr>
<tr><td>voi</td><td><b>siete</b></td><td><b>avete</b></td></tr>
<tr><td>loro</td><td><b>sono</b></td><td><b>hanno</b></td></tr></table>
<p><b>El pronom es pot ometre</b>, com en català: <i>Sono di Barcellona</i>.</p>
<p><b>Essere fa de «ser» i d'«estar».</b> <i>Sono catalano</i> (soc català), <i>sono stanco</i> (estic cansat), <i>sono a casa</i> (soc a casa). No diguis <i>sto stanco</i>.</p>
<p><b>Avere per a l'edat i les sensacions.</b> <i>Ho vent'anni, ho fame, ho sete, ho sonno, ho freddo, ho paura.</i></p>
<p><b>Ortografia.</b> <i>è</i> amb accent és el verb; <i>e</i> sense accent vol dir «i». La <i>h</i> de <i>ho, hai, ha, hanno</i> no sona, però s'escriu sempre.</p>`,
ex:[["Io ___ catalano. (essere)",["sono"]],["Tu ___ un fratello? (avere)",["hai"]],["Lei ___ di Roma. (essere)",["è"]],["Noi ___ fame. (avere)",["abbiamo"]],["Voi ___ stanchi? (essere)",["siete"]],["Loro ___ due figli. (avere)",["hanno"]],["Io ___ vent'anni. (avere)",["ho"]],["Marco ___ a casa. (essere)",["è"]],["Noi ___ amici. (essere)",["siamo"]],["Tu ___ italiano? (essere)",["sei"]],["Loro ___ di Milano. (essere)",["sono"]],["Voi ___ tempo? (avere)",["avete"]]],
prod:"Escriu 5 frases sobre tu amb «sono» i «ho». Exemple: Sono studente. Ho un fratello."},

{id:"1.3", t:"Dia 3 · Un, uno, una, i el plural", html:`
<p><b>L'article indeterminat</b> segueix la mateixa lògica que <i>il</i> i <i>lo</i>.</p>
<table><tr><th></th><th>Forma</th><th>Exemples</th></tr>
<tr><td>Masculí</td><td><b>un</b></td><td><i>un libro, un amico</i></td></tr>
<tr><td>Masculí davant de s + consonant, z</td><td><b>uno</b></td><td><i>uno studente, uno zaino</i></td></tr>
<tr><td>Femení davant de consonant</td><td><b>una</b></td><td><i>una casa</i></td></tr>
<tr><td>Femení davant de vocal</td><td><b>un'</b></td><td><i>un'amica</i></td></tr></table>
<p><b>El plural no porta mai -s.</b> Canvia la vocal final:</p>
<table><tr><th>Singular</th><th>Plural</th><th>Exemples</th></tr>
<tr><td>-o</td><td>-i</td><td><i>libro, libri · ragazzo, ragazzi</i></td></tr>
<tr><td>-a</td><td>-e</td><td><i>casa, case · ragazza, ragazze</i></td></tr>
<tr><td>-e</td><td>-i</td><td><i>notte, notti · padre, padri</i></td></tr></table>
<p><b>No canvien:</b> les paraules acabades en vocal accentuada (<i>la città, le città · il caffè, i caffè</i>), les estrangeres (<i>il bar, i bar · il film, i film</i>) i les abreujades (<i>la foto, le foto</i>).</p>
<p><b>Per conservar el so «k» i «g»</b> s'hi afegeix una h: <i>amica, amiche · gioco, giochi · lago, laghi</i>. L'excepció més important és <i>amico, amici</i>.</p>
<p><b>Irregulars que cal saber:</b> <i>l'uomo, gli uomini · l'uovo, le uova · la mano, le mani</i>.</p>`,
ex:[["___ studente (un / uno / una / un')",["uno"]],["___ amica",["un'"]],["___ casa",["una"]],["___ amico",["un"]],["Plural de «libro»",["libri"]],["Plural de «casa»",["case"]],["Plural de «notte»",["notti"]],["Plural de «città»",["città"]],["Plural de «amica»",["amiche"]],["Plural de «amico»",["amici"]],["Plural de «uomo»",["uomini"]],["Plural de «film»",["film"]]],
prod:"Descriu la teva habitació en 4 frases. Fes servir «Nella mia camera c'è…» (hi ha, en singular) i «ci sono…» (hi ha, en plural)."},

{id:"1.4", t:"Dia 4 · El present dels verbs en -are i la negació", html:`
<p>La majoria de verbs italians acaben en <i>-are</i> i són regulars. Es treu <i>-are</i> i s'hi afegeixen aquestes terminacions:</p>
<table><tr><th></th><th>parlare</th><th>Terminació</th></tr>
<tr><td>io</td><td>parl<b>o</b></td><td>-o</td></tr>
<tr><td>tu</td><td>parl<b>i</b></td><td>-i</td></tr>
<tr><td>lui, lei</td><td>parl<b>a</b></td><td>-a</td></tr>
<tr><td>noi</td><td>parl<b>iamo</b></td><td>-iamo</td></tr>
<tr><td>voi</td><td>parl<b>ate</b></td><td>-ate</td></tr>
<tr><td>loro</td><td>parl<b>ano</b></td><td>-ano</td></tr></table>
<p><b>L'accent.</b> A <i>loro</i> la força va a l'arrel: <i>PARlano, STUdiano, Abitano</i>. És l'error de pronúncia més habitual.</p>
<p><b>Tres detalls d'ortografia.</b> Els verbs en <i>-care</i> i <i>-gare</i> afegeixen h davant de i: <i>giochi, giochiamo · paghi, paghiamo</i>. Els verbs en <i>-iare</i> no dupliquen la i: <i>studi, mangi, cominci</i>.</p>
<p><b>La negació</b> es fa amb <i>non</i> davant del verb: <i>Non parlo tedesco.</i> Amb <i>niente</i> i <i>mai</i> també hi va: <i>Non capisco niente. Non mangio mai carne.</i></p>
<p><b>La pregunta</b> no canvia l'ordre, només l'entonació: <i>Parli italiano?</i></p>
<p>Verbs en -are del bloc 1 i 2: <i>parlare, studiare, mangiare, giocare, ascoltare, guardare, lavorare, abitare, cercare, comprare, cantare, tornare, arrivare, aspettare, imparare</i>.</p>`,
ex:[["Io ___ italiano. (studiare)",["studio"]],["Tu ___ catalano. (parlare)",["parli"]],["Lui ___ a calcio. (giocare)",["gioca"]],["Noi ___ musica. (ascoltare)",["ascoltiamo"]],["Voi ___ la partita. (guardare)",["guardate"]],["Loro ___ a Roma. (abitare)",["abitano"]],["Tu ___ a calcio? (giocare)",["giochi"]],["Noi ___ insieme. (mangiare)",["mangiamo"]],["Io non ___ oggi. (lavorare)",["lavoro"]],["Lei ___ molto bene. (cantare)",["canta"]],["Tu ___ ogni giorno? (studiare)",["studi"]],["Loro ___ troppo. (parlare)",["parlano"]]],
prod:"Escriu 5 coses que fas i 2 que no fas. Exemple: Ascolto musica ogni giorno. Non guardo la televisione."},

{id:"1.5", t:"Dia 5 · C'è, ci sono i les preguntes", html:`
<p><b>«Hi ha»</b> té dues formes segons el nombre:</p>
<ul><li><b>c'è</b> + singular: <i>C'è un problema.</i></li>
<li><b>ci sono</b> + plural: <i>Ci sono due bar in piazza.</i></li>
<li>En negatiu: <i>Non c'è tempo. Non ci sono biglietti.</i></li>
<li>En pregunta: <i>C'è un bagno? Ci sono domande?</i></li></ul>
<p><b>Les paraules per preguntar:</b></p>
<table><tr><th>Italià</th><th>Català</th><th>Exemple</th></tr>
<tr><td><b>chi</b></td><td>qui</td><td><i>Chi è quel ragazzo?</i></td></tr>
<tr><td><b>che cosa</b>, <b>cosa</b>, <b>che</b></td><td>què</td><td><i>Che cosa fai stasera?</i></td></tr>
<tr><td><b>dove</b></td><td>on</td><td><i>Dove abiti? Dov'è il bagno?</i></td></tr>
<tr><td><b>quando</b></td><td>quan</td><td><i>Quando comincia la partita?</i></td></tr>
<tr><td><b>come</b></td><td>com</td><td><i>Come ti chiami? Com'è il film?</i></td></tr>
<tr><td><b>perché</b></td><td>per què i perquè</td><td><i>Perché studi italiano? Perché mi piace.</i></td></tr>
<tr><td><b>quanto, quanta, quanti, quante</b></td><td>quant</td><td><i>Quanto costa? Quanti anni hai?</i></td></tr>
<tr><td><b>quale, quali</b></td><td>quin, quins</td><td><i>Qual è la tua squadra?</i></td></tr></table>
<p><b>Compte:</b> <i>perché</i> serveix per a la pregunta i per a la resposta, i sempre s'escriu junt i amb accent tancat.</p>`,
ex:[["___ un problema. (hi ha)",["c'è"]],["___ due bar in piazza. (hi ha)",["ci sono"]],["___ ti chiami?",["come"]],["___ abiti?",["dove"]],["___ anni hai?",["quanti"]],["___ è quel ragazzo?",["chi"]],["___ comincia la partita?",["quando"]],["___ studi italiano? — Perché mi piace.",["perché"]],["In classe ___ venti studenti. (hi ha)",["ci sono"]],["___ costa?",["quanto"]],["Non ___ latte. (hi ha)",["c'è"]],["___ fai stasera? (què)",["che cosa","cosa","che"]]],
prod:"Escriu 5 preguntes que faries a un italià que acabes de conèixer, i respon-les tu mateix."},

{id:"1.6", t:"Dia 6 · Sessió llarga: una cançó, un partit i el teu primer text", html:`
<p>Avui no hi ha gramàtica nova. La sessió dura entre 60 i 75 minuts i té tres parts.</p>
<p><b>1. Una cançó amb la lletra (20 minuts).</b> Tria'n una d'antiga, que es canten a poc a poc i s'entenen: <i>Azzurro</i>, d'Adriano Celentano, o <i>Nel blu dipinto di blu</i>, de Domenico Modugno. Segueix aquests quatre passos:</p>
<ol><li>Escolta-la sense lletra i apunta les paraules que reconeixes.</li>
<li>Escolta-la llegint la lletra.</li>
<li>Tria 8 paraules que no coneixes i busca-les.</li>
<li>Canta-la. Sí, en veu alta.</li></ol>
<p><b>2. Un resum de la Serie A (20 minuts).</b> Mira el resum d'un partit d'aquesta jornada al canal oficial, amb el comentari en italià. No intentis entendre-ho tot: caça aquestes paraules del bloc 7, que surten a cada partit: <i>gol, rigore, fallo, portiere, tiro, palla, squadra, arbitro</i>.</p>
<p><b>3. El teu primer text (20 minuts).</b> Escriu-lo a la pestanya Avui. Quan l'acabis, fes servir el botó de copiar perquè una IA te'l corregeixi, i copia a mà la versió corregida.</p>
<p>Abans de començar, fes aquest repàs ràpid de la setmana.</p>`,
ex:[["___ zaino (il / lo / la)",["lo"]],["___ amiche (i / gli / le)",["le"]],["Noi ___ di Barcellona. (essere)",["siamo"]],["Loro ___ fame. (avere)",["hanno"]],["___ amica (un / uno / una / un')",["un'"]],["Plural de «ragazzo»",["ragazzi"]],["Tu ___ a calcio. (giocare)",["giochi"]],["Loro ___ italiano. (studiare)",["studiano"]],["___ tre libri sul tavolo. (hi ha)",["ci sono"]],["___ è il tuo cantante preferito? (qui)",["chi"]]],
prod:"Escriu un text de 60 a 80 paraules presentant-te: qui ets, d'on ets, la teva família, què estudies o on treballes, i què t'agrada fer."},

{id:"1.7", t:"Dia 7 · Prova de la setmana 1", html:`
<p>Vint preguntes sobre tot el que has vist. Fes-les sense mirar res. <b>Amb 16 encerts o més, passes a la setmana 2.</b> Amb menys, repeteix demà les lliçons on hagis fallat i continua igualment amb el calendari.</p>
<p>Després de la prova, <b>grava't un minut amb el mòbil</b> parlant sobre el tema <i>Chi sono e cosa mi piace</i>. No la tornis a escoltar fins a la setmana 4. Guarda-la: és el punt de partida.</p>`,
ex:[["«també» en italià",["anche"]],["«encara» en italià",["ancora"]],["«avui» en italià",["oggi"]],["«demà» en italià",["domani"]],["«on» (per preguntar) en italià",["dove"]],["«mirar» en italià",["guardare"]],["«buscar» en italià",["cercare"]],["«menjar» (verb) en italià",["mangiare"]],["«sortir» en italià",["uscire"]],["«però» en italià (dues lletres)",["ma"]],["___ studente (il / lo)",["lo"]],["___ amici (i / gli)",["gli"]],["Noi ___ amici. (essere)",["siamo"]],["Loro ___ un cane. (avere)",["hanno"]],["Tu ___ a calcio. (giocare)",["giochi"]],["Plural de «amica»",["amiche"]],["___ tre libri sul tavolo. (hi ha)",["ci sono"]],["Tradueix: «Tinc gana.»",["ho fame"]],["Tradueix: «No parlo alemany.» (alemany = tedesco)",["non parlo tedesco"]],["Tradueix: «Com et dius?»",["come ti chiami","come ti chiami?"]]],
prod:"Escriu 5 frases sobre com ha anat la primera setmana. Pots fer servir: È stata facile / difficile. Mi piace… Non capisco…"}
];

{id:"2.1", t:"Dia 1 · El present dels verbs en -ere i -ire", html:`
<p>Després dels verbs en <i>-are</i>, queden dos grups. Les terminacions són gairebé les mateixes entre ells.</p>
<table><tr><th></th><th>prendere</th><th>dormire</th></tr>
<tr><td>io</td><td>prend<b>o</b></td><td>dorm<b>o</b></td></tr>
<tr><td>tu</td><td>prend<b>i</b></td><td>dorm<b>i</b></td></tr>
<tr><td>lui, lei</td><td>prend<b>e</b></td><td>dorm<b>e</b></td></tr>
<tr><td>noi</td><td>prend<b>iamo</b></td><td>dorm<b>iamo</b></td></tr>
<tr><td>voi</td><td>prend<b>ete</b></td><td>dorm<b>ite</b></td></tr>
<tr><td>loro</td><td>prend<b>ono</b></td><td>dorm<b>ono</b></td></tr></table>
<p><b>Què canvia respecte a -are.</b> La tercera persona acaba en <i>-e</i> (parla, però prende) i <i>loro</i> acaba en <i>-ono</i> (parlano, però prendono). <i>Io</i>, <i>tu</i> i <i>noi</i> són iguals als tres grups.</p>
<p><b>L'accent.</b> A <i>loro</i> la força torna a anar a l'arrel: <i>PRENdono, DORmono, SCRIvono</i>.</p>
<p><b>La pronúncia canvia sola.</b> <i>Leggo</i> sona amb g de «gat» i <i>leggi</i> amb «dj». <i>Conosco</i> sona «sk» i <i>conosci</i> sona «x». S'escriu regular; només cal llegir-ho bé.</p>
<p>Verbs d'avui: <i>prendere, vedere, scrivere, leggere, mettere, vivere, chiedere, chiudere, correre, perdere, vendere, credere, rispondere · dormire, partire, sentire, aprire, seguire, offrire</i>.</p>`,
ex:[["Io ___ un caffè. (prendere)",["prendo"]],["Tu ___ molto. (leggere)",["leggi"]],["Lei ___ a Roma. (vivere)",["vive"]],["Noi ___ la porta. (chiudere)",["chiudiamo"]],["Voi ___ la partita? (vedere)",["vedete"]],["Loro ___ una mail. (scrivere)",["scrivono"]],["Io ___ otto ore. (dormire)",["dormo"]],["Tu ___ domani? (partire)",["parti"]],["Lui ___ la finestra. (aprire)",["apre"]],["Noi ___ la Serie A. (seguire)",["seguiamo"]],["Voi ___ questa canzone? (sentire)",["sentite"]],["Loro ___ presto. (dormire)",["dormono"]]],
prod:"Escriu 6 frases sobre un dia normal teu amb verbs en -ere i -ire. Exemple: Leggo le notizie. Dormo sette ore."},

{id:"2.2", t:"Dia 2 · Capisco, finisco, preferisco", html:`
<p>Una part dels verbs en <i>-ire</i> afegeix <b>-isc-</b> a totes les persones menys <i>noi</i> i <i>voi</i>.</p>
<table><tr><th></th><th>capire</th><th>finire</th></tr>
<tr><td>io</td><td>cap<b>isc</b>o</td><td>fin<b>isc</b>o</td></tr>
<tr><td>tu</td><td>cap<b>isc</b>i</td><td>fin<b>isc</b>i</td></tr>
<tr><td>lui, lei</td><td>cap<b>isc</b>e</td><td>fin<b>isc</b>e</td></tr>
<tr><td>noi</td><td>capiamo</td><td>finiamo</td></tr>
<tr><td>voi</td><td>capite</td><td>finite</td></tr>
<tr><td>loro</td><td>cap<b>isc</b>ono</td><td>fin<b>isc</b>ono</td></tr></table>
<p><b>Pronúncia.</b> <i>Capisco</i> i <i>capiscono</i> sonen «sk». <i>Capisci</i> i <i>capisce</i> sonen «x».</p>
<p><b>Quins verbs ho fan?</b> No hi ha regla; s'aprenen. Els més útils: <i>capire, finire, preferire, pulire, spedire, costruire, sparire, unire</i>. No ho fan: <i>dormire, partire, sentire, aprire, seguire, offrire</i>.</p>
<p><b>Tres frases que faràs servir cada dia:</b> <i>Non capisco.</i> · <i>Preferisco il tè al caffè.</i> · <i>Finisco di lavorare alle sei.</i></p>`,
ex:[["Io non ___ . (capire)",["capisco"]],["Tu ___ il tedesco? (capire)",["capisci"]],["Lei ___ di lavorare alle sei. (finire)",["finisce"]],["Noi ___ la pizza. (preferire)",["preferiamo"]],["Voi ___ tutto? (capire)",["capite"]],["Loro ___ la casa il sabato. (pulire)",["puliscono"]],["Io ___ il mare alla montagna. (preferire)",["preferisco"]],["Il film ___ alle undici. (finire)",["finisce"]],["Tu ___ il tè o il caffè? (preferire)",["preferisci"]],["Noi ___ alle otto. (finire)",["finiamo"]],["Loro non ___ l'italiano. (capire)",["capiscono"]],["Io ___ la mia camera. (pulire)",["pulisco"]]],
prod:"Escriu 5 frases amb «Preferisco… a…» sobre música, menjar i esport."},

{id:"2.3", t:"Dia 3 · Fare, andare, venire, stare", html:`
<p>Quatre verbs irregulars que surten a totes les converses.</p>
<table><tr><th></th><th>fare</th><th>andare</th><th>venire</th><th>stare</th></tr>
<tr><td>io</td><td>faccio</td><td>vado</td><td>vengo</td><td>sto</td></tr>
<tr><td>tu</td><td>fai</td><td>vai</td><td>vieni</td><td>stai</td></tr>
<tr><td>lui, lei</td><td>fa</td><td>va</td><td>viene</td><td>sta</td></tr>
<tr><td>noi</td><td>facciamo</td><td>andiamo</td><td>veniamo</td><td>stiamo</td></tr>
<tr><td>voi</td><td>fate</td><td>andate</td><td>venite</td><td>state</td></tr>
<tr><td>loro</td><td>fanno</td><td>vanno</td><td>vengono</td><td>stanno</td></tr></table>
<p><b>Fare</b> es fa servir molt més que «fer»: <i>fare colazione</i> (esmorzar), <i>fare la doccia</i>, <i>fare sport</i>, <i>fare una foto</i>, <i>fare la spesa</i>, <i>che tempo fa?</i></p>
<p><b>Andare</b> canvia de preposició: <i>vado <b>a</b> Roma</i> (ciutat), <i>vado <b>in</b> Italia</i> (país), <i>vado <b>da</b> Marco</i> (a cal Marco), <i>vado <b>a</b> mangiare</i> (a fer una cosa).</p>
<p><b>Venire da</b> diu l'origen: <i>Vengo da Barcellona.</i></p>
<p><b>Stare</b> és per a la salut i per quedar-se: <i>Come stai? Sto bene. Oggi sto a casa.</i></p>`,
ex:[["Io ___ a scuola. (andare)",["vado"]],["Tu che cosa ___ stasera? (fare)",["fai"]],["Lei ___ da Milano. (venire)",["viene"]],["Noi ___ bene, grazie. (stare)",["stiamo"]],["Voi ___ al cinema? (andare)",["andate"]],["Loro ___ sport ogni giorno. (fare)",["fanno"]],["Io ___ colazione alle otto. (fare)",["faccio"]],["Tu ___ con noi? (venire)",["vieni"]],["Come ___ ? (stare, tu)",["stai"]],["Loro ___ in Italia. (andare)",["vanno"]],["Io ___ da Barcellona. (venire)",["vengo"]],["Marco ___ a casa oggi. (stare)",["sta"]]],
prod:"Explica el teu cap de setmana ideal amb fare, andare, venire i stare. 6 frases."},

{id:"2.4", t:"Dia 4 · Dire, sapere, uscire, dare", html:`
<table><tr><th></th><th>dire</th><th>sapere</th><th>uscire</th><th>dare</th></tr>
<tr><td>io</td><td>dico</td><td>so</td><td>esco</td><td>do</td></tr>
<tr><td>tu</td><td>dici</td><td>sai</td><td>esci</td><td>dai</td></tr>
<tr><td>lui, lei</td><td>dice</td><td>sa</td><td>esce</td><td>dà</td></tr>
<tr><td>noi</td><td>diciamo</td><td>sappiamo</td><td>usciamo</td><td>diamo</td></tr>
<tr><td>voi</td><td>dite</td><td>sapete</td><td>uscite</td><td>date</td></tr>
<tr><td>loro</td><td>dicono</td><td>sanno</td><td>escono</td><td>danno</td></tr></table>
<p><b>Sapere o conoscere?</b> Com en català. <i>Sapere</i> és per a fets i per saber fer una cosa: <i>Non lo so. So nuotare.</i> <i>Conoscere</i> és per a persones i llocs: <i>Conosco Marco. Conosco bene Roma.</i></p>
<p><b>Uscire</b> canvia la vocal: <i>esco</i> però <i>usciamo</i>. Es diu <i>uscire <b>di</b> casa</i> i <i>uscire <b>con</b> gli amici</i>.</p>
<p><b>Dà</b> porta accent per no confondre'l amb la preposició <i>da</i>.</p>`,
ex:[["Io non lo ___ . (sapere)",["so"]],["Tu che cosa ___ ? (dire)",["dici"]],["Lei ___ alle otto. (uscire)",["esce"]],["Noi ___ una festa. (dare)",["diamo"]],["Voi ___ nuotare? (sapere)",["sapete"]],["Loro ___ sempre la verità. (dire)",["dicono"]],["Io ___ con gli amici. (uscire)",["esco"]],["Tu mi ___ il tuo numero? (dare)",["dai"]],["Io ___ che hai ragione. (dire)",["dico"]],["Loro ___ stasera. (uscire)",["escono"]],["Sapere o conoscere? Io ___ Roma molto bene.",["conosco"]],["Sapere o conoscere? Io ___ parlare tre lingue.",["so"]]],
prod:"Escriu 3 coses que saps fer (So…) i 3 persones o llocs que coneixes (Conosco…)."},

{id:"2.5", t:"Dia 5 · Els possessius i mi piace", html:`
<p><b>Els possessius</b> porten article, com en català («el meu llibre»).</p>
<table><tr><th></th><th>masc. sing.</th><th>fem. sing.</th><th>masc. pl.</th><th>fem. pl.</th></tr>
<tr><td>meu</td><td>il mio</td><td>la mia</td><td>i miei</td><td>le mie</td></tr>
<tr><td>teu</td><td>il tuo</td><td>la tua</td><td>i tuoi</td><td>le tue</td></tr>
<tr><td>seu</td><td>il suo</td><td>la sua</td><td>i suoi</td><td>le sue</td></tr>
<tr><td>nostre</td><td>il nostro</td><td>la nostra</td><td>i nostri</td><td>le nostre</td></tr>
<tr><td>vostre</td><td>il vostro</td><td>la vostra</td><td>i vostri</td><td>le vostre</td></tr>
<tr><td>d'ells</td><td>il loro</td><td>la loro</td><td>i loro</td><td>le loro</td></tr></table>
<p><b>L'excepció és la família en singular</b>, que va sense article: <i>mia madre, mio fratello, tua sorella</i>. En plural el recupera: <i>i miei fratelli</i>. I amb <i>loro</i> sempre hi va: <i>il loro padre</i>.</p>
<p><b>Mi piace</b> funciona com «m'agrada»: el que agrada és el subjecte.</p>
<ul><li><i>Mi piace il calcio.</i> · <i>Mi piace viaggiare.</i> (singular o infinitiu)</li>
<li><i>Mi piacciono le canzoni italiane.</i> (plural)</li>
<li><i>Ti piace? Gli piace</i> (a ell)<i>. Le piace</i> (a ella)<i>. Ci piace. Vi piace.</i></li>
<li><i>Non mi piace.</i> · <i>Anche a me.</i> (a mi també) · <i>Neanche a me.</i> (a mi tampoc)</li></ul>`,
ex:[["___ libro (el meu)",["il mio"]],["___ casa (la teva)",["la tua"]],["___ amici (els meus)",["i miei"]],["___ madre (la meva)",["mia"]],["___ fratello (el seu)",["suo"]],["___ squadra (la nostra)",["la nostra"]],["___ sorelle (les meves)",["le mie"]],["___ genitori (els teus)",["i tuoi"]],["Mi ___ il calcio. (piacere)",["piace"]],["Mi ___ le canzoni italiane. (piacere)",["piacciono"]],["Ti ___ viaggiare? (piacere)",["piace"]],["Non mi ___ i film dell'orrore. (piacere)",["piacciono"]]],

{id:"2.6", t:"Dia 6 · Números, hores i sessió llarga", html:`
<p><b>Els números fins a 100.</b></p>
<table><tr><td>11 undici</td><td>12 dodici</td><td>13 tredici</td><td>14 quattordici</td><td>15 quindici</td></tr>
<tr><td>16 sedici</td><td>17 diciassette</td><td>18 diciotto</td><td>19 diciannove</td><td>20 venti</td></tr>
<tr><td>30 trenta</td><td>40 quaranta</td><td>50 cinquanta</td><td>60 sessanta</td><td>70 settanta</td></tr>
<tr><td>80 ottanta</td><td>90 novanta</td><td>100 cento</td><td>21 ventuno</td><td>28 ventotto</td></tr></table>
<p>S'escriuen junts. La desena perd la vocal davant de <i>uno</i> i <i>otto</i> (<i>ventuno, trentotto</i>), i <i>tre</i> porta accent al final (<i>ventitré</i>).</p>
<p><b>Les hores.</b> <i>Che ore sono?</i> · <i>Sono le tre.</i> · <i>È l'una.</i> · <i>È mezzogiorno.</i></p>
<ul><li><i>Sono le tre e dieci.</i> (3.10) · <i>e un quarto</i> (3.15) · <i>e mezza</i> (3.30)</li>
<li><i>Sono le quattro meno un quarto.</i> (3.45)</li>
<li><i>A che ora? Alle otto.</i> · <i>di mattina, di pomeriggio, di sera</i></li></ul>
<p><b>Sessió llarga d'avui.</b> Una cançó de Lucio Battisti amb la lletra davant, seguint els quatre passos de la setmana passada. Després, un vídeo d'Easy Italian sobre la família o la rutina. I per acabar, el text de la setmana.</p>`,
ex:[["15 en lletres",["quindici"]],["18 en lletres",["diciotto"]],["21 en lletres",["ventuno"]],["33 en lletres",["trentatré"]],["48 en lletres",["quarantotto"]],["70 en lletres",["settanta"]],["«Són les tres»",["sono le tre"]],["«És la una»",["è l'una"]],["«Són les cinc i mitja»",["sono le cinque e mezza","sono le cinque e mezzo"]],["«A les vuit»",["alle otto"]],["«Quina hora és?»",["che ore sono","che ora è"]],["«Són les vuit i quart»",["sono le otto e un quarto"]]],
prod:"Escriu 80 paraules sobre la teva família i els teus gustos. Posa-hi edats i horaris."},

{id:"2.7", t:"Dia 7 · Prova de la setmana 2", html:`
<p>Vint preguntes sobre el bloc 2 i la gramàtica de la setmana. <b>Amb 16 encerts o més, passes a la setmana 3.</b> Amb menys, repeteix demà les lliçons on hagis fallat i continua amb el calendari.</p>`,
ex:[["«vegada» en italià",["volta"]],["«feina» en italià",["lavoro"]],["«germà» en italià",["fratello"]],["«dona» (persona) en italià",["donna"]],["«vell» en italià",["vecchio"]],["«guanyar» (un partit) en italià",["vincere"]],["«aprendre» en italià",["imparare"]],["«pujar» en italià",["salire"]],["«baixar» en italià",["scendere"]],["«lleig» en italià",["brutto"]],["Tu ___ . (capire)",["capisci"]],["Loro ___ sport. (fare)",["fanno"]],["Io ___ a casa. (andare)",["vado"]],["Noi ___ da Girona. (venire)",["veniamo"]],["Lei ___ alle otto. (uscire)",["esce"]],["___ madre (la meva)",["mia"]],["Mi ___ i gelati. (piacere)",["piacciono"]],["17 en lletres",["diciassette"]],["«Són les vuit i quart»",["sono le otto e un quarto"]],["«No ho sé»",["non lo so"]]],

{id:"3.1", t:"Dia 1 · Potere, dovere, volere", html:`
<p>Tres verbs que van seguits d'un infinitiu, com en català.</p>
<table><tr><th></th><th>potere (poder)</th><th>dovere (haver de)</th><th>volere (voler)</th></tr>
<tr><td>io</td><td>posso</td><td>devo</td><td>voglio</td></tr>
<tr><td>tu</td><td>puoi</td><td>devi</td><td>vuoi</td></tr>
<tr><td>lui, lei</td><td>può</td><td>deve</td><td>vuole</td></tr>
<tr><td>noi</td><td>possiamo</td><td>dobbiamo</td><td>vogliamo</td></tr>
<tr><td>voi</td><td>potete</td><td>dovete</td><td>volete</td></tr>
<tr><td>loro</td><td>possono</td><td>devono</td><td>vogliono</td></tr></table>
<ul><li><i>Posso entrare?</i> · <i>Non posso venire.</i></li>
<li><i>Devo studiare.</i> · <i>Dobbiamo partire presto.</i></li>
<li><i>Voglio imparare l'italiano.</i> · <i>Vuoi un caffè?</i></li></ul>
<p><b>Per demanar una cosa</b> no es diu <i>voglio</i>, que sona brusc. Es diu <b>vorrei</b> (voldria): <i>Vorrei un caffè, per favore.</i></p>
<p><b>Potere o sapere?</b> <i>So nuotare</i> vol dir que en sé. <i>Oggi non posso nuotare</i> vol dir que avui no puc.</p>`,
ex:[["Io ___ uscire stasera. (potere)",["posso"]],["Tu ___ studiare. (dovere)",["devi"]],["Lei ___ un caffè. (volere)",["vuole"]],["Noi ___ partire presto. (dovere)",["dobbiamo"]],["Voi ___ venire? (potere)",["potete"]],["Loro ___ restare. (volere)",["vogliono"]],["Io ___ imparare l'italiano. (volere)",["voglio"]],["Tu ___ aiutarmi? (potere)",["puoi"]],["Lui ___ lavorare domani. (dovere)",["deve"]],["Noi non ___ venire. (potere)",["possiamo"]],["Io ___ andare dal medico. (dovere)",["devo"]],["Voi ___ mangiare qualcosa? (volere)",["volete"]]],
prod:"Escriu 3 coses que has de fer aquesta setmana, 3 que vols fer i 2 que no pots fer."},

{id:"3.2", t:"Dia 2 · Els verbs reflexius", html:`
<p>Funcionen com en català: «em llevo» és <i>mi alzo</i>. El pronom va davant del verb.</p>
<table><tr><th></th><th>alzarsi (llevar-se)</th></tr>
<tr><td>io</td><td><b>mi</b> alzo</td></tr><tr><td>tu</td><td><b>ti</b> alzi</td></tr><tr><td>lui, lei</td><td><b>si</b> alza</td></tr>
<tr><td>noi</td><td><b>ci</b> alziamo</td></tr><tr><td>voi</td><td><b>vi</b> alzate</td></tr><tr><td>loro</td><td><b>si</b> alzano</td></tr></table>
<p>Els de la rutina: <i>svegliarsi</i> (despertar-se), <i>alzarsi</i>, <i>lavarsi</i>, <i>vestirsi</i>, <i>addormentarsi</i> (adormir-se), <i>riposarsi</i>.</p>
<p>Altres de molt usats: <i>chiamarsi</i>, <i>sentirsi</i> (trobar-se), <i>divertirsi</i>, <i>annoiarsi</i> (avorrir-se), <i>arrabbiarsi</i> (enfadar-se), <i>sedersi</i> (asseure's: <i>mi siedo</i>).</p>
<p><b>Amb potere, dovere i volere</b> el pronom pot anar al davant o enganxat a l'infinitiu: <i>Mi devo alzare</i> o <i>Devo alzarmi</i>. Totes dues són correctes.</p>
<p><b>La negació</b> va davant del pronom: <i>Non mi alzo presto.</i></p>`,
ex:[["Io ___ alle sette. (alzarsi)",["mi alzo"]],["Tu come ___ ? (chiamarsi)",["ti chiami"]],["Lei ___ presto. (svegliarsi)",["si sveglia"]],["Noi ___ molto. (divertirsi)",["ci divertiamo"]],["Voi ___ tardi? (alzarsi)",["vi alzate"]],["Loro ___ in fretta. (vestirsi)",["si vestono"]],["Io ___ le mani. (lavarsi)",["mi lavo"]],["Lui ___ Marco. (chiamarsi)",["si chiama"]],["Tu ___ a casa? (annoiarsi)",["ti annoi"]],["Noi ___ alle undici. (addormentarsi)",["ci addormentiamo"]],["Io non ___ bene. (sentirsi)",["mi sento"]],["Loro ___ sempre. (arrabbiarsi)",["si arrabbiano"]]],
prod:"Explica la teva rutina del matí amb 6 verbs reflexius i les hores."},

{id:"3.3", t:"Dia 3 · Les preposicions articulades", html:`
<p>Cinc preposicions es fonen amb l'article, com «del» i «al» en català, però amb totes les formes.</p>
<div class="scroll"><table><tr><th></th><th>il</th><th>lo</th><th>l'</th><th>la</th><th>i</th><th>gli</th><th>le</th></tr>
<tr><td><b>di</b></td><td>del</td><td>dello</td><td>dell'</td><td>della</td><td>dei</td><td>degli</td><td>delle</td></tr>
<tr><td><b>a</b></td><td>al</td><td>allo</td><td>all'</td><td>alla</td><td>ai</td><td>agli</td><td>alle</td></tr>
<tr><td><b>da</b></td><td>dal</td><td>dallo</td><td>dall'</td><td>dalla</td><td>dai</td><td>dagli</td><td>dalle</td></tr>
<tr><td><b>in</b></td><td>nel</td><td>nello</td><td>nell'</td><td>nella</td><td>nei</td><td>negli</td><td>nelle</td></tr>
<tr><td><b>su</b></td><td>sul</td><td>sullo</td><td>sull'</td><td>sulla</td><td>sui</td><td>sugli</td><td>sulle</td></tr></table></div>
<p><b>No cal memoritzar la taula.</b> Tria primer l'article que tocaria (<i>lo stadio</i>) i enganxa-hi la preposició (<i>a + lo = allo stadio</i>).</p>
<ul><li><i>Vado <b>al</b> cinema, <b>alla</b> stazione, <b>allo</b> stadio.</i></li>
<li><i>Vado <b>dal</b> medico.</i> (a cal metge) · <i>Vengo <b>dall'</b>ufficio.</i></li>
<li><i>Le chiavi sono <b>nella</b> borsa.</i> · <i>Il libro è <b>sul</b> tavolo.</i></li>
<li><i>La macchina <b>del</b> professore.</i> · <i>Il colore <b>degli</b> occhi.</i></li></ul>
<p><b>Con</b> i <b>per</b> no es fonen: <i>con il cane, per la strada</i>.</p>`,
ex:[["Vado ___ cinema. (a + il)",["al"]],["Vado ___ stazione. (a + la)",["alla"]],["Vengo ___ ufficio. (da + l')",["dall'"]],["Il libro è ___ tavolo. (su + il)",["sul"]],["Le chiavi sono ___ borsa. (in + la)",["nella"]],["La macchina ___ professore. (di + il)",["del"]],["Vado ___ medico. (da + il)",["dal"]],["Parlo ___ amici. (a + gli)",["agli"]],["Il colore ___ occhi. (di + gli)",["degli"]],["Abito ___ centro. (in + il)",["nel"]],["La casa ___ nonni. (di + i)",["dei"]],["Sono ___ stadio. (a + lo)",["allo"]]],
prod:"Descriu on són 6 coses de casa teva. Exemple: Il telefono è sul tavolo. Le scarpe sono nell'armadio."},

{id:"3.4", t:"Dia 4 · Questo i quello", html:`
<p><b>Questo</b> (aquest) és fàcil: <i>questo libro, questa casa, questi libri, queste case</i>. Davant de vocal es pot apostrofar: <i>quest'anno</i>.</p>
<p><b>Quello</b> (aquell) es comporta com l'article determinat:</p>
<table><tr><th>Article</th><th>Aquell</th><th>Exemple</th></tr>
<tr><td>il</td><td><b>quel</b></td><td><i>quel libro</i></td></tr>
<tr><td>lo</td><td><b>quello</b></td><td><i>quello studente</i></td></tr>
<tr><td>l'</td><td><b>quell'</b></td><td><i>quell'amico, quell'amica</i></td></tr>
<tr><td>la</td><td><b>quella</b></td><td><i>quella casa</i></td></tr>
<tr><td>i</td><td><b>quei</b></td><td><i>quei libri</i></td></tr>
<tr><td>gli</td><td><b>quegli</b></td><td><i>quegli studenti</i></td></tr>
<tr><td>le</td><td><b>quelle</b></td><td><i>quelle case</i></td></tr></table>
<p><b>Sol, sense nom,</b> només té quatre formes: <i>quello, quella, quelli, quelle</i>. <i>Quale vuoi? Quello.</i></p>
<p><b>Bello</b> fa el mateix davant d'un nom: <i>un bel film, un bello stadio, un bell'uomo, dei bei libri, dei begli occhi</i>.</p>`,
ex:[["___ libro (aquell)",["quel"]],["___ studente (aquell)",["quello"]],["___ amico (aquell)",["quell'"]],["___ casa (aquella)",["quella"]],["___ libri (aquells)",["quei"]],["___ studenti (aquells)",["quegli"]],["___ anno (aquest, amb apòstrof)",["quest'"]],["___ ragazze (aquestes)",["queste"]],["___ ragazzi (aquests)",["questi"]],["Un ___ film. (bello)",["bel"]],["Che ___ occhi! (bello)",["begli"]],["Quale vuoi? ___ . (aquell, masculí)",["quello"]]],
prod:"Ets en una botiga. Escriu 5 frases amb questo i quello. Exemple: Quanto costa quella giacca?"},

{id:"3.5", t:"Dia 5 · L'adjectiu: concordança i posició", html:`
<p>Hi ha dos tipus d'adjectius.</p>
<table><tr><th>Tipus</th><th>Singular</th><th>Plural</th></tr>
<tr><td>En -o (quatre formes)</td><td>ross<b>o</b>, ross<b>a</b></td><td>ross<b>i</b>, ross<b>e</b></td></tr>
<tr><td>En -e (dues formes)</td><td>grand<b>e</b></td><td>grand<b>i</b></td></tr></table>
<p><i>Una macchina rossa, due macchine rosse. Un ragazzo simpatico, due ragazze simpatiche. Gli occhi verdi.</i></p>
<p><b>Posició.</b> Normalment va darrere del nom: <i>una casa moderna</i>. Uns quants de molt curts solen anar davant: <i>bello, buono, grande, piccolo, nuovo, vecchio</i>.</p>
<p><b>Invariables:</b> <i>blu, rosa, viola</i>. <i>Due maglie blu.</i></p>
<p><b>Molto té dues vides.</b> Davant d'un adjectiu vol dir «molt» i no canvia: <i>È molto bella.</i> Davant d'un nom vol dir «molts» i concorda: <i>molti amici, molta gente, molte case</i>. El mateix passa amb <i>poco, tanto</i> i <i>troppo</i>.</p>`,
ex:[["una casa ___ (grande)",["grande"]],["due case ___ (grande)",["grandi"]],["una macchina ___ (rosso)",["rossa"]],["i capelli ___ (nero)",["neri"]],["le scarpe ___ (nuovo)",["nuove"]],["un ragazzo ___ (simpatico)",["simpatico"]],["due ragazze ___ (simpatico)",["simpatiche"]],["gli occhi ___ (verde)",["verdi"]],["due maglie ___ (blu)",["blu"]],["Ho ___ amici. (molto)",["molti"]],["È ___ bella. (molto)",["molto"]],["C'è ___ gente. (molto)",["molta"]]],
prod:"Descriu una persona que coneixes, físic i caràcter, en 6 frases."},

{id:"3.6", t:"Dia 6 · Al bar i sessió llarga", html:`
<p><b>Frases per demanar.</b> Són sempre les mateixes; aprèn-les de memòria.</p>
<ul><li><i>Buongiorno. Vorrei un caffè, per favore.</i></li>
<li><i>Per me un cappuccino e un cornetto.</i></li>
<li><i>Prendo un panino con prosciutto e formaggio.</i></li>
<li><i>Da bere? Un'acqua naturale.</i> (sense gas) · <i>frizzante</i> (amb gas)</li>
<li><i>Altro? No, grazie, basta così.</i></li>
<li><i>Quant'è?</i> · <i>Il conto, per favore.</i></li>
<li><i>Posso pagare con la carta?</i> · <i>Un tavolo per due.</i></li></ul>
<p><b>Dues coses que sorprenen.</b> <i>Un caffè</i> és sempre un cafè sol curt. I a molts bars primer es paga a la caixa i després es demana a la barra amb el tiquet.</p>
<p><b>Sessió llarga d'avui.</b> Un vídeo d'Easy Italian gravat en un bar o en un mercat. Una cançó de Lucio Dalla amb la lletra. I el text de la setmana, que avui és un diàleg.</p>`,
ex:[["«Voldria un cafè»",["vorrei un caffè"]],["«El compte, si us plau»",["il conto per favore"]],["«Una taula per a dos»",["un tavolo per due"]],["Noi ___ pagare. (dovere)",["dobbiamo"]],["Io ___ alle otto. (alzarsi)",["mi alzo"]],["Vado ___ bar. (a + il)",["al"]],["___ ragazzi (aquells)",["quei"]],["una pizza ___ (buono)",["buona"]],["Posso ___ con la carta? (pagar)",["pagare"]],["Lei ___ un cappuccino. (volere)",["vuole"]]],
prod:"Escriu un diàleg de 8 línies en un bar entre tu i el cambrer."},
